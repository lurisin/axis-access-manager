// Struttura e area del controller: porte e lettori la ereditano
function areaSelect(sites, selected = 0, name = "area_id") {
  return `<select name="${name}"><option value="0">Nessuna Area</option>${sites.filter((x) => x.id).map((x) => `<optgroup label="${esc(x.name)}">${x.areas.map((a) => `<option value="${a.id}" ${a.id === selected ? "selected" : ""}>${esc(x.name)} › ${esc(a.name)}</option>`).join("")}</optgroup>`).join("")}</select>`;
}

function controllerFields(ctrl, sites) {
  return `<div class="fields-2">${field("Nome", `<input name="name" maxlength="100" value="${esc(ctrl?.name || "Controller A1210")}">`)}
      ${field("Struttura e Area", areaSelect(sites, ctrl?.area_id || 0), 'Porte e lettori del controller stanno qui. Si creano in <a href="#impianti/strutture">Strutture e Aree</a>.')}</div>
    ${field("Descrizione della Posizione", `<input name="description" maxlength="200" value="${esc(ctrl?.description || "")}" placeholder="es. quadro elettrico sotto la scala">`)}
    <h3 class="section-title" style="margin-top:18px">${icon("cog")}Connessione</h3>
    ${field("Indirizzo", `<input name="host" class="mono" value="${esc(ctrl?.host || "")}" placeholder="es. 192.168.1.50">`, "IP o nome del controller, senza https://.")}
    <div class="fields-2">${field("Utente", `<input name="username" autocomplete="off" value="${esc(ctrl?.username || "")}">`)}
    ${field("Password", `<input name="password" type="password" autocomplete="new-password" placeholder="${ctrl?.has_password ? "lascia vuoto per non cambiarla" : ""}">`)}</div>
    ${field("Prefisso MQTT", `<input name="mqtt_topic_prefix" class="mono" value="${esc(ctrl?.mqtt_topic_prefix || "")}" placeholder="es. accessi/controller_ingresso">`, "Lo stesso impostato nel client MQTT del controller: gli eventi arrivano sotto &lt;prefisso&gt;/eventi/…")}
    <div class="field inline"><input type="checkbox" name="verify_ssl" id="f-ssl" ${ctrl?.verify_ssl ? "checked" : ""}><label for="f-ssl">Verifica Certificato HTTPS</label></div>
    <p class="hint" style="margin-top:-8px">Lascialo spento se il controller usa il certificato di fabbrica.</p>
    <div class="row"><button type="button" class="small" id="ctrl-test">${icon("refresh")}Prova Collegamento</button><span id="ctrl-test-result" class="small-text"></span></div>`;
}

function bindControllerFields(root, ctrl) {
  const read = () => ({name: val(root, "name"), host: val(root, "host"), username: val(root, "username"), password: $("[name=password]", root).value,
    mqtt_topic_prefix: val(root, "mqtt_topic_prefix"), verify_ssl: val(root, "verify_ssl"), area_id: Number(val(root, "area_id")), description: val(root, "description")});
  $("#ctrl-test", root).onclick = async () => {
    const out = $("#ctrl-test-result", root);
    out.innerHTML = '<span class="spinner"></span>';
    const f = read();
    try {
      const r = await api("api/controllers/test", {method: "POST", body: {host: f.host, username: f.username, password: f.password, verify_ssl: f.verify_ssl, controller_id: ctrl?.id || null}});
      out.innerHTML = `<span class="pill ok">${esc(r.model)} · firmware ${esc(r.firmware)}</span> ${plural(r.doors.length, "porta", "porte")}: ${r.doors.map((d) => esc(d.name)).join(", ")}`;
    } catch (err) { out.innerHTML = `<span class="pill err">${esc(err.message)}</span>`; }
  };
  return read;
}

async function controllerEditor() {
  const sites = await api("api/locations").catch(() => []);
  let read;
  const result = await modal({
    title: "Nuovo Controller", wide: true,
    body: controllerFields(null, sites),
    actions: [{label: "Annulla", value: null}, {label: "Salva", kind: "primary", submit: true, onClick: async () =>
      (await run(() => api("api/controllers", {method: "POST", body: read()}), "Controller aggiunto: collegamento avviato")) || false}],
    onOpen: (dlg) => { read = bindControllerFields(dlg, null); },
  });
  if (result?.id) { loadSummary(); location.hash = `#impianti/c${result.id}`; }
}

function controllerHeader(ctrl, tab) {
  const tabs = [["", "Schema"], ["porte", "Porte"], ["lettori", "Lettori"], ["telecamere", "Telecamere"], ["citofoni", "Videocitofoni"], ["stato", "Stato"], ["storico", "Storico Modifiche"], ...(can("backup") ? [["backup", "Backup"]] : [])];
  const place = placeOf(ctrl.place);
  return `<div class="ctl-head">
      <div class="small-text muted"><a href="#impianti">Impianti</a>${place ? ` › ${esc(place)}` : ""}</div>
      <div class="row" style="align-items:center"><h2 style="margin:0;font-size:20px">${esc(ctrl.name)}</h2><span class="pill" id="ctl-state"><span class="spinner" style="width:12px;height:12px"></span></span>
        <span class="spacer" style="flex:1"></span><a class="btn small" href="#impianti/c${ctrl.id}/connessione">${icon("cog")}Connessione</a></div>
      ${ctrl.description ? `<div class="muted small-text">${esc(ctrl.description)}</div>` : ""}
    </div>
    ${identityAlert(ctrl)}
    ${tab === "connessione" ? "" : `<div class="segmented">${tabs.map(([k, label]) => `<a href="#impianti/c${ctrl.id}${k ? "/" + k : ""}" class="${tab === k ? "active" : ""}">${label}</a>`).join("")}</div>`}`;
}

function paintControllerState() {
  api("api/status").then((s) => {
    const pill = $("#ctl-state");
    if (!pill) return;
    const changed = s.controllers.some((h) => h.identity_change);
    pill.className = "pill " + (changed || !s.controller.ok ? "err" : "ok");
    pill.innerHTML = `<span class="dot"></span>${changed ? "Controller Cambiato" : s.controller.ok ? `Collegato · ${esc(s.controller.model)}` : "Non Raggiungibile"}`;
    pill.title = s.controller.ok ? `firmware ${s.controller.firmware}` : s.controller.error || "";
  }).catch(() => {});
}

// Pagina Connessione: dati tecnici del controller, raggiunta dall'ingranaggio
async function viewConnection(el, ctrl) {
  const sites = await api("api/locations").catch(() => []);
  el.innerHTML = `${controllerHeader(ctrl, "connessione")}
    <form class="card" id="conn-form" style="max-width:760px">${controllerFields(ctrl, sites)}
      <div class="row" style="margin-top:18px;justify-content:space-between"><button type="button" class="danger" id="ctrl-del">Rimuovi Controller</button>
        <span class="row"><a class="btn" href="#impianti/c${ctrl.id}">Annulla</a><button type="submit" class="primary">Salva</button></span></div></form>`;
  paintIcons(el);
  paintControllerState();
  bindIdentityAlert(el, ctrl);
  const form = $("#conn-form");
  const read = bindControllerFields(form, ctrl);
  const initial = JSON.stringify(read());
  pageGuard = {dirty: () => JSON.stringify(read()) !== initial, save: () => saveConnection(false)};
  async function saveConnection(navigate = true) {
    const ok = await run(() => api(`api/controllers/${ctrl.id}`, {method: "PUT", body: read()}), "Controller salvato: collegamento riavviato");
    if (ok) { pageGuard = null; loadSummary(); if (navigate) location.hash = `#impianti/c${ctrl.id}`; }
    return Boolean(ok);
  }
  form.onsubmit = (e) => { e.preventDefault(); saveConnection(); };
  $("#ctrl-del").onclick = async () => {
    if (await confirmBox("Rimuovi Controller", `Rimuovere <b>${esc(ctrl.name)}</b> e le sue porte dall'app? Sul controller non cambia niente: tessere, gruppi e programmazione restano dove sono.`, "Rimuovi", true) &&
        await run(() => api(`api/controllers/${ctrl.id}`, {method: "DELETE"}), "Controller rimosso dall'app")) { pageGuard = null; loadSummary(); location.hash = "#impianti"; }
  };
}

// Pagina del controller: schema lettori ↔ porte, porte, lettori e storico delle modifiche
async function viewController(el, ctrl, tab) {
  tab = ["porte", "lettori", "telecamere", "citofoni", "stato", "storico", "backup"].includes(tab) ? tab : "";
  el.innerHTML = `${controllerHeader(ctrl, tab)}<div id="c-body">${loadingBox()}</div>`;
  paintIcons(el);
  paintControllerState();
  bindIdentityAlert(el, ctrl);
  const body = $("#c-body");
  // Lo storico dei backup vale per ogni controller, anche quando non risponde
  if (tab === "backup") return viewBackups(body, `controller:${ctrl.id}`);
  const primary = (await api("api/installation")).controllers[0];
  // Nel frattempo si è cambiata pagina o scheda: questa risposta non serve più
  if (!body.isConnected) return;
  if (!primary || primary.id !== ctrl.id) { body.innerHTML = '<div class="card"><div class="empty">La programmazione è disponibile per il controller in uso.</div></div>'; return; }
  // Lo stato non legge la programmazione: deve funzionare anche quando il controller non risponde
  if (tab === "stato") return controllerStatus(body, ctrl);
  // Telecamere e videocitofoni sono impostazioni dell'app sulle porte: non serve leggere il controller
  if (tab === "telecamere") return controllerCameras(body, ctrl);
  if (tab === "citofoni") return controllerIntercoms(body, ctrl);
  let p;
  try { p = await api("api/programming"); } catch (err) { if (!body.isConnected) return; body.innerHTML = errorBox("Programmazione Non Leggibile", err) + '<p class="hint">Controlla il collegamento con l\'ingranaggio Connessione.</p>'; return; }
  if (!body.isConnected) return;
  const errors = p.errors.length ? `<div class="alert">${icon("alert")}<div class="grow"><b>Alcune parti non sono leggibili</b>${p.errors.map(esc).join("<br>")}</div></div>` : "";
  const appDoor = (token) => ctrl.doors.find((d) => d.door_token === token);
  const doorName = (d) => appDoor(d.token)?.name || d.name || p.doors.find((x) => x.token === d.token)?.name || d.token;
  if (tab === "porte") return controllerDoors(body, ctrl, p, errors, appDoor);
  if (tab === "lettori") return controllerReaders(body, p, errors, doorName);
  if (tab === "storico") return controllerHistory(body, p);
  return controllerSchema(body, ctrl, p, errors, appDoor, doorName);
}

const linkKey = (l) => `${l.reader}>${l.door}`;
const linkSig = (l) => `${linkKey(l)}:${l.direction}:${l.enabled ? 1 : 0}`;
function linksOf(p) {
  const links = [];
  p.access_points.forEach((a) => a.readers.forEach((r) => {
    if (a.door && !links.some((l) => l.reader === r && l.door === a.door)) links.push({reader: r, door: a.door, direction: a.direction || "", enabled: a.enabled});
  }));
  return links;
}

const INPUT_ICONS = {"": "chip", rex: "arrow", intercom: "phone", door_monitor: "door", alarm: "alert"};
const DOOR_INPUT_ROLES = ["rex", "intercom", "door_monitor"];
const INPUT_ROLE_HINTS = {
  "": "L'ingresso non fa niente; resta solo lo stato in Home Assistant, se il controller lo manda.",
  rex: "Chiede l'apertura della porta, come un lettore in uscita: per il pulsante della portineria o di uscita.",
  intercom: "Il contatto del relè del citofono: apre la porta anche con Home Assistant spento. Nel registro compare come Relè Citofono.",
  door_monitor: "Il contatto magnetico della porta: abilita gli allarmi di porta forzata e aperta troppo a lungo.",
  alarm: "Nessuna azione sulla porta: lo stato arriva in Home Assistant con il nome scelto.",
};

function controllerSchema(body, ctrl, p, errors, appDoor, doorName) {
  const saved = linksOf(p);
  let pending = saved.map((l) => ({...l}));
  let selected = null, selectedInput = null;
  const inputs = p.inputs || [];
  const inputOf = (io) => inputs.find((i) => i.io === io);
  const linkedDoor = (i) => DOOR_INPUT_ROLES.includes(i.role) && i.door ? i.door : "";
  const inputMeta = (i) => [p.input_roles?.[i.role] || "Non Usato", linkedDoor(i) ? doorName({token: i.door}) : "", i.pins.join(", ")].filter(Boolean).join(" · ");
  const inputDot = (i) => i.port == null ? '<span class="muted" title="Stato non disponibile: il controller non invia eventi per questo ingresso">–</span>'
    : i.active === true ? '<span class="dot warn" title="Attivo"></span>' : i.active === false ? '<span class="dot ok" title="A riposo"></span>' : "";
  const readerName = (token) => { const r = p.readers.find((x) => x.token === token); return r?.name || token; };
  const directionsOf = (door) => [...new Set(p.access_points.filter((a) => a.door === door).map((a) => a.direction || ""))];
  const changes = () => {
    const before = new Map(saved.map((l) => [linkKey(l), l]));
    const after = new Map(pending.map((l) => [linkKey(l), l]));
    const list = [];
    after.forEach((l, k) => {
      const old = before.get(k);
      if (!old) list.push(`Collega ${readerName(l.reader)} → ${doorName({token: l.door})} (${DIRECTION_LABELS[l.direction]})`);
      else if (linkSig(old) !== linkSig(l)) list.push(`${readerName(l.reader)} → ${doorName({token: l.door})}: ${DIRECTION_LABELS[l.direction]}${l.enabled ? "" : ", disattivato"}`);
    });
    before.forEach((l, k) => { if (!after.has(k)) list.push(`Scollega ${readerName(l.reader)} da ${doorName({token: l.door})}`); });
    return list;
  };
  body.innerHTML = `${errors}
    <div class="card">
      <p class="muted small-text" id="sch-hint" style="margin-top:0"></p>
      ${p.readers.length && p.doors.length ? `<div class="schema" id="schema">
        <div class="sch-col"><div class="sch-head">Lettori</div>${p.readers.map((r) => `<button type="button" class="sch-node" data-reader="${esc(r.token)}">
          <span class="ev-icon k-accent">${icon("card")}</span><span class="grow"><b>${esc(r.name || r.token)}</b><span class="sch-meta" data-reader-meta="${esc(r.token)}"></span></span></button>`).join("")}
          ${inputs.length ? `<div class="sch-head" style="margin-top:8px">Ingressi</div>${inputs.map((i) => `<button type="button" class="sch-node" data-input="${esc(i.io)}">
          <span class="ev-icon ${i.role ? "k-info" : "k-muted"}">${icon(INPUT_ICONS[i.role] || "chip")}</span><span class="grow"><b>${esc(i.name)}</b><span class="sch-meta">${esc(inputMeta(i))}</span></span>${inputDot(i)}</button>`).join("")}` : ""}</div>
        <div class="sch-mid"></div>
        <div class="sch-col"><div class="sch-head" style="text-align:right">Porte</div>${p.doors.map((d) => `<button type="button" class="sch-node" data-door="${esc(d.token)}">
          <span class="ev-icon k-ok">${icon("door")}</span><span class="grow"><b>${esc(doorName(d))}</b><span class="sch-meta">${appDoor(d.token) ? esc(d.name && d.name !== doorName(d) ? `sul controller: ${d.name}` : d.token) : "non gestita dall'app"}</span></span></button>`).join("")}</div>
        <svg class="sch-lines" id="sch-svg" aria-hidden="true"></svg><div id="sch-gears"></div>
      </div>` : '<div class="empty">Sul controller non ci sono lettori o porte da collegare.</div>'}
      <p class="hint">Ogni filo è un lettore o un ingresso che comanda una porta. I collegamenti dei lettori si scrivono sul controller solo con Salva; quelli degli ingressi con il Salva della loro scheda. Ogni modifica si può annullare dallo Storico Modifiche.</p>
    </div>
    <div class="save-bar" id="sch-bar" hidden><span class="grow" id="sch-changes"></span><button type="button" id="sch-discard">Scarta</button><button type="button" class="primary" id="sch-save">Salva</button></div>`;
  paintIcons(body);
  const schema = $("#schema");
  if (!schema) return;

  function draw() {
    if (!document.body.contains(schema)) { window.removeEventListener("resize", draw); return; }
    const box = schema.getBoundingClientRect();
    const svg = $("#sch-svg"), gears = $("#sch-gears");
    svg.setAttribute("width", box.width);
    svg.setAttribute("height", box.height);
    const savedSig = new Set(saved.map(linkSig));
    const used = [];
    let paths = "", buttons = "";
    pending.forEach((l, i) => {
      const r = $(`[data-reader="${CSS.escape(l.reader)}"]`, schema), d = $(`[data-door="${CSS.escape(l.door)}"]`, schema);
      if (!r || !d) return;
      const a = r.getBoundingClientRect(), b = d.getBoundingClientRect();
      const x1 = a.right - box.left, y1 = a.top + a.height / 2 - box.top, x2 = b.left - box.left, y2 = b.top + b.height / 2 - box.top;
      const mx = (x1 + x2) / 2;
      const state = !l.enabled ? "off" : savedSig.has(linkSig(l)) ? "ok" : "new";
      paths += `<path d="M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}" class="sch-line ${state}"/>`;
      // Punto del filo per l'ingranaggio, spostato se un altro è già lì (fili che si incrociano)
      let t = 0.5, gx, gy;
      for (const candidate of [0.5, 0.32, 0.68, 0.2, 0.8]) {
        t = candidate;
        const u = 1 - t;
        gx = u * u * u * x1 + 3 * u * u * t * mx + 3 * u * t * t * mx + t * t * t * x2;
        gy = u * u * u * y1 + 3 * u * u * t * y1 + 3 * u * t * t * y2 + t * t * t * y2;
        if (!used.some(([ux, uy]) => Math.hypot(ux - gx, uy - gy) < 34)) break;
      }
      used.push([gx, gy]);
      buttons += `<button type="button" class="sch-gear ${state}" data-link="${i}" style="left:${gx - 17}px;top:${gy - 17}px" title="${esc(readerName(l.reader))} → ${esc(doorName({token: l.door}))} · ${DIRECTION_LABELS[l.direction]}" aria-label="Impostazioni del collegamento ${esc(readerName(l.reader))} verso ${esc(doorName({token: l.door}))}">${icon("cog")}</button>`;
    });
    inputs.forEach((i) => {
      if (!linkedDoor(i)) return;
      const n = $(`[data-input="${CSS.escape(i.io)}"]`, schema), d = $(`[data-door="${CSS.escape(i.door)}"]`, schema);
      if (!n || !d) return;
      const a = n.getBoundingClientRect(), b = d.getBoundingClientRect();
      const x1 = a.right - box.left, y1 = a.top + a.height / 2 - box.top, x2 = b.left - box.left, y2 = b.top + b.height / 2 - box.top;
      const mx = (x1 + x2) / 2;
      paths += `<path d="M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}" class="sch-line input"/>`;
      // Ingranaggio verso l'ingresso, per non sovrapporsi a quelli dei lettori al centro
      const t = 0.3, u = 1 - t;
      const gx = u * u * u * x1 + 3 * u * u * t * mx + 3 * u * t * t * mx + t * t * t * x2;
      const gy = u * u * u * y1 + 3 * u * u * t * y1 + 3 * u * t * t * y2 + t * t * t * y2;
      buttons += `<button type="button" class="sch-gear input" data-input-gear="${esc(i.io)}" style="left:${gx - 17}px;top:${gy - 17}px" title="${esc(i.name)} → ${esc(doorName({token: i.door}))}" aria-label="Impostazioni dell'ingresso ${esc(i.name)}">${icon("cog")}</button>`;
    });
    svg.innerHTML = paths;
    gears.innerHTML = buttons;
  }

  function update() {
    $$("[data-reader]", schema).forEach((n) => n.classList.toggle("sel", n.dataset.reader === selected));
    $$("[data-input]", schema).forEach((n) => n.classList.toggle("sel", n.dataset.input === selectedInput));
    $$("[data-door]", schema).forEach((n) => n.classList.toggle("target", Boolean(selected || selectedInput)));
    $$("[data-reader-meta]", schema).forEach((m) => {
      const mine = pending.filter((l) => l.reader === m.dataset.readerMeta);
      m.textContent = mine.length ? mine.map((l) => `${doorName({token: l.door})} · ${DIRECTION_LABELS[l.direction]}`).join(", ") : "non collegato";
    });
    $("#sch-hint").textContent = selectedInput ? `Ora tocca la porta da collegare a ${inputOf(selectedInput)?.name}, oppure tocca di nuovo l'ingresso per nome, ruolo e cablaggio.`
      : selected ? `Ora tocca la porta da collegare a ${readerName(selected)}. Tocca di nuovo il lettore per annullare.`
      : "Tocca un lettore o un ingresso e poi una porta per collegarli. L'ingranaggio sul filo apre le impostazioni del collegamento.";
    const list = changes();
    $("#sch-bar").hidden = !list.length;
    $("#sch-changes").textContent = list.length ? `Modifiche non salvate: ${list.length === 1 ? list[0] : plural(list.length, "modifica", "modifiche")}` : "";
    $("#sch-changes").title = list.join("\n");
    draw();
  }

  // Stesso punto di accesso (porta e direzione): si attiva e disattiva insieme
  const setEnabled = (l, enabled) => pending.forEach((x) => { if (x.door === l.door && x.direction === l.direction) x.enabled = enabled; });

  async function editLink(l) {
    const dirs = directionsOf(l.door);
    const shared = pending.filter((x) => x !== l && x.door === l.door && x.direction === l.direction).map((x) => readerName(x.reader));
    const result = await modal({title: `${readerName(l.reader)} → ${doorName({token: l.door})}`,
      body: `${field("Direzione", `<select name="direction">${dirs.map((k) => `<option value="${esc(k)}" ${k === l.direction ? "selected" : ""}>${DIRECTION_LABELS[k] ?? esc(k)}</option>`).join("")}</select>`,
        "Ingresso o uscita dalla porta: i gruppi possono dare accesso solo in una direzione.")}
        <div class="field inline"><input type="checkbox" name="enabled" id="f-le" ${l.enabled ? "checked" : ""}><label for="f-le">Collegamento Attivo</label></div>
        <p class="hint" style="margin-top:-8px">Spento: il lettore resta collegato ma non apre la porta.${shared.length ? ` Vale anche per ${esc(shared.join(", "))}, che usano lo stesso punto di accesso.` : ""}</p>`,
      actions: [{label: "Scollega", kind: "danger", value: "unlink"}, {label: "Annulla", value: null}, {label: "Applica", kind: "primary", submit: true, onClick: (dlg) => ({direction: val(dlg, "direction"), enabled: val(dlg, "enabled")})}]});
    if (!result) return;
    if (result === "unlink") pending = pending.filter((x) => x !== l);
    else {
      l.direction = result.direction;
      setEnabled(l, result.enabled);
      l.enabled = result.enabled;
    }
    update();
  }

  async function editInput(i, door = "") {
    let role = i.role;
    if (door && !DOOR_INPUT_ROLES.includes(role)) role = i.roles.find((r) => DOOR_INPUT_ROLES.includes(r)) || "";
    if (door && !DOOR_INPUT_ROLES.includes(role)) { toast(`${i.name}: questo ingresso non si collega a una porta`, true); return; }
    const doorOptions = p.doors.map((d) => `<option value="${esc(d.token)}" ${d.token === (door || i.door) ? "selected" : ""}>${esc(doorName(d))}</option>`).join("");
    const startName = role !== i.role && (i.name === i.default_name || Object.values(p.input_roles).includes(i.name)) ? p.input_roles[role] || i.default_name : i.name;
    const ok = await modal({title: i.name,
      body: `${field("Nome", `<input name="name" maxlength="64" value="${esc(startName)}" placeholder="${esc(i.default_name)}">`, `Morsetti ${esc(i.pins.join(", "))}.${i.port != null ? " È anche il nome dell'entità in Home Assistant." : ""} Compare nel registro per le aperture da questo ingresso.`)}
        ${field("Ruolo", `<select name="role">${i.roles.map((r) => `<option value="${esc(r)}" ${r === role ? "selected" : ""}>${esc(p.input_roles[r])}</option>`).join("")}</select>`, `<span data-role-hint>${esc(INPUT_ROLE_HINTS[role] || "")}</span>${i.io === "DPS" ? " Il ruolo Sensore Porta arriva dopo una prova al banco." : ""}`)}
        <div data-door-field ${DOOR_INPUT_ROLES.includes(role) ? "" : "hidden"}>${field("Porta", `<select name="door">${doorOptions}</select>`)}</div>
        ${field("Contatto", `<select name="contact">${Object.entries(p.contacts).map(([k, v]) => `<option value="${esc(k)}" ${k === i.contact ? "selected" : ""}>${esc(v)}</option>`).join("")}</select>`, "Normalmente Aperto: il contatto si chiude quando si preme il pulsante o scatta il relè.")}
        <div class="field inline"><input type="checkbox" name="supervised" id="f-sup" ${i.supervised ? "checked" : ""} ${i.can_supervise ? "" : "disabled"}><label for="f-sup">Linea Supervisionata</label></div>
        <p class="hint" style="margin-top:-8px">${i.can_supervise ? "Con le resistenze di fine linea il controller riconosce un cavo tagliato o in corto e non lo scambia per una pressione. Attivala solo se le resistenze sono montate. Dopo averla tolta, l'ingresso può risultare attivo finché non riavvii il controller." : "Questo ingresso non supporta la linea supervisionata."}</p>`,
      onOpen: (dlg) => {
        const select = $('[name="role"]', dlg), name = $('[name="name"]', dlg);
        select.onchange = () => {
          // Il nome segue il ruolo finché è quello di serie
          if (!name.value.trim() || name.value.trim() === i.default_name || Object.values(p.input_roles).includes(name.value.trim())) {
            name.value = select.value ? p.input_roles[select.value] : i.default_name;
          }
          $("[data-door-field]", dlg).hidden = !DOOR_INPUT_ROLES.includes(select.value);
          $("[data-role-hint]", dlg).textContent = INPUT_ROLE_HINTS[select.value] || "";
        };
      },
      actions: [{label: "Annulla", value: null}, {label: "Scrivi sul Controller", kind: "primary", submit: true, onClick: async (dlg) =>
        (await saveProgramming(`api/programming/inputs/${encodeURIComponent(i.io)}`, {name: val(dlg, "name"), role: val(dlg, "role"), door: val(dlg, "door"), contact: val(dlg, "contact"), supervised: val(dlg, "supervised")}, "Ingresso salvato")) || false}]});
    if (ok) render();
  }

  schema.onclick = (e) => {
    const inputGear = e.target.closest("[data-input-gear]");
    if (inputGear) { selected = null; selectedInput = null; update(); editInput(inputOf(inputGear.dataset.inputGear)); return; }
    const input = e.target.closest("[data-input]");
    if (input) {
      selected = null;
      if (selectedInput === input.dataset.input) { selectedInput = null; update(); editInput(inputOf(input.dataset.input)); }
      else { selectedInput = input.dataset.input; update(); }
      return;
    }
    if (selectedInput && e.target.closest("[data-door]")) {
      const i = inputOf(selectedInput);
      selectedInput = null;
      update();
      editInput(i, e.target.closest("[data-door]").dataset.door);
      return;
    }
    const gear = e.target.closest("[data-link]");
    if (gear) { selected = null; editLink(pending[Number(gear.dataset.link)]); return; }
    const reader = e.target.closest("[data-reader]");
    if (reader) { selectedInput = null; selected = selected === reader.dataset.reader ? null : reader.dataset.reader; update(); return; }
    const door = e.target.closest("[data-door]");
    if (!door || !selected) return;
    const token = door.dataset.door;
    const dirs = directionsOf(token);
    if (pending.some((l) => l.reader === selected && l.door === token)) toast("Lettore e porta sono già collegati: usa l'ingranaggio sul filo");
    else if (!dirs.length) toast("Sul controller questa porta non ha punti di accesso: per ora l'app collega solo a punti di accesso già programmati", true);
    else {
      const direction = dirs.includes("in") ? "in" : dirs[0];
      const same = pending.find((l) => l.door === token && l.direction === direction);
      pending.push({reader: selected, door: token, direction, enabled: same ? same.enabled : true});
    }
    selected = null;
    update();
  };
  async function save(rerender = true) {
    const list = changes();
    if (!list.length) return true;
    const ok = await confirmBox("Scrivi sul Controller", `Queste modifiche cambiano quale lettore apre quale porta:<ul style="margin:8px 0 0;padding-left:20px">${list.map((x) => `<li>${esc(x)}</li>`).join("")}</ul><p class="hint">Se dopo il salvataggio le tessere non aprono più, annulla dallo Storico Modifiche.</p>`, "Salva sul Controller");
    if (!ok) return false;
    const result = await run(() => api("api/programming/links", {method: "PUT", body: {links: pending}}), "Collegamenti scritti sul controller");
    if (!result) return false;
    pageGuard = null;
    if (rerender) render();
    return true;
  }
  $("#sch-save").onclick = () => save();
  $("#sch-discard").onclick = () => { pending = saved.map((l) => ({...l})); selected = null; update(); };
  pageGuard = {dirty: () => changes().length > 0, save: () => save(false)};
  window.addEventListener("resize", draw);
  update();
  requestAnimationFrame(draw);
}

  ["extended_access_time", "Apertura Estesa", "Per chi ha bisogno di più tempo (es. Apri a Lungo). Massimo 60 s.", 60],
  ["open_too_long_time", "Allarme Aperta Troppo a Lungo", "Dopo quanto la porta aperta va in allarme.", 3600],

];
const configDetails = (items) => items.length ? `<details style="margin-top:10px"><summary class="small-text muted" style="cursor:pointer">Dettagli Tecnici (${items.length})</summary>

// Porte del controller: impostazioni dell'app (telecamera, citofono, pulsanti) e nome e tempi sul controller
function controllerDoors(body, ctrl, p, errors, appDoor) {
  const appInfo = (d) => {
    const door = appDoor(d.token);
    if (!door) return `<p class="muted small-text" style="margin:8px 0 0">Non gestita dall'app: niente registro per porta, pulsanti in Home Assistant o citofono.</p>`;
    return props([
      ["Nome nell'App", esc(door.name)],
      ["Telecamera", `${door.snapshot_camera ? `${esc(cameraName(door.snapshot_camera))}${door.snapshot_on_granted ? " · anche accessi concessi" : ""}` : '<span class="muted">Nessuna</span>'} · <a href="#impianti/c${ctrl.id}/telecamere">Telecamere</a>`],
      ["Citofono", `${door.intercom_name ? `${esc(door.intercom_name)} · relè ${door.intercom_relay}${door.intercom_open_door ? ' · <span class="pill ok">Apre la Porta</span>' : ' · <span class="pill">Solo Registro</span>'}` : '<span class="muted">Nessuno</span>'} · <a href="#impianti/c${ctrl.id}/citofoni">Videocitofoni</a>`],
      ["Pulsanti HA", door.ha_buttons ? "Apri e Apri a Lungo" : '<span class="muted">Nessuno</span>'],
    ]);
  };
  const missing = ctrl.doors.filter((d) => !p.doors.some((x) => x.token === d.door_token));
  body.innerHTML = `${errors}
    <div class="grid cards">${p.doors.map((d) => `<div class="card" style="margin:0">
      <h2>${icon("door")}${esc(appDoor(d.token)?.name || d.name || d.token)}<span class="spacer"></span>${appDoor(d.token) ? '<span class="pill ok">Nell\'App</span>' : '<span class="pill">Solo Controller</span>'}</h2>
      ${appInfo(d)}
      <h3 class="section-title" style="margin-top:14px">Sul Controller</h3>
      ${props([["Nome", esc(d.name || "—")], ["Token", `<code>${esc(d.token)}</code>`], ...DOOR_TIME_FIELDS.filter(([k]) => d[k] !== null && d[k] !== undefined).map(([k, label]) => [label, secs(d[k])])])}
      ${d.description ? `<p class="hint">${esc(d.description)}</p>` : ""}${configDetails(d.configuration)}
      <div class="row" style="margin-top:12px">${appDoor(d.token) ? `<button type="button" class="small" data-app-edit="${esc(d.token)}">${icon("edit")}Impostazioni App</button>` : `<button type="button" class="small primary" data-app-add="${esc(d.token)}">${icon("plus")}Gestisci nell'App</button>`}
        ${d.editable || d.name ? `<button type="button" class="small" data-pd="${esc(d.token)}">${icon("clock")}Nome e Tempi</button>` : ""}
        ${appDoor(d.token) ? `<button type="button" class="small ghost danger" data-app-del="${esc(d.token)}">Togli dall'App</button>` : ""}</div>
    </div>`).join("") || '<div class="card"><div class="empty">Nessuna porta letta dal controller.</div></div>'}</div>
    ${missing.length ? `<div class="alert" style="margin-top:16px">${icon("alert")}<div class="grow"><b>Porte non trovate sul controller</b>${missing.map((d) => `${esc(d.name)} (<code>${esc(d.door_token)}</code>)`).join(", ")}: controlla la programmazione o toglile dall'app.
      ${missing.map((d) => `<button type="button" class="small ghost danger" data-app-del="${esc(d.door_token)}">Togli ${esc(d.name)}</button>`).join(" ")}</div></div>` : ""}`;
  paintIcons(body);
  body.onclick = async (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.appEdit) doorEditor(ctrl, appDoor(b.dataset.appEdit));
    else if (b.dataset.appAdd) doorEditor(ctrl, null, b.dataset.appAdd, p.doors.find((d) => d.token === b.dataset.appAdd)?.name);
    else if (b.dataset.appDel) {
      const door = appDoor(b.dataset.appDel);
      if (await confirmBox("Togli dall'App", `Togliere <b>${esc(door.name)}</b> dall'app? Spariscono anche i suoi pulsanti in Home Assistant e il collegamento al citofono. Sul controller non cambia niente.`, "Togli", true) &&
          await run(() => api(`api/doors/${door.id}`, {method: "DELETE"}), "Porta tolta dall'app")) { loadSummary(); render(); }
    } else if (b.dataset.pd) {
      const d = p.doors.find((x) => x.token === b.dataset.pd);
      const times = DOOR_TIME_FIELDS.filter(([k]) => d[k] !== null && d[k] !== undefined);
      const ok = await modal({title: "Porta " + (d.name || d.token), body: `${field("Nome sul Controller", `<input name="name" maxlength="64" value="${esc(d.name)}">`)}
        ${field("Descrizione", `<input name="description" maxlength="200" value="${esc(d.description)}">`)}
        ${times.length ? `<div class="fields-2">${times.map(([k, label, hint, max]) => field(label + " (Secondi)", `<input type="number" name="${k}" min="0" max="${Math.max(max, d[k])}" step="1" value="${d[k]}">`, hint)).join("")}</div>` : ""}`,
        actions: [{label: "Annulla", value: null}, {label: "Scrivi sul Controller", kind: "primary", submit: true, onClick: async (dlg) => {
          const payload = {name: val(dlg, "name"), description: val(dlg, "description")};
          times.forEach(([k]) => { payload[k] = Number(val(dlg, k)); });
          return (await saveProgramming(`api/programming/doors/${encodeURIComponent(d.token)}`, payload, "Porta aggiornata sul controller")) || false;
        }}]});
      if (ok) render();
    }
  };
}

// Stato del controller, delle sue porte, degli eventi MQTT e dei citofoni
async function controllerStatus(body, ctrl) {
  let s;
  try { s = await api("api/status"); } catch (err) { body.innerHTML = errorBox("Stato Non Leggibile", err); return; }
  // Ora di Home Assistant rispetto a questo dispositivo: terzo parere quando controller e Home Assistant non concordano
  const haVsDevice = s.now ? (Date.parse(s.now) - Date.now()) / 1000 : 0;
  const c = s.controller, m = s.mqtt;
  const connection = ` <a href="#impianti/c${ctrl.id}/connessione">Controlla la Connessione</a>`;
  const h = s.controllers.find((x) => x.id === ctrl.id);
  const ntp = h?.ntp || {};
  const off = h?.clock_offset, tz = h?.time_zone ? ` · ${esc(h.time_zone)}` : "";
  // Lo scarto dice solo che i due orologi non concordano: se il controller è sincronizzato via NTP, l'ora giusta è la sua
  const clock = !h || off === null || off === undefined ? "—"
    : Math.abs(off) < 2 ? `${statusDot("ok")} Allineato a Home Assistant${tz}`
    : h.clock_synced ? `${statusDot("ok")} Giusto, sincronizzato via NTP · <span${h.clock_fault ? ' style="color:var(--warn)"' : ""}>Home Assistant è ${offsetText(-off)}</span>${tz}`
    : `${statusDot(h.clock_problem ? "err" : "ok")} ${offsetText(off)} rispetto a Home Assistant${tz}`;
  const ntpText = ntp.servers?.length || ntp.source ? `${ntp.active === false ? statusDot("warn") + " Non sincronizzato · " : ntp.active ? statusDot("ok") + " " : ""}${esc((ntp.servers || []).join(", ") || "nessun server")}${ntp.source ? ` <span class="muted">(${esc(ntp.source)})</span>` : ""}${ntp.active && ntp.offset !== null && ntp.offset !== undefined ? ` <span class="muted">· scarto ${String(ntp.offset).replace(".", ",")} s</span>` : ""}` : "—";
  const ctrlInfo = c.ok ? props([
    ["Stato", `${statusDot("ok")} Raggiungibile${h?.latency_ms != null ? ` <span class="muted">· risponde in ${h.latency_ms} ms, controllato ${esc(relTime(h.checked_at))}</span>` : ""}`], ["Modello", esc(c.model)], ["Firmware", esc(c.firmware)], ["Numero di Serie", `<code>${esc(c.serial)}</code>`],
    ["Certificato", h?.cert_fingerprint ? `<code class="small-text" style="overflow-wrap:anywhere">${esc(h.cert_fingerprint)}</code>` : "—"],
    ["Orologio", clock], ["Server NTP", ntpText],
    ...(Math.abs(haVsDevice) >= 5 ? [["Ora di Home Assistant", `${statusDot("warn")} ${offsetText(haVsDevice)} rispetto a questo dispositivo`]] : []),
    ["Indirizzo", `<code>${esc(ctrl.host)}</code>`], ["Porte sul Controller", c.doors.map((d, i) => `<span title="${esc(d)}">${esc(c.door_names?.[i] || d)}</span>`).join(", ")],
    ["Lettori", esc(c.readers ?? "—")], ["Tessere sul Controller", esc(c.credentials)],
  ]) + (h?.clock_problem ? '<p class="hint" style="color:var(--err)">Le fasce orarie scattano con l\'ora del controller: imposta un server NTP raggiungibile nel controller (Sistema → Data e Ora).</p>' : "")
    + (h?.clock_fault === "home_assistant" ? '<p class="hint">A essere sbagliata è l\'ora di Home Assistant: controlla il suo server NTP. Le fasce orarie non ne risentono, perché le applica il controller con la sua ora.</p>' : "") : `<div class="alert err" style="margin:0">${icon("alert")}<div class="grow"><b>Controller Non Raggiungibile</b>${esc(c.error)}${connection}</div></div>`;
  const cats = Object.entries(m.categories || {});
  const mqtt = !m.configured ? `<div class="alert err" style="margin:0">${icon("alert")}<div class="grow"><b>Nessun Broker</b>Installa l'add-on Mosquitto o imposta mqtt_host nelle opzioni dell'add-on.</div></div>` : props([
    ["Broker", m.connected ? `${statusDot("ok")} Collegato` : `${statusDot("err")} Non Collegato ${esc(m.error)}`],
    ["Prefisso", `<code>${esc(m.prefix)}</code>`],
    ["Controller", m.controller_online === null ? "stato non ancora ricevuto" : m.controller_online ? `${statusDot("ok")} Online` : `${statusDot("err")} Offline`],
    ["Ultima Tessera Letta", m.last_card ? `<code>${esc(m.last_card.card)}</code> ${esc(relTime(m.last_card.read_at))}` : "nessuna dall'avvio"],
    ["Eventi AccessControl", m.access_events_seen ? `${statusDot("ok")} Ricevuti` : `${statusDot("warn")} Non Ancora Ricevuti`],
    ["Eventi Persi", s.recovery ? `${s.recovery.events ? `${plural(s.recovery.events, "recuperato", "recuperati")}` : "nessuno"} dal registro del controller, controllato ${esc(relTime(s.recovery.at))}` : "si controllano all'avvio e dopo ogni interruzione"],
  ]) + (m.connected && !m.access_events_seen ? '<p class="hint">Se dopo il passaggio di una tessera compare solo IdPoint, aggiungi gli eventi AccessControl (accesso concesso e negato) al filtro eventi MQTT dell\'A1210: servono per sapere se la porta si è aperta e perché un accesso è stato negato.</p>' : "")
    + (cats.length ? `<details style="margin-top:12px"><summary class="small-text muted" style="cursor:pointer">Eventi Ricevuti per Categoria (${cats.length})</summary><div class="table-wrap"><table class="table"><thead><tr><th>Categoria</th><th>Eventi</th><th>Ultimo Topic</th></tr></thead><tbody>${cats.map(([n, x]) => `<tr><td>${esc(n)}</td><td>${x.count}</td><td><code>${esc(x.last_topic)}</code><div class="muted small-text">${esc(relTime(x.last_seen))}</div></td></tr>`).join("")}</tbody></table></div></details>` : "");
  const doors = s.doors.filter((d) => ctrl.doors.some((x) => x.id === d.id));
  const doorList = doors.length ? `<div class="list">${doors.map((d) => `<a class="item door-row" href="#porte/${d.id}" style="padding-left:0;padding-right:0">
      <div class="ev-icon ${d.mode === "Locked" ? "k-ok" : d.mode ? "k-warn" : "k-muted"}">${icon("door")}</div>
      <div class="grow"><div class="title">${esc(d.name)}</div>
        <div class="meta">${d.camera ? `<span>telecamera ${esc(cameraName(d.camera))}</span>` : ""}${d.intercom ? `<span>citofono ${esc(d.intercom)}</span>` : ""}${d.ha_buttons ? "<span>pulsanti in Home Assistant</span>" : ""}</div></div>
      <span class="pill ${doorModeClass(d.mode)}"><span class="dot ${doorModeClass(d.mode)}"></span>${esc(doorModeLabel(d.mode))}</span></a>`).join("")}</div>`
    : `<p class="muted" style="margin:0">Nessuna porta gestita dall'app: aggiungile nella scheda <a href="#impianti/c${ctrl.id}/porte">Porte</a>.</p>`;
  const names = doors.map((d) => d.name);
  const intercoms = s.intercoms.filter((ic) => names.includes(ic.door));
  const intercomCard = intercoms.length ? `<div class="card"><h2>${icon("phone")}Citofoni</h2>${intercoms.map((ic) => props([
    ["Porta", esc(ic.door)], ["Nome", esc(ic.name)], ["Apertura dal Citofono", ic.open_door ? "Attiva" : "Disattivata"],
    ["Stato Chiamata", esc(({idle: "Libero", ringing: "Sta Suonando", ring: "Sta Suonando", oncall: "In Conversazione", dismissed: "Chiusa"})[String(ic.call_state).toLowerCase()] || ic.call_state || "—")], ["Ultimo Messaggio", ic.last_message_at ? esc(relTime(ic.last_message_at)) : "—"],
  ])).join('<hr style="border:none;border-top:1px solid var(--border);margin:12px 0">')}</div>` : "";
  body.innerHTML = `<div class="grid two">
      <div>
        <div class="card"><h2>${statusDot(c.ok ? "ok" : "err")}Controller</h2>${ctrlInfo}
          <p class="hint">Ultima sincronizzazione delle tessere: ${s.sync.paused ? "sospesa finché non confermi il nuovo controller" : s.sync.at ? esc(relTime(s.sync.at)) : "non ancora eseguita"}${s.sync.ok === false ? ` · <span style="color:var(--err)">${esc(s.sync.error)}</span>` : ""}</p></div>
        <div class="card"><h2>${icon("door")}Porte</h2>${doorList}</div>
      </div>
      <div>
        <div class="card"><h2>${statusDot(!m.configured || !m.connected ? "err" : m.access_events_seen ? "ok" : "warn")}Eventi MQTT</h2>${mqtt}</div>
        ${intercomCard}
      </div>
    </div>`;
  paintIcons(body);
}

function controllerHistory(body, p) {
  body.innerHTML = `<div class="card flush"><h2>Storico Modifiche<span class="spacer"></span><span class="muted small-text">annulla per riportare com'era</span></h2>
    <div class="table-wrap" style="padding:8px 8px 0"><table class="table"><thead><tr><th style="width:150px">Quando</th><th style="width:140px">Utente</th><th>Modifica</th><th></th></tr></thead><tbody>
    ${p.changes.length ? p.changes.map((c) => `<tr><td>${esc(fmtDateTime(c.ts))}</td><td>${esc(c.user)}</td><td>${esc(c.summary)}</td><td style="text-align:right">${c.undone ? '<span class="pill">Annullata</span>' : `<button type="button" class="small" data-undo="${c.id}">Annulla</button>`}</td></tr>`).join("") : '<tr><td colspan="4" class="muted">nessuna modifica fatta dall\'app</td></tr>'}</tbody></table></div></div>`;

        <button type="button" class="small ghost icon-only danger" data-area-del="${a.id}" aria-label="Elimina area">${icon("trash")}</button></div>`).join("")}</div>` : '<p class="muted" style="margin:0">Nessuna area: aggiungine una, ad esempio Piano Terra o Ingresso.</p>'}
    </div>`).join("") : '<div class="card"><div class="empty">Nessuna struttura: creane una, ad esempio Hotel, Teatro o Villa 1.</div></div>'}
    ${loose ? `<div class="alert">${icon("alert")}<div class="grow"><b>Senza Area</b>${loose.areas[0].controllers.map((id) => esc(ctrlName(id))).join(", ") || plural(loose.areas[0].doors.length, "porta", "porte")}: scegli l'area con l'ingranaggio Connessione del controller.</div></div>` : ""}`;
  const allAreas = real.flatMap((x) => x.areas.map((a) => ({...a, site: x})));
  const nameDialog = (title, label, value = "", extra = "") => modal({title, body: field(label, `<input name="name" maxlength="64" value="${esc(value)}">`) + extra,
    actions: [{label: "Annulla", value: null}, {label: "Salva", kind: "primary", submit: true, onClick: (dlg) => ({name: val(dlg, "name"), description: val(dlg, "description")})}]});
  $("#site-new").onclick = async () => {
    const r = await nameDialog("Nuova Struttura", "Nome", "", field("Descrizione", '<input name="description" maxlength="200" placeholder="facoltativa">'));
    if (r && await run(() => api("api/sites", {method: "POST", body: r}), "Struttura aggiunta")) { await loadSummary(); render(); }
  };
  const inside = (a) => a.controllers.length ? ` ${plural(a.controllers.length, "controller resterà", "controller resteranno")} senza area.` : "";
  body.onclick = async (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    const site = real.find((x) => x.id === Number(b.dataset.siteEdit || b.dataset.siteDel || b.dataset.areaNew));
    const area = allAreas.find((a) => a.id === Number(b.dataset.areaEdit || b.dataset.areaDel));
    let done;
    if (b.dataset.areaNew) {
      const r = await nameDialog(`Nuova Area in ${site.name}`, "Nome dell'Area", "");
      done = r && await run(() => api(`api/sites/${site.id}/areas`, {method: "POST", body: {name: r.name}}), "Area aggiunta");
    } else if (b.dataset.siteEdit) {
      const r = await nameDialog("Modifica Struttura", "Nome", site.name, field("Descrizione", `<input name="description" maxlength="200" value="${esc(site.description)}">`));
      done = r && await run(() => api(`api/sites/${site.id}`, {method: "PUT", body: r}), "Struttura salvata");

        await run(() => api(`api/areas/${area.id}`, {method: "DELETE"}), "Area eliminata");
    }
    if (done) { await loadSummary(); render(); }
  };
}

// Stati di Home Assistant di una telecamera che non può dare immagini
const CAMERA_DOWN = ["unavailable", "unknown", "off"];
// Avviso accanto alla telecamera nel menu di scelta. Frigate mette "idle" alle telecamere spente, ma anche a
// quelle senza streaming che le foto le danno: "ferma" avvisa senza dire che è guasta.
const cameraNote = (c) => CAMERA_DOWN.includes(c.state) ? "non disponibile"
  : c.last_error ? "ultima foto non riuscita" : c.state === "idle" ? "ferma" : "";
// Scheda Telecamere: quale telecamera fotografa quale porta, e quella del coperchio del controller
async function controllerCameras(body, ctrl) {
  const cameras = await api("api/cameras").catch(() => []);
  if (!body.isConnected) return;
  const label = (entity) => cameras.find((c) => c.entity_id === entity)?.name || cameraName(entity);
  // Telecamera spenta in Home Assistant o ultima foto non riuscita: si vede qui, non solo nel log
  const problem = (entity) => {
    const cam = cameras.find((c) => c.entity_id === entity);
    if (cameras.length && !cam) return "non trovata in Home Assistant";
    if (cam && CAMERA_DOWN.includes(cam.state)) return "non disponibile in Home Assistant";
    if (cam?.last_error) return `ultima foto non riuscita ${relTime(cam.last_error.ts)}: ${cam.last_error.error}`;
    return "";
  };
  const rows = ctrl.doors.filter((d) => d.snapshot_camera);
  const cameraRow = (entity, place, when, edit, del) => `<div class="item">
        <div class="ev-icon k-accent">${icon("camera")}</div>
        <div class="grow"><div class="title">${esc(label(entity))}${problem(entity) ? ' <span class="pill warn">Da Controllare</span>' : ""}</div>
          <div class="meta"><span>${place}</span><span>${when}</span></div>
          ${problem(entity) ? `<div class="small-text" style="color:var(--warn);margin-top:2px">${esc(problem(entity))}</div>` : ""}</div>
        <button type="button" class="small" ${edit}>${icon("edit")}Modifica</button>
        <button type="button" class="small ghost danger" ${del}>Togli</button></div>`;
  const ctrlRow = ctrl.snapshot_camera ? cameraRow(ctrl.snapshot_camera, `coperchio di ${esc(ctrl.name)}`, "foto quando si apre il coperchio", 'data-cam-edit="ctrl"', 'data-cam-del="ctrl"') : "";
  body.innerHTML = `
    <div class="toolbar"><p class="muted" style="margin:0;flex:1 1 260px">Una telecamera di Home Assistant per porta: l'app salva una foto nel registro su accessi negati, aperture a distanza, chiamate al citofono e allarmi. Se il controller è in un altro locale, può avere la sua telecamera per l'apertura del coperchio. Le foto sono anche in Media → axis_access_manager.</p>
      <button type="button" class="primary" id="cam-new">${icon("plus")}Aggiungi Telecamera</button></div>
    ${rows.length || ctrlRow ? `<div class="card flush"><div class="list">${ctrlRow}${rows.map((d) => `<div class="item">
        <div class="ev-icon k-accent">${icon("camera")}</div>
        <div class="grow"><div class="title">${esc(label(d.snapshot_camera))}${problem(d.snapshot_camera) ? ' <span class="pill warn">Da Controllare</span>' : ""}</div>
          <div class="meta"><span>porta ${esc(d.name)}</span><span>${d.snapshot_on_granted ? "foto a ogni passaggio" : "foto solo sui rifiuti e le aperture a distanza"}</span></div>
          ${problem(d.snapshot_camera) ? `<div class="small-text" style="color:var(--warn);margin-top:2px">${esc(problem(d.snapshot_camera))}</div>` : ""}</div>
        <button type="button" class="small" data-cam-edit="${d.id}">${icon("edit")}Modifica</button>
        <button type="button" class="small ghost danger" data-cam-del="${d.id}">Togli</button></div>`).join("")}</div></div>`
      : `<div class="card"><div class="empty">${icon("camera")}<br>Nessuna telecamera associata alle porte o al controller.</div></div>`}`;
  paintIcons(body);
  body.onclick = async (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.camEdit === "ctrl") return cameraEditor(ctrl, cameras, null, true);
    if (b.dataset.camDel === "ctrl") {
      if (await confirmBox("Togli Telecamera", `Togliere la telecamera del coperchio del controller <b>${esc(ctrl.name)}</b>? Le foto già salvate restano nel registro.`, "Togli", true) &&
          await run(() => api(`api/controllers/${ctrl.id}/camera`, {method: "PUT", body: {camera: ""}}), "Telecamera tolta")) { loadSummary(); render(); }
      return;
    }
    const door = ctrl.doors.find((d) => String(d.id) === (b.dataset.camEdit || b.dataset.camDel));
    if (b.id === "cam-new" || b.dataset.camEdit) return cameraEditor(ctrl, cameras, door);
    if (b.dataset.camDel && await confirmBox("Togli Telecamera", `Togliere la telecamera dalla porta <b>${esc(door.name)}</b>? Le foto già salvate restano nel registro.`, "Togli", true) &&
        await run(() => api(`api/doors/${door.id}`, {method: "PUT", body: doorBody(door, {snapshot_camera: "", snapshot_on_granted: false})}), "Telecamera tolta")) { loadSummary(); render(); }
  };
}
async function cameraEditor(ctrl, cameras, door, forController = false) {
  const current = (forController ? ctrl.snapshot_camera : door?.snapshot_camera) || "";
  const camLabel = (entity) => cameras.find((c) => c.entity_id === entity)?.name || cameraName(entity);
  const cameraInput = cameras.length
    ? `<select name="camera">${cameras.map((c) => `<option value="${esc(c.entity_id)}" ${c.entity_id === current ? "selected" : ""}>${cameraNote(c) ? "⚠ " : ""}${esc(c.name)}${cameras.some((x) => x !== c && x.name === c.name) ? ` (${esc(c.entity_id)})` : ""}${cameraNote(c) ? ` · ${cameraNote(c)}` : ""}</option>`).join("")}${current && !cameras.some((c) => c.entity_id === current) ? `<option value="${esc(current)}" selected>${esc(cameraName(current))} · non trovata</option>` : ""}</select>`
    : `<input name="camera" class="mono" value="${esc(current)}" placeholder="camera.ingresso">`;
  // Cosa fotografa: una porta (tutto quello che succede lì) o il coperchio del controller
  const editing = forController ? "ctrl" : door ? String(door.id) : "";
  const targetSelect = `<select name="door">${ctrl.doors.map((d) => `<option value="${d.id}" ${String(d.id) === editing ? "selected" : ""}>Porta ${esc(d.name)}${d.snapshot_camera && String(d.id) !== editing ? ` (ora ${esc(camLabel(d.snapshot_camera))})` : ""}</option>`).join("")}
    <option value="ctrl" ${editing === "ctrl" ? "selected" : ""}>Coperchio del Controller${ctrl.snapshot_camera && editing !== "ctrl" ? ` (ora ${esc(camLabel(ctrl.snapshot_camera))})` : ""}</option></select>`;
  const result = await modal({
    title: door || forController ? "Modifica Telecamera" : "Aggiungi Telecamera",
    body: `${field("Telecamera", cameraInput, cameras.length ? "Le telecamere di Home Assistant, con il loro nome. Ferma: non trasmette (con Frigate anche se spenta), la foto potrebbe non riuscire." : "Home Assistant non ha restituito telecamere: scrivi l'entità a mano.")}
      ${field("Inquadra", targetSelect, "La porta: accessi, aperture, citofono e allarmi di quella porta. Il coperchio del controller: la sua apertura. Se c'è già una telecamera, viene sostituita.")}
      <div data-granted><div class="field inline"><input type="checkbox" name="granted" id="f-cg" ${door?.snapshot_on_granted ? "checked" : ""}><label for="f-cg">Istantanea Anche sugli Accessi Concessi</label></div>
      <p class="hint" style="margin-top:-8px">Una foto per passaggio, sull'esito. Senza questa spunta la foto c'è solo su rifiuti, aperture a distanza, citofono e allarmi.</p></div>`,
    onOpen: (dlg) => {
      const sync = () => { $("[data-granted]", dlg).hidden = val(dlg, "door") === "ctrl"; };
      $("[name=door]", dlg).addEventListener("change", sync);
      sync();
    },
    actions: [{label: "Annulla", value: null}, {label: "Salva", kind: "primary", submit: true, onClick: async (dlg) => {
      const choice = val(dlg, "door");
      const target = ctrl.doors.find((d) => String(d.id) === choice);
      const camera = val(dlg, "camera").trim();
      if (!camera) { toast("Scegli la telecamera", true); return false; }
      // Spostata altrove: la porta o il controller di prima resta senza telecamera
      if (door && String(door.id) !== choice && !await run(() => api(`api/doors/${door.id}`, {method: "PUT", body: doorBody(door, {snapshot_camera: "", snapshot_on_granted: false})}))) return false;
      if (forController && choice !== "ctrl" && !await run(() => api(`api/controllers/${ctrl.id}/camera`, {method: "PUT", body: {camera: ""}}))) return false;
      if (choice === "ctrl") return (await run(() => api(`api/controllers/${ctrl.id}/camera`, {method: "PUT", body: {camera}}), "Telecamera salvata")) || false;
      return (await run(() => api(`api/doors/${target.id}`, {method: "PUT", body: doorBody(target, {snapshot_camera: camera, snapshot_on_granted: val(dlg, "granted")})}), "Telecamera salvata")) || false;
    }}],
  });
  if (result) { loadSummary(); render(); }
}

        await run(() => api(`api/doors/${door.id}`, {method: "PUT", body: doorBody(door, {intercom_name: "", intercom_open_door: false})}), "Videocitofono tolto")) { loadSummary(); render(); }

// Impostazioni della porta nell'app; l'area viene dal controller
// Impostazioni complete della porta per il salvataggio, con le modifiche indicate
function doorBody(door, changes = {}) {
  const fields = ["name", "door_token", "ha_buttons", "snapshot_camera", "snapshot_on_granted", "intercom_name", "intercom_relay", "intercom_open_door", "intercom_mqtt_prefix", "area_id"];
  const body = Object.fromEntries(fields.filter((k) => door[k] !== undefined).map((k) => [k, door[k]]));
  return {...body, ...changes};
}
async function doorEditor(ctrl, door, token = "", controllerName = "") {

    title: door ? `Impostazioni App · ${door.name}` : "Gestisci nell'App",

    body: `<div class="fields-2">${field("Nome nell'App", `<input name="name" maxlength="100" value="${esc(d.name || "")}" placeholder="es. Ingresso Scala A">`)}
      ${field("Porta del Controller", `<input class="mono" value="${esc(d.door_token)}" disabled>`)}</div>
      <div class="field inline"><input type="checkbox" name="ha_buttons" id="f-hab" ${d.ha_buttons ? "checked" : ""}><label for="f-hab">Pulsanti Apri e Apri a Lungo in Home Assistant</label></div>
      <p class="hint" style="margin-top:-8px">Da mettere nelle dashboard. L'apertura è sempre a tempo e solo a porta bloccata.</p>
      <p class="hint">Telecamera e videocitofono della porta si scelgono nelle schede <a href="#impianti/c${ctrl.id}/telecamere">Telecamere</a> e <a href="#impianti/c${ctrl.id}/citofoni">Videocitofoni</a> del controller.</p>`,
    actions: [{label: "Annulla", value: null}, {label: "Salva", kind: "primary", submit: true, onClick: async (dlg) => {
      const body = doorBody(d, {name: val(dlg, "name"), ha_buttons: val(dlg, "ha_buttons")});
      return (await run(() => api(door ? `api/doors/${door.id}` : `api/controllers/${ctrl.id}/doors`, {method: door ? "PUT" : "POST", body}), "Porta salvata")) || false;
    }}],
  });
  if (result) { loadSummary(); render(); }

const kb = (bytes) => bytes >= 1048576 ? `${(bytes / 1048576).toFixed(1).replace(".", ",")} MB` : `${Math.max(1, Math.round((bytes || 0) / 1024))} kB`;
const backupTitle = (b) => b.name || b.kind_label;

      ${data.can_restore ? `<button type="button" class="small ghost icon-only" data-del title="${b.locked ? "Sbloccalo per eliminarlo" : "Elimina"}" aria-label="Elimina" ${b.locked ? "disabled" : ""}>${icon("trash")}</button>` : ""}

}
async function viewBackups(body, part = "") {
  let data;

  if (!body.isConnected) return;
  const list = part ? data.backups.filter((b) => b.parts?.[part]) : data.backups;
  const error = data.error;
  const intro = part
    ? "Storico della configurazione di questo controller: porte, lettori, punti di accesso, profili e ingressi. Ripristina riporta porte e lettori com'erano."
    : "Ogni backup salva i Dati Comuni (persone, tessere, tipologie, fasce orarie, festività, strutture e utenti dell'app) e la configurazione di ogni controller. Le parti che non cambiano non occupano altro spazio.";
  body.innerHTML = `${error ? `<div class="alert">${icon("alert")}<div class="grow"><b>${error.id ? "Ultimo Backup Incompleto" : "Ultimo Backup Non Riuscito"}</b>${esc(error.error)} · ${esc(relTime(error.at))}</div></div>` : ""}
    <div class="toolbar"><p class="muted" style="margin:0;flex:1 1 320px">${intro}</p><button type="button" class="primary" id="bk-new">${icon("plus")}Crea Backup Ora</button></div>

    <p class="hint">${plural(data.backups.length, "backup", "backup")} · ${kb(data.size)} nella cartella dell'add-on. Entrano nei backup di Home Assistant: controlla che includano l'add-on e che vadano anche fuori sede (NAS o cloud). Le password dei controller non si salvano.</p>`;
  paintIcons(body);
  $("#bk-new").onclick = () => createBackup();
  $("#bk-list").onclick = async (e) => {

}
async function createBackup() {

}
// Al massimo 40 righe per elenco: con centinaia di tessere cambiate basta il numero
function capped(items, line) {
  return items.slice(0, 40).map(line).join("") + (items.length > 40 ? `<li class="muted">e altri ${items.length - 40}</li>` : "");
}
function diffHtml(d) {
  if (d.first) return '<p class="muted" style="margin:0">È il primo backup: prima non c\'è niente con cui confrontarlo.</p>';
  const when = (x) => x.id === "attuale" ? "adesso" : `${fmtDateTime(x.created_at)} (${backupTitle(x)})`;
  const head = `<p class="muted small-text" style="margin:0 0 4px">Cosa è cambiato dal ${esc(when(d.older))} ${d.newer.id === "attuale" ? "a" : "al"} ${esc(when(d.newer))}.</p>`;
  if (!d.groups.length) return head + `<div class="empty">${icon("check")}<br>Nessuna differenza.</div>`;
  return head + d.groups.map((g) => `<h3 class="diff-part">${esc(g.title)}${g.note ? ` <span class="muted small-text">· ${esc(g.note)}</span>` : ""}</h3>
    ${g.sections.map((s) => `<div class="diff-sec"><div class="diff-title">${esc(s.title)}</div><ul class="diff">
      ${capped(s.added, (i) => `<li class="add"><b>+</b>${esc(i.label)}</li>`)}
      ${capped(s.removed, (i) => `<li class="del"><b>−</b>${esc(i.label)}</li>`)}
      ${capped(s.changed, (i) => `<li class="chg"><b>~</b><span>${esc(i.label)}<span class="diff-fields">${i.fields.map((f) => `<span><span class="muted">${esc(f.label)}:</span> <s>${esc(f.old)}</s> → ${esc(f.new)}</span>`).join("")}</span></span></li>`)}
    </ul></div>`).join("")}`).join("");
}
function compareBackup(b, backups, part = "") {
  const others = backups.filter((x) => x.id !== b.id && (!part || x.parts?.[part]));
  const options = `<option value="precedente">Backup precedente</option><option value="attuale">Stato attuale</option>${others.map((x) => `<option value="${esc(x.id)}">${esc(fmtDateTime(x.created_at))} · ${esc(backupTitle(x))}</option>`).join("")}`;
  modal({title: `Confronta: ${backupTitle(b)}`, wide: true,
    body: `<div class="field"><label>Confronta con</label><select name="other">${options}</select></div><div id="cmp-body">${loadingBox()}</div>`,
    actions: [{label: "Chiudi", value: null}],
    onOpen: (dlg) => {
      const load = async () => {
        const box = $("#cmp-body", dlg);
        box.innerHTML = loadingBox();
        try { box.innerHTML = diffHtml(await api(`api/backups/${b.id}/compare?other=${encodeURIComponent(val(dlg, "other"))}${part ? `&part=${encodeURIComponent(part)}` : ""}`)); }
        catch (err) { box.innerHTML = errorBox("Confronto Non Riuscito", err); }
        paintIcons(box);
      };
      $('[name="other"]', dlg).onchange = load;
      load();
    }});
}
function restoreItemHtml(i) {
  const [cls, ic] = RESTORE_ACTIONS[i.action] || ["k-muted", "refresh"];
  return `<label class="rs-item${i.blocked ? " blocked" : ""}">
    <input type="checkbox" name="rs" value="${esc(i.key)}" ${i.default && !i.blocked ? "checked" : ""} ${i.blocked ? "disabled" : ""}>
    <div class="ev-icon ${cls}">${icon(ic)}</div>
    <div class="grow"><div class="title">${esc(i.label)} <span class="muted small-text">· ${esc(i.text)}</span></div>
      ${i.changes.length ? `<div class="diff-fields">${i.changes.slice(0, 8).map((c) => `<span><span class="muted">${esc(c.label)}:</span> ${c.old === "—" ? "" : `<s>${esc(c.old)}</s> → `}${esc(c.new)}</span>`).join("")}${i.changes.length > 8 ? `<span class="muted">e altre ${i.changes.length - 8}</span>` : ""}</div>` : ""}
      ${i.warnings.map((w) => `<div class="rs-note">${icon("alert")}<span>${esc(w[0].toUpperCase() + w.slice(1))}</span></div>`).join("")}
      ${i.blocked ? `<div class="rs-note err">${icon("block")}<span>Non si può: ${esc(i.blocked)}</span></div>` : ""}
    </div></label>`;
}
function restoreResultHtml(r) {
  return `${r.applied.length ? `<p style="margin-top:0"><b>${plural(r.applied.length, "modifica fatta", "modifiche fatte")}</b></p><ul class="diff">${capped(r.applied, (a) => `<li class="add"><b>✓</b>${esc(a.label)} <span class="muted">· ${esc(a.text)}</span></li>`)}</ul>` : ""}
    ${r.failed.length ? `<p${r.applied.length ? "" : ' style="margin-top:0"'}><b>${plural(r.failed.length, "non riuscita", "non riuscite")}</b></p><ul class="diff">${r.failed.map((f) => `<li class="del"><b>✕</b>${esc(f.label)} <span class="muted">· ${esc(f.error)}</span></li>`).join("")}</ul>` : ""}
    ${r.unchanged ? `<p class="hint">${plural(r.unchanged, "riga era già", "righe erano già")} come nel backup.</p>` : ""}
    <p class="hint">Prima del ripristino l'app ha creato il backup "Prima del Ripristino": per tornare indietro, ripristina quello.</p>`;
}
async function restoreBackup(b, data, part = "") {
  const sectionsBody = part
    ? `<p style="margin:0">Riporta porte e lettori di questo controller come erano nel backup del ${esc(fmtDateTime(b.created_at))}. Prima di cambiare qualcosa vedrai l'elenco delle modifiche.</p>`
    : `<p style="margin-top:0">Backup del ${esc(fmtDateTime(b.created_at))}. Scegli cosa riportare com'era: prima di cambiare qualcosa vedrai l'elenco delle modifiche.</p>
      <div class="perm-list">${Object.entries(data.sections).map(([k, label]) => `<label><input type="checkbox" name="sec" value="${k}" checked><span><b>${esc(label)}</b><br><span class="muted small-text">${esc(RESTORE_HINTS[k] || "")}</span></span></label>`).join("")}</div>`;
  let sections = [];
  const preview = await modal({title: `Ripristina: ${backupTitle(b)}`, body: sectionsBody,
    actions: [{label: "Annulla", value: null}, {label: "Mostra Cosa Cambierà", kind: "primary", submit: true, onClick: async (dlg) => {
      sections = part ? ["porte"] : $$('[name="sec"]:checked', dlg).map((x) => x.value);
      if (!sections.length) { toast("Scegli almeno una voce", true); return false; }
      return (await run(() => api(`api/backups/${b.id}/preview`, {method: "POST", body: {sections, part}}))) || false;
    }}]});
  if (!preview) return;
  const items = preview.items;
  if (!items.length) {
    await modal({title: "Niente da Ripristinare", body: '<p style="margin:0">Quello che hai scelto è già come nel backup.</p>', actions: [{label: "Chiudi", value: null}]});
    return;
  }
  const groups = Object.entries(preview.sections).filter(([k]) => items.some((i) => i.section === k));
  const keys = await modal({title: "Cosa Cambierà", wide: true,
    body: `${preview.paused ? `<div class="alert err">${icon("alert")}<div class="grow"><b>Scritture Sospese</b>${esc(preview.paused)}</div></div>` : ""}
      <p class="muted small-text" style="margin-top:0">Spunta cosa riportare com'era. Togliere quello che è stato aggiunto dopo il backup non è spuntato: di solito è lavoro buono fatto nel frattempo. Prima del ripristino l'app crea un backup dello stato attuale, così puoi tornare indietro.</p>
      ${groups.map(([k, label]) => `<h3 class="diff-part">${esc(label)}</h3><div class="rs-list">${items.filter((i) => i.section === k).map(restoreItemHtml).join("")}</div>`).join("")}`,
    actions: [{label: "Annulla", value: null}, {label: "Ripristina Selezionati", kind: "primary", onClick: (dlg) => {
      const chosen = $$('[name="rs"]:checked', dlg).map((x) => x.value);
      if (!chosen.length) { toast("Spunta almeno una riga", true); return false; }
      return chosen;
    }}],
    onOpen: (dlg) => {
      const update = () => { const n = $$('[name="rs"]:checked', dlg).length; $(".dlg-foot .primary", dlg).textContent = `Ripristina Selezionati (${n})`; };
      dlg.addEventListener("change", update);
      update();
    }});
  if (!keys) return;
  toast("Ripristino in corso…");
  const result = await run(() => api(`api/backups/${b.id}/restore`, {method: "POST", body: {sections, part, keys}}));
  if (!result) return;
  await modal({title: result.failed.length ? "Ripristino Parziale" : "Ripristino Fatto", body: restoreResultHtml(result), actions: [{label: "Chiudi", value: null}]});
  loadSummary();
  render();
}

  const form = (u) => `${u ? "" : field("Nome Utente di Home Assistant", `<input name="username" autocomplete="off" placeholder="es. mario">`, "Lo trovi in Impostazioni → Persone → Utenti di Home Assistant.")}
    ${field("Nome", `<input name="name" maxlength="100" value="${esc(u?.name || "")}" placeholder="facoltativo">`)}
    ${field("Ruolo", `<select name="role">${Object.entries(data.roles).map(([k, r]) => `<option value="${k}" ${u?.role === k ? "selected" : ""}>${esc(r.label)}</option>`).join("")}<option value="personalizzato" ${u?.role === "personalizzato" ? "selected" : ""}>Personalizzato</option></select>`)}
    <div class="field"><label>Permessi</label><div class="perm-list">${Object.entries(data.permissions).map(([k, label]) => `<label><input type="checkbox" name="perm" value="${k}" ${(u ? u.perms : data.roles.solo_stato.perms).includes(k) ? "checked" : ""}>${esc(label)}</label>`).join("")}</div>
      <p class="hint">Tutti vedono il cruscotto e lo stato del controller.</p></div>`;
  const bind = (dlg) => {
    const role = $("[name=role]", dlg);
    const boxes = $$("[name=perm]", dlg);
    role.onchange = () => { const r = data.roles[role.value]; if (r) boxes.forEach((b) => { b.checked = r.perms.includes(b.value); }); };
    boxes.forEach((b) => b.onchange = () => {
      const chosen = boxes.filter((x) => x.checked).map((x) => x.value).sort().join(",");
      role.value = Object.entries(data.roles).find(([, r]) => [...r.perms].sort().join(",") === chosen)?.[0] || "personalizzato";
    });
  };
  const save = (u) => async (dlg) => {
    const payload = {username: u ? u.username : val(dlg, "username"), name: val(dlg, "name"), perms: $$("[name=perm]:checked", dlg).map((x) => x.value)};
    return (await run(() => api(u ? `api/users/${encodeURIComponent(u.username)}` : "api/users", {method: u ? "PUT" : "POST", body: payload}), "Utente salvato")) || false;
  };
  $("#u-new").onclick = async () => {
    if (await modal({title: "Nuovo Utente", body: form(null), onOpen: bind, actions: [{label: "Annulla", value: null}, {label: "Aggiungi", kind: "primary", submit: true, onClick: save(null)}]})) render();
  };
  body.onclick = async (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    const u = data.users.find((x) => x.username === (b.dataset.uEdit || b.dataset.uDel));
    if (!u) return;
    if (b.dataset.uEdit) {
      if (await modal({title: "Permessi di " + (u.name || u.username), body: form(u), onOpen: bind, actions: [{label: "Annulla", value: null}, {label: "Salva", kind: "primary", submit: true, onClick: save(u)}]})) {
        if (u.username === store.me.username) location.reload(); else render();
      }
    } else if (await confirmBox("Elimina Utente", `Eliminare <b>${esc(u.name || u.username)}</b>? Se riapre l'app verrà aggiunto di nuovo con "Solo Stato".`, "Elimina", true) &&
        await run(() => api(`api/users/${encodeURIComponent(u.username)}`, {method: "DELETE"}), "Utente eliminato")) render();
  };
}
async function loadAudit(more = false) {
  const params = new URLSearchParams({limit: "50"});
  if (more && auditRows.length) params.set("before_id", auditRows[auditRows.length - 1].id);
  const rows = await api("api/audit?" + params).catch(() => []);
  auditRows = more ? auditRows.concat(rows) : rows;
  const body = $("#audit");
  if (!body) return;
  body.innerHTML = auditRows.length ? auditRows.map((a) => `<tr><td>${esc(fmtDateTime(a.ts))}</td><td>${esc(a.user)}</td><td><b>${esc(a.action)}</b>${a.detail ? `<div class="muted small-text">${esc(a.detail)}</div>` : ""}</td></tr>`).join("") : '<tr><td colspan="3" class="muted">nessuna attività</td></tr>';
  $("#audit-more-box").hidden = rows.length < 50;
}
async function importCsv(e) {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  const text = await file.text();
  const preview = await run(() => api("api/import/persons", {method: "POST", body: {csv: text, apply: false}}));
  if (!preview) return;
  const table = (res) => `<p>${res.riepilogo.righe} righe: <b>${res.riepilogo.ok}</b> ${res.applicato ? "importate" : "da importare"}, <b>${res.riepilogo.aggiornate || 0}</b> ${res.applicato ? "aggiornate" : "da aggiornare"}, ${res.riepilogo.saltate} saltate, ${res.riepilogo.errori} con errori.</p>
    <div class="table-wrap"><table class="table"><thead><tr><th>Riga</th><th>Nome</th><th>Tessera</th><th>Esito</th></tr></thead><tbody>${res.righe.map((r) => `<tr><td>${r.riga}</td><td>${esc(r.nome)}</td><td><code>${esc(r.tessera)}</code></td><td><span class="pill ${r.esito === "errore" ? "err" : r.esito === "saltata" ? "" : r.esito.includes("aggiorn") ? "warn" : "ok"}">${esc(r.esito)}</span> <span class="small-text">${esc(r.dettaglio)}</span></td></tr>`).join("")}</tbody></table></div>`;
  const go = await modal({title: "Anteprima importazione", wide: true, body: table(preview),
    actions: [{label: "Annulla", value: false}, ...(preview.riepilogo.ok || preview.riepilogo.aggiornate ? [{label: [preview.riepilogo.ok ? `Importa ${preview.riepilogo.ok}` : "", preview.riepilogo.aggiornate ? `Aggiorna ${preview.riepilogo.aggiornate}` : ""].filter(Boolean).join(" e "), kind: "primary", value: true}] : [])]});
  if (!go) return;
  const result = await run(() => api("api/import/persons", {method: "POST", body: {csv: text, apply: true}}));
  if (result) await modal({title: "Importazione completata", wide: true, body: table(result), actions: [{label: "Chiudi", kind: "primary", value: true}]});
}

// ---------- Avvio ----------
async function start() {
  paintIcons();
  initNav();
  try {
    store.me = await api("api/me");
  } catch (err) { /* la pagina funziona anche senza */ }
  // Nasconde pagine e pulsanti per cui l'utente non ha il permesso
  ALL_PERMS.forEach((perm) => document.body.classList.toggle("no-" + perm, !can(perm)));
  $$("#nav a[data-route]").forEach((a) => { a.hidden = !allowedRoute(a.dataset.route); });
  // Utente collegato in fondo al menu; per l'amministratore porta alla gestione degli utenti
  if (store.me.user) {
    const user = $("#nav-user");
    user.hidden = false;
    $("#nav-avatar").textContent = initials(store.me.user);
    $("#nav-user-name").textContent = store.me.user;
    $("#nav-user-role").textContent = store.me.role || "Permessi Personalizzati";
    user.title = `${store.me.user}${store.me.admin ? " · gestisci gli utenti" : ""}`;
    if (store.me.admin) { user.href = "#impostazioni/utenti"; user.dataset.routeLink = "impostazioni"; }
  }
  await loadSummary();
  await render();
  setInterval(loadSummary, 5000);
  setInterval(refreshView, 15000);
}
start();
</script>
