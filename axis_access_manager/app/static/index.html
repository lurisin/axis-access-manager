<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Controllo Accessi</title>
<style>
  :root {
    --bg: #f3f5f8; --surface: #ffffff; --surface-2: #f7f8fa; --text: #1b1f24; --muted: #5f6b7a;
    --border: #dde2e8; --border-strong: #c5ccd5;
    --accent: #0b6bcb; --accent-soft: #e3effc; --accent-text: #ffffff;
    --ok: #1a7f37; --ok-soft: #e4f4e8; --warn: #9a6700; --warn-soft: #fbf0d9; --err: #c62828; --err-soft: #fde7e7;
    --info: #6639ba; --info-soft: #efe9fb;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
    --radius: 12px; --nav-w: 232px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --surface: #181c22; --surface-2: #1f242b; --text: #e7eaee; --muted: #9aa5b1;
      --border: #2b323b; --border-strong: #3a434e;
      --accent: #4c9cf0; --accent-soft: #15283d; --accent-text: #0b1118;
      --ok: #4ac26b; --ok-soft: #13291b; --warn: #e3b341; --warn-soft: #2e2511; --err: #ff6b6b; --err-soft: #331617;
      --info: #b093f5; --info-soft: #241c3a;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  svg.icon { width: 20px; height: 20px; fill: currentColor; flex: none; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }

  /* Struttura */
  .app { display: flex; min-height: 100vh; }
  /* Menu laterale: sempre presente con le sole icone, il pulsante ☰ lo allarga con i nomi delle pagine */
  .nav { width: 64px; flex: none; background: var(--surface); border-right: 1px solid var(--border); overflow: hidden;
         position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 10px 10px 12px; gap: 2px;
         transition: width .18s ease; z-index: 30; }
  body.nav-open .nav { width: var(--nav-w); }
  .nav .lbl, .brand .name, .nav .foot { opacity: 0; pointer-events: none; transition: opacity .12s; white-space: nowrap; }
  body.nav-open .nav .lbl, body.nav-open .brand .name, body.nav-open .nav .foot { opacity: 1; pointer-events: auto; }
  .nav-toggle { display: flex; align-items: center; gap: 12px; width: 100%; justify-content: flex-start; padding: 9px 12px;
                border: none; background: none; color: var(--text); border-radius: 10px; margin-bottom: 4px; }
  .nav-toggle:hover { background: var(--surface-2); }
  .nav-toggle .lbl { font-weight: 700; font-size: 16px; }
  .nav-backdrop { display: none; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 12px; font-weight: 700; font-size: 16px; }
  .brand .logo { width: 32px; height: 32px; border-radius: 9px; background: var(--accent); color: var(--accent-text);
                 display: grid; place-items: center; }
  .nav a { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 10px; color: var(--muted);
           font-weight: 500; position: relative; white-space: nowrap; }
  .nav a:hover { background: var(--surface-2); text-decoration: none; color: var(--text); }
  .nav a.active { background: var(--accent-soft); color: var(--accent); }
  .nav .count { position: absolute; top: 3px; left: 28px; background: var(--err); color: #fff; border-radius: 10px; font-size: 11px;
                min-width: 18px; padding: 0 5px; text-align: center; line-height: 18px; }
  body.nav-open .nav .count { position: static; margin-left: auto; font-size: 12px; min-width: 20px; line-height: 20px; }
  .nav .foot { margin-top: auto; padding: 8px 12px; color: var(--muted); font-size: 12px; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 12px; padding: 12px 24px; flex-wrap: wrap; }
  .topbar h1 { font-size: 20px; margin: 0; flex: 1; min-width: 120px; }
  .content { padding: 20px 24px 48px; max-width: 1180px; width: 100%; }

  /* Elementi */
  button, .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--surface);
                 color: var(--text); border: 1px solid var(--border-strong); border-radius: 9px; padding: 7px 14px;
                 font: inherit; font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration: none; }
  button:hover, .btn:hover { background: var(--surface-2); text-decoration: none; }
  button.primary, .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.primary:hover { filter: brightness(1.06); }
  button.danger { color: var(--err); }
  button.danger.primary { background: var(--err); border-color: var(--err); color: #fff; }
  button.ghost { border-color: transparent; background: transparent; }
  button.ghost:hover { background: var(--surface-2); }
  button.small, .btn.small { padding: 4px 10px; font-size: 13px; border-radius: 8px; }
  button.icon-only { padding: 6px; }
  button:disabled { opacity: .5; cursor: default; }
  input, select, textarea { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border-strong);
                            border-radius: 9px; padding: 7px 10px; min-width: 0; }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  textarea { resize: vertical; min-height: 70px; }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); vertical-align: middle; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
          padding: 18px; margin-bottom: 16px; }
  .card > h2, .section-title { font-size: 15px; margin: 0 0 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card > h2 .pill { white-space: normal; }
  .card > h2 .spacer, .row .spacer { flex: 1; }
  .card.flush { padding: 0; }
  .card.flush > h2 { padding: 16px 18px 0; }
  .grid { display: grid; gap: 16px; }
  .grid.kpi { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .grid.two { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); align-items: start; }
  .grid.cards { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .grid.tiles { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .door-group { margin-bottom: 18px; }
  .door-group .section-title { color: var(--muted); }
  .tile { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; min-height: 128px; background: var(--surface);
          border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); color: var(--text); }
  .tile:hover { text-decoration: none; border-color: var(--accent); }
  .tile .t { color: var(--text); }
  .tile svg.icon { width: 18px; height: 18px; }
  /* Registro compatto: una riga per evento, i dettagli al clic */
  .list.compact > .ev { display: grid; grid-template-columns: 46px 12px minmax(0, 1fr) auto; gap: 10px; align-items: center;
                        padding: 8px 16px; border-top: 1px solid var(--border); cursor: pointer; font-size: 14px; }
  .list.compact > .ev:first-child { border-top: none; }
  .list.compact > .ev:hover { background: var(--surface-2); }
  .list.compact > .ev.sel { background: var(--accent-soft); }
  .ev .time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
  .ev .what { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev .where { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; text-align: right; }
  @media (max-width: 600px) {
    .list.compact > .ev { grid-template-columns: 40px 10px minmax(0, 1fr) auto; gap: 8px; padding: 9px 12px; }
    .ev .where { max-width: 96px; font-size: 12px; }
  }
  .ev .dot.info { background: var(--info); } .ev .dot.accent { background: var(--accent); }
  .list.compact > .day { padding: 5px 16px; background: var(--surface-2); border-top: 1px solid var(--border); font-size: 12px; font-weight: 700; color: var(--muted); }
  .list.compact > .day:first-child { border-top: none; }
  .log-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (min-width: 1100px) { .log-layout.split { grid-template-columns: minmax(0, 1fr) 380px; } }
  .log-detail { position: sticky; top: 76px; }
  .hidden-count { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--border); background: var(--surface-2); font-size: 13px; color: var(--muted); }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ctl-card { position: relative; padding: 0; }
  .ctl-main { display: flex; flex-direction: column; gap: 6px; padding: 16px 60px 16px 18px; color: var(--text); }
  .ctl-main:hover { text-decoration: none; background: var(--surface-2); border-radius: inherit; }
  .ctl-name { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; }
  .ctl-stats { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; font-size: 13px; color: var(--muted); }
  .ctl-stats b { color: var(--text); font-size: 15px; }
  .ctl-stats .pill { margin-left: auto; }
  .ctl-gear { position: absolute; top: 12px; right: 12px; }
  .ctl-head { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .schema { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(56px, 200px) minmax(0, 1fr); align-items: start; }
  .sch-col { display: flex; flex-direction: column; gap: 14px; position: relative; z-index: 1; min-width: 0; }
  .sch-head { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .sch-node { display: flex; align-items: center; gap: 10px; min-height: 62px; padding: 8px 12px; border: 2px solid var(--border); border-radius: 12px; background: var(--surface);
    color: var(--text); text-align: left; font: inherit; width: 100%; box-sizing: border-box; cursor: pointer; }
  .sch-node:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
  .sch-node .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .sch-node b { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sch-meta { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sch-node.sel { border-color: var(--accent); background: var(--accent-soft); }
  .sch-node.target { border-style: dashed; border-color: var(--accent); }
  .sch-lines { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  .sch-line { fill: none; stroke-width: 3; stroke: var(--accent); }
  .sch-line.new { stroke: var(--warn); stroke-dasharray: 8 6; }
  .sch-line.off { stroke: var(--muted); stroke-dasharray: 3 6; }
  .sch-line.input { stroke: var(--info); }
  .sch-gear.input { border-color: var(--info); }
  .sch-gear { position: absolute; z-index: 2; width: 34px; height: 34px; padding: 0; border-radius: 50%; border: 2px solid var(--accent); background: var(--surface);
    display: grid; place-items: center; color: var(--text); }
  .sch-gear.new { border-color: var(--warn); } .sch-gear.off { border-color: var(--muted); }
  .sch-gear svg.icon { width: 16px; height: 16px; }
  .save-bar { position: sticky; bottom: 12px; z-index: 4; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 16px; margin-top: 12px;
    border-radius: 12px; background: #1b1f24; color: #fff; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
  .save-bar .grow { flex: 1 1 200px; min-width: 0; }
  .save-bar button:not(.primary) { background: transparent; color: #fff; border-color: #5f6b7a; }
  a.item.door-row { color: var(--text); }
  a.item.door-row:hover { text-decoration: none; background: var(--surface-2); }
  .door-group .card { margin-bottom: 18px; }
  @media (max-width: 600px) {
    .schema { grid-template-columns: minmax(0, 1fr) 46px minmax(0, 1fr); }
    .sch-node { padding: 8px; min-height: 66px; }
    .sch-node .ev-icon { display: none; }
    .sch-node b { white-space: normal; overflow-wrap: anywhere; font-size: 13px; line-height: 1.25; }
    .sch-meta { white-space: normal; font-size: 11px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  }
  .item.notif.seen .title { color: var(--muted); font-weight: 500; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; align-items: center; }
  .toolbar input[type=search] { flex: 1 1 220px; }
  .muted { color: var(--muted); }
  .small-text { font-size: 13px; }
  .empty { color: var(--muted); padding: 28px 12px; text-align: center; }
  .hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
  .kpi .card { margin: 0; padding: 16px; }
  .kpi .label { color: var(--muted); font-size: 13px; font-weight: 500; }
  .kpi .value { font-size: 28px; font-weight: 700; line-height: 1.2; margin-top: 4px; }
  .kpi .sub { color: var(--muted); font-size: 12px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 13px;
          font-weight: 500; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); white-space: nowrap; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
  .pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  .pill.err { background: var(--err-soft); color: var(--err); border-color: transparent; }
  .pill.info { background: var(--info-soft); color: var(--info); border-color: transparent; }
  .pill.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; display: inline-block; }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.err { background: var(--err); }
  .alert { display: flex; gap: 12px; align-items: flex-start; border-radius: var(--radius); padding: 12px 16px; margin-bottom: 12px;
           background: var(--warn-soft); color: var(--text); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); }
  .alert.err { background: var(--err-soft); border-color: color-mix(in srgb, var(--err) 30%, transparent); }
  .alert.info { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
  .alert b { display: block; }
  .alert b.inline { display: inline; }
  .alert .grow { flex: 1; }
  .todo { margin-bottom: 16px; }
  .todo .list .item .meta a { color: inherit; }
  .all-ok { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; padding: 10px 16px; border-radius: var(--radius);
            background: var(--ok-soft); color: var(--text); font-size: 14px; }
  .all-ok svg.icon { width: 18px; height: 18px; fill: var(--ok); flex: none; }
  dl.props { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 0; }
  dl.props dt { color: var(--muted); }
  dl.props dd { margin: 0; overflow-wrap: anywhere; }
  .list > .item { display: flex; gap: 12px; align-items: center; padding: 12px 18px; border-top: 1px solid var(--border); }
  .list > .item:first-child { border-top: none; }
  .list > .item.click { cursor: pointer; }
  .list > .item.click:hover { background: var(--surface-2); }
  .item .grow { flex: 1; min-width: 0; }
  .item .title { font-weight: 600; overflow-wrap: anywhere; }
  .item .meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .door-row .mode-meta { display: none; }
  .item .side { text-align: right; color: var(--muted); font-size: 13px; flex: none; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); flex: none;
            display: grid; place-items: center; font-weight: 700; font-size: 14px; }
  .avatar.big { width: 52px; height: 52px; font-size: 18px; }
  .avatar.off { background: var(--surface-2); color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; background: var(--surface-2); border: 1px solid var(--border);
          border-radius: 7px; padding: 1px 8px; font-size: 13px; }
  .chip.off { text-decoration: line-through; color: var(--muted); }
  .chip-btn { border-radius: 999px; padding: 4px 12px; font-size: 13px; gap: 6px; }
  .chip-btn.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  .chip-btn.on .muted { color: inherit; opacity: .7; }
  #p-list > .day { padding: 4px 18px; background: var(--surface-2); border-top: 1px solid var(--border); font-size: 12px; font-weight: 700; color: var(--muted); }
  #p-list > .day:first-child { border-top: none; }
  .person-row { display: flex; align-items: center; gap: 12px; padding: 10px 18px; border-top: 1px solid var(--border); cursor: pointer; min-height: 44px; box-sizing: border-box; }
  #p-list > .person-row:first-child { border-top: none; }
  .person-row:hover { background: var(--surface-2); }
  .person-row .name { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
  .chip svg.icon { width: 14px; height: 14px; }
  .ev-icon { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; font-size: 16px; }
  .ev-icon svg { width: 18px; height: 18px; fill: currentColor; }
  .k-ok { background: var(--ok-soft); color: var(--ok); }
  .k-warn { background: var(--warn-soft); color: var(--warn); }
  .k-err { background: var(--err-soft); color: var(--err); }
  .k-info { background: var(--info-soft); color: var(--info); }
  .k-accent { background: var(--accent-soft); color: var(--accent); }
  .k-muted { background: var(--surface-2); color: var(--muted); }
  .thumb { width: 64px; height: 48px; border-radius: 8px; object-fit: cover; cursor: zoom-in; border: 1px solid var(--border);
           flex: none; background: var(--surface-2); }
  .segmented { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 3px; gap: 2px; margin-bottom: 16px;
               max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .segmented a { padding: 6px 14px; border-radius: 8px; color: var(--muted); font-weight: 500; white-space: nowrap; }
  .segmented a:hover { text-decoration: none; color: var(--text); }
  .segmented a.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  table.table { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.table th, table.table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.table th { color: var(--muted); font-weight: 500; font-size: 13px; }
  table.table td code { word-break: break-all; }
  .table-wrap { overflow-x: auto; }

  /* Grafico settimanale */
  .chart { display: flex; align-items: flex-end; gap: 10px; height: 160px; padding-top: 8px; }
  .chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; min-width: 0; }
  .chart .bars { flex: 1; width: 100%; max-width: 44px; display: flex; flex-direction: column-reverse; border-radius: 6px; overflow: hidden;
                 background: var(--surface-2); }
  .chart .bar.g { background: var(--ok); } .chart .bar.d { background: var(--warn); } .chart .bar.u { background: var(--err); }
  .chart .lbl { font-size: 12px; color: var(--muted); }
  .chart .num { font-size: 12px; font-weight: 600; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 10px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

  /* Anteprima fascia oraria */
  .week { display: grid; grid-template-columns: 34px 1fr; gap: 3px 8px; font-size: 12px; color: var(--muted); align-items: center; }
  .week .track { position: relative; height: 12px; background: var(--surface-2); border-radius: 4px; border: 1px solid var(--border); }
  .week .seg { position: absolute; top: 0; bottom: 0; background: var(--accent); border-radius: 3px; }
  .week .axis { display: flex; justify-content: space-between; font-size: 11px; }
  .days { display: inline-flex; gap: 3px; }
  .days button { width: 32px; height: 32px; padding: 0; border-radius: 8px; font-size: 13px; }
  .days button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .rule-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px; border: 1px solid var(--border);
              border-radius: 10px; margin-bottom: 8px; background: var(--surface-2); }
  .field .rule-row input[type=time] { width: 116px; }
  /* Righe Dove e Quando delle tipologie: luogo, fascia e cestino sulla stessa riga */
  .rule-row.access-row { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr) auto; gap: 8px; padding: 6px; margin-bottom: 6px; }
  .rule-row.access-row select { width: 100%; min-width: 0; }

  if (d >= startToday) return `oggi ${fmtTime(iso)}`;
  if (d >= new Date(startToday - 86400000)) return `ieri ${fmtTime(iso)}`;
  if (diff < 6 * 86400) return d.toLocaleDateString("it-IT", {weekday: "long"}) + " " + fmtTime(iso);
  return fmtDate(iso);

  if (!iso) return "";

async function api(path, options = {}) {

// Apre una finestra: body è HTML, actions [{label, kind, onClick(dialogEl) → false per lasciarla aperta}]
function modal({title, body = "", actions = [], wide = false, cls = "", onOpen}) {
  return new Promise((resolve) => {
    const dlg = $("#modal");
    dlg.className = (wide ? "wide " : "") + cls;
    dlg.innerHTML = `<form class="dlg" method="dialog">
      <div class="dlg-head"><h2>${esc(title)}</h2><button type="button" class="ghost icon-only" data-x aria-label="Chiudi">${icon("close")}</button></div>
      <div class="dlg-body">${body}</div>
      ${actions.length ? `<div class="dlg-foot">${actions.map((a, i) => `<button type="${a.submit ? "submit" : "button"}" class="${a.kind || ""}" data-a="${i}">${esc(a.label)}</button>`).join("")}</div>` : ""}
    </form>`;
    let done = false;
    const finish = (value) => { if (done) return; done = true; dlg.close(); resolve(value); };
    $("[data-x]", dlg).onclick = () => finish(null);
    dlg.oncancel = (e) => { e.preventDefault(); finish(null); };
    const invoke = async (i) => {
      const action = actions[i];
      if (!action.onClick) return finish("value" in action ? action.value : i);
      const btns = $$(".dlg-foot button", dlg);
      btns.forEach((b) => { b.disabled = true; });
      try {
        const result = await action.onClick(dlg);
        if (result !== false) finish(result ?? true);
      } finally {
        btns.forEach((b) => { b.disabled = false; });
      }
    };
    $$(".dlg-foot button", dlg).forEach((b) => { if (!actions[b.dataset.a].submit) b.onclick = () => invoke(Number(b.dataset.a)); });
    $("form", dlg).onsubmit = (e) => {
      e.preventDefault();
      const i = actions.findIndex((a) => a.submit);
      if (i >= 0) invoke(i);
    };
    dlg.showModal();
    if (onOpen) onOpen(dlg);
    const first = $(".dlg-body input:not([type=checkbox]), .dlg-body select, .dlg-body textarea", dlg);
    if (first && !("ontouchstart" in window)) first.focus();
  });
}

function doorGroups(doors) {

async function loadPersons() {

const personTabs = (tab) => `<div class="segmented">${[["", "Persone"], ["tipologie", "Tipologie"]].map(([k, label]) => `<a href="#persone${k ? "/" + k : ""}" class="${tab === k ? "active" : ""}">${label}</a>`).join("")}</div>`;
async function viewPersons(el, sub) {

  $("#p-cats").addEventListener("click", (e) => {

    if (!b) return;

  });

  $("#p-state").addEventListener("change", (e) => { personFilters.state = e.target.value; renderPersonList(); });
  $("#p-new").addEventListener("click", () => newPerson());
  $("#p-sync").addEventListener("click", async (e) => {

  });
  $("#p-list").addEventListener("click", (e) => {

    openPerson(Number(item.dataset.person));
  });
  $("#p-list").addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && e.target.closest("[data-person]")) { e.preventDefault(); e.target.click(); } });
  renderPersonList();
  if (sub) openPerson(Number(sub));
}
function renderPersonList() {
  const list = $("#p-list");
  if (!list) return;
  const q = personFilters.q.trim().toLowerCase();
  const rows = store.persons.filter((p) => {
    const a = personAccess(p);
    if (q && !(p.name.toLowerCase().includes(q) || (p.company || "").toLowerCase().includes(q) || p.cards.some((c) => c.number.toLowerCase().includes(q)))) return false;
    if (personFilters.category !== "" && (p.category_id || 0) !== Number(personFilters.category)) return false;
    const st = personFilters.state;
    if (st === "attive" && !p.cards.some((c) => c.enabled)) return false;
    if (st === "sospese" && !p.cards.some((c) => !c.enabled)) return false;
    if (["in_scadenza", "scaduta", "futura"].includes(st) && validityState(a.from, a.to) !== st) return false;
    return true;
  });
  const cards = store.persons.reduce((n, p) => n + p.cards.length, 0);
  $("#p-count").textContent = `${plural(store.persons.length, "persona", "persone")} · ${plural(cards, "tessera", "tessere")}` + (rows.length !== store.persons.length ? ` · ${rows.length} mostrate` : "");
  // Tipologie come filtri rapidi, con il numero di persone di ognuna
  const count = (id) => store.persons.filter((p) => (p.category_id || 0) === id).length;
  const chip = (value, label, n, color = "") => `<button type="button" class="chip-btn ${personFilters.category === value ? "on" : ""}" data-cat="${value}">${color ? `<span class="swatch c-${esc(color)}"></span>` : ""}${esc(label)} <span class="muted">${n}</span></button>`;
  const none = count(0);
  $("#p-cats").innerHTML = store.categories.length ? chip("", "Tutte", store.persons.length) + store.categories.map((c) => chip(String(c.id), c.name, count(c.id), c.color)).join("") + (none ? chip("0", "Senza Tipologia", none) : "") : "";
  // Elenco essenziale: nome e tipologia, un'etichetta solo se c'è qualcosa da sistemare; il resto è nella scheda
  const sorted = [...rows].sort((a, b) => a.name.localeCompare(b.name, "it", {sensitivity: "base"}));
  let letter = "";
  list.innerHTML = sorted.length ? sorted.map((p) => {
    const a = personAccess(p);
    const vs = validityState(a.from, a.to);
    const suspended = p.cards.length && !p.cards.some((c) => c.enabled);
    const flag = !p.cards.length ? '<span class="pill">Senza Tessera</span>' : suspended ? '<span class="pill">Sospesa</span>' : VALIDITY_PILL[vs] || (customAccess(p) ? '<span class="pill warn" title="Accesso diverso da quello della tipologia">Accesso Personalizzato</span>' : "");
    const c = categoryOf(p.category_id);
    const first = (p.name.trim()[0] || "#").toLocaleUpperCase("it");
    const head = sorted.length > 12 && first !== letter ? `<div class="day">${esc(first)}</div>` : "";
    letter = first;
    return `${head}<div class="person-row" data-person="${p.id}" role="button" tabindex="0">
      <span class="swatch ${c ? `c-${esc(c.color)}` : ""}" title="${esc(c?.name || "Senza tipologia")}" ${c ? "" : 'style="background:var(--border-strong)"'}></span>
      <span class="name">${esc(p.name)}</span>${flag}
    </div>`;
  }).join("") : `<div class="empty">${store.persons.length ? "nessuna persona corrisponde ai filtri" : "nessuna persona registrata: passa una tessera sul lettore e registrala da \"Da registrare\""}</div>`;
}

function validityFields(from = "", to = "") {
  const limited = Boolean(from || to);
  return `<div class="field inline"><input type="checkbox" name="limited" id="f-limited" ${limited ? "checked" : ""}><label for="f-limited">Validità Limitata (ospiti, imprese, temporanei)</label></div>
    <div id="f-validity" ${limited ? "" : "hidden"}>
      <div class="fields-2">${field("Valida dal", `<input type="datetime-local" name="valid_from" value="${esc(toLocalInput(from))}">`)}
      ${field("Valida fino al", `<input type="datetime-local" name="valid_to" value="${esc(toLocalInput(to))}">`)}</div>
      <div class="presets"><span class="muted small-text">Da adesso:</span>
        <button type="button" class="small" data-preset="1">1 Giorno</button><button type="button" class="small" data-preset="7">1 Settimana</button>
        <button type="button" class="small" data-preset="30">1 Mese</button><button type="button" class="small" data-preset="365">1 Anno</button></div>
    </div>`;
}
function bindValidity(dlg) {
  const box = $("#f-validity", dlg);
  if (!box) return;
  $("#f-limited", dlg).addEventListener("change", (e) => { box.hidden = !e.target.checked; });
  $$("[data-preset]", dlg).forEach((b) => b.addEventListener("click", () => {
    const now = new Date();
    now.setSeconds(0, 0);
    const end = new Date(now.getTime() + Number(b.dataset.preset) * 86400000);
    $("[name=valid_from]", dlg).value = toLocalInput(now.toISOString());
    $("[name=valid_to]", dlg).value = toLocalInput(end.toISOString());
  }));
}
function readValidity(dlg) {
  if (!val(dlg, "limited")) return {valid_from: "", valid_to: ""};
  return {valid_from: fromLocalInput(val(dlg, "valid_from")), valid_to: fromLocalInput(val(dlg, "valid_to"))};
}

async function newPerson(card = "") {

      ${field("Numero Tessera", `<input name="card" class="mono" autocomplete="off" value="${esc(card)}" placeholder="es. 04A1B2C3D4E5F6">`, card ? "" : "Più comodo: passa la tessera sul lettore e registrala da \"Da Registrare\".")}
      ${field("Tipologia", categorySelect(), "Decide dove e quando apre la tessera, e la sua durata. Le tipologie si gestiscono in Persone → Tipologie.")}
      ${validityFields()}
      ${field("Note", `<textarea name="notes" maxlength="1000" placeholder="facoltative"></textarea>`)}`,
    actions: [{label: "Annulla", value: null}, {label: "Registra", kind: "primary", submit: true, onClick: async (dlg) => {
      const body = {name: val(dlg, "name"), card: val(dlg, "card"), company: val(dlg, "company"), notes: val(dlg, "notes"), category_id: Number(val(dlg, "category") || 0), ...readValidity(dlg)};

// Viste del registro: con tanto passaggio si guarda prima quello che richiede attenzione
const LOG_VIEWS = {
  controllo: ["Da Controllare", "negato,sconosciuta,allarme,manomissione"],
  negati: ["Solo Negati", "negato,sconosciuta"],
  accessi: ["Solo Accessi", "concesso,apertura_remota,citofono"],
  allarmi: ["Allarmi", "allarme,manomissione"],
  tutto: ["Tutto", ""],
};
const ACCESS_KINDS = "concesso,apertura_remota,citofono,lettura";
const savedView = () => { try { return localStorage.getItem("aam-log-view") || "controllo"; } catch (err) { return "controllo"; } };
const logFilters = {q: "", view: savedView(), door: "", from: "", to: ""};
let logEvents = [];
let logSelected = 0;
function logParams(extra = {}) {
  const p = new URLSearchParams();
  if (logFilters.q) p.set("q", logFilters.q);
  const kinds = (LOG_VIEWS[logFilters.view] || LOG_VIEWS.tutto)[1];
  if (kinds) p.set("kind", kinds);
  if (logFilters.door) p.set("door", logFilters.door);
  if (logFilters.from) p.set("since", new Date(logFilters.from + "T00:00:00").toISOString());
  if (logFilters.to) p.set("until", new Date(new Date(logFilters.to + "T00:00:00").getTime() + 86400000).toISOString());
  Object.entries(extra).forEach(([k, v]) => p.set(k, v));
  return p;
}
const KIND_DOT = {"k-ok": "ok", "k-warn": "warn", "k-err": "err", "k-info": "info", "k-accent": "accent", "k-muted": ""};
// Riga compatta: ora, colore dell'esito, chi, cosa, dove
function logRow(e) {
  const [label, cls] = KINDS[e.kind] || [e.kind, "k-muted"];
  const who = e.person_name || (e.card ? `Tessera ${e.card}` : e.kind === "citofono" ? e.source || "Citofono" : e.kind === "apertura_remota" ? e.source || "Home Assistant" : "");

    <span class="time">${esc(fmtTime(e.ts))}</span><span class="dot ${KIND_DOT[cls] || ""}"></span>
    <span class="what">${who ? `<b>${esc(who)}</b> <span class="muted">${esc(what.toLowerCase())}</span>` : `<b>${esc(label)}</b>`}${e.snapshot ? ` <span class="muted" title="con istantanea">${icon("camera", "icon")}</span>` : ""}</span>

  </div>`;
}
function eventDetail(e) {

async function viewLog(el) {

      <input type="date" id="l-from" value="${esc(logFilters.from)}" title="Dal giorno" aria-label="Dal giorno">

      <div id="l-detail" hidden></div>

  logSelected = 0;

  $$("[data-view]", el).forEach((a) => a.addEventListener("click", (e) => {

  $("#l-from").addEventListener("change", (e) => { logFilters.from = e.target.value; loadLog(); });
  $("#l-to").addEventListener("change", (e) => { logFilters.to = e.target.value; loadLog(); });

  list.addEventListener("click", pick);
  list.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(e); } });

async function loadLog(more = false) {
  const params = logParams({limit: "100"});
  if (more && logEvents.length) params.set("before_id", logEvents[logEvents.length - 1].id);
  const data = await run(() => api("api/events?" + params));
  if (!data || !$("#l-list")) return;
  logEvents = more ? logEvents.concat(data) : data;
  renderLog();
  $("#l-more-box").hidden = data.length < 100;
  $("#l-export").href = "api/export/events.csv?" + logParams();
  if (!more) updateHiddenCount();
}
// Nelle viste filtrate dice quanti accessi riusciti non si vedono, senza mostrarli tutti
async function updateHiddenCount() {
  const box = $("#l-hidden");
  if (!box) return;
  const kinds = (LOG_VIEWS[logFilters.view] || LOG_VIEWS.tutto)[1];
  if (!kinds || kinds.includes("concesso")) { box.hidden = true; return; }
  const p = logParams({kind: ACCESS_KINDS});
  if (!logFilters.from && !logFilters.to) p.set("since", new Date(new Date().setHours(0, 0, 0, 0)).toISOString());
  const r = await api("api/events/count?" + p).catch(() => null);
  if (!r || !$("#l-hidden")) return;
  box.hidden = !r.count;
  box.innerHTML = `<span class="pill ok">${r.count}</span><span style="flex:1">${r.count === 1 ? "accesso riuscito non mostrato" : "accessi riusciti non mostrati"} in questa vista${logFilters.from || logFilters.to ? "" : " (oggi)"}</span><a href="#registro" data-show-all>Mostra Tutto</a>`;
}
// Righe del registro con l'intestazione del giorno quando cambia
function logRows(events) {
  let lastDay = "";
  const today = new Date().toDateString(), yesterday = new Date(Date.now() - 86400000).toDateString();
  return events.map((e) => {
    const d = new Date(e.ts);
    const day = d.toDateString() === today ? "Oggi" : d.toDateString() === yesterday ? "Ieri" : d.toLocaleDateString("it-IT", {weekday: "long", day: "numeric", month: "long", year: "numeric"});
    const head = day !== lastDay ? `<div class="day">${esc(day)}</div>` : "";
    lastDay = day;
    return head + logRow(e);
  }).join("");
}
function renderLog() {
  $("#l-list").innerHTML = logEvents.length ? logRows(logEvents) : `<div class="empty">${logFilters.view === "controllo" && !logFilters.q ? "niente da controllare: nessun rifiuto o allarme" : "nessun evento con questi filtri"}</div>`;
}
async function refreshLog() {
  // Solo se si guarda la cima del registro senza ricerca né date
  if (logFilters.q || logFilters.from || logFilters.to || window.scrollY > 200) return;
  const data = await api("api/events?" + logParams({limit: "100"})).catch(() => null);
  if (!data || !$("#l-list")) return;
  updateHiddenCount();
  if (data.length && logEvents.length && data[0].id === logEvents[0].id) return;
  logEvents = data;
  renderLog();
}
// Opzioni porta raggruppate per struttura e area
function doorOptionGroups(doors, selected = "") {
  const groups = {};
  doors.forEach((d) => { (groups[placeOf(d) || "Porte"] ||= []).push(d); });
  return Object.entries(groups).map(([place, list]) => `<optgroup label="${esc(place)}">${list.map((d) => `<option value="${esc(d.token)}" ${d.token === selected ? "selected" : ""}>${esc(d.name)}</option>`).join("")}</optgroup>`).join("");
}
function bindSnapshots(root) {
  root.addEventListener("click", (e) => {
    const img = e.target.closest("[data-snap]");
    if (img) { e.stopPropagation(); showImage(`api/events/${img.dataset.snap}/snapshot`, img.dataset.title); }
  });
}

// ---------- Regole ----------
function weekPreview(rules) {
  const rows = DAYS.map(([code, , name]) => {
    const segs = rules.filter((r) => r.days.includes(code)).map((r) => {
      const toMin = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
      const left = (toMin(r.start) / 1440) * 100, width = ((toMin(r.end) - toMin(r.start)) / 1440) * 100;
      return width > 0 ? `<span class="seg" style="left:${left}%;width:${width}%" title="${r.start}-${r.end}"></span>` : "";
    }).join("");
    return `<span>${name}</span><div class="track">${segs}</div>`;
  }).join("");
  return `<div class="week">${rows}<span></span><div class="axis"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div></div>`;
}
const showHidden = {group: false, schedule: false};
async function viewRules(el, sub) {
  // Le tipologie (con i vecchi gruppi) sono passate in Persone
  if (sub === "tipologie" || sub === "gruppi") { location.replace("#persone/tipologie"); return; }
  const tabs = [["fasce", "Fasce Orarie"], ["festivita", "Festività"]];
  const tab = tabs.some(([k]) => k === sub) ? sub : "fasce";
  el.innerHTML = `<div class="segmented">${tabs.map(([k, label]) => `<a href="#regole/${k}" class="${tab === k ? "active" : ""}">${label}</a>`).join("")}</div><div id="r-body"><div class="loading"><span class="spinner"></span></div></div>`;
  const body = $("#r-body");
  if (tab === "festivita") return viewHolidays(body);
  await loadGroups(true);

}

async function scheduleEditor(s) {
  let rules = s && s.rules.length ? s.rules.map((r) => ({...r, days: [...r.days]})) : [{days: ["MO", "TU", "WE", "TH", "FR"], start: "08:00", end: "18:00"}];

    $("#rules", dlg).innerHTML = rules.map((r, i) => `<div class="rule-row" data-i="${i}">
      <span class="days">${DAYS.map(([code, letter, name]) => `<button type="button" class="${r.days.includes(code) ? "on" : ""}" data-day="${code}" title="${name}">${letter}</button>`).join("")}</span>
      <span class="row"><input type="time" data-k="start" value="${esc(r.start)}" step="300"> – <input type="time" data-k="end" value="${esc(r.end === "24:00" ? "23:59" : r.end)}" step="60"></span>
      <button type="button" class="ghost icon-only danger" data-rm title="Rimuovi">${icon("trash")}</button></div>`).join("") || '<p class="muted">Nessun intervallo.</p>';
    $("#preview", dlg).innerHTML = weekPreview(rules.filter((r) => r.start && r.end && r.end > r.start));
  };
  const ok = await modal({
    title: s ? "Modifica Fascia Oraria" : "Nuova Fascia Oraria",
    wide: true,
    body: `${s && !s.managed ? `<div class="alert info">${icon("alert")}<div class="grow">${s.standard ? "È una fascia predefinita del controller." : "Questa fascia è stata creata fuori dall'add-on."} Salvando la riscrivi con gli intervalli qui sotto e da quel momento la gestisce l'add-on.${s.groups.length ? ` Vale subito per: ${esc(s.groups.join(", "))}.` : ""}</div></div>` : ""}<div class="fields-2">${field("Nome", `<input name="name" maxlength="100" value="${esc(s?.name || "")}" placeholder="es. Orario negozio">`)}
      ${field("Descrizione", `<input name="description" maxlength="200" value="${esc(s?.description || "")}" placeholder="facoltativa">`)}</div>
      <div class="field"><label>Intervalli Settimanali</label><div id="rules"></div>
        <div class="row"><button type="button" class="small" id="add-rule">${icon("plus")}Aggiungi Intervallo</button>
        <span class="muted small-text">Modelli:</span><button type="button" class="small ghost" data-tpl="office">Lun-Ven 8-18</button>
        <button type="button" class="small ghost" data-tpl="shop">Lun-Sab 7-20</button><button type="button" class="small ghost" data-tpl="day">Tutti i Giorni 6-22</button><button type="button" class="small ghost" data-tpl="always">Sempre</button></div></div>
      <div class="field inline"><input type="checkbox" name="holidays" id="f-hol" ${s ? (s.holidays ? "checked" : "") : "checked"}><label for="f-hol">Non Valida nei Giorni Festivi</label></div>
      <p class="hint" style="margin:-8px 0 12px">I festivi si gestiscono nella scheda <a href="#regole/festivita">Festività</a>.</p>
      <div class="field"><label>Anteprima</label><div id="preview"></div></div>`,
    actions: [{label: "Annulla", value: null}, {label: s ? "Salva" : "Crea", kind: "primary", submit: true, onClick: async (dlg) => {
      const payload = {name: val(dlg, "name"), description: val(dlg, "description"), holidays: val(dlg, "holidays"),
        rules: rules.map((r) => ({...r, end: r.end === "23:59" ? "24:00" : r.end}))};
      const path = s ? `api/schedules/${encodeURIComponent(s.token)}` : "api/schedules";
      return (await run(() => api(path, {method: s ? "PUT" : "POST", body: payload}), s ? "Fascia aggiornata sul controller" : "Fascia creata sul controller")) || false;
    }}],
    onOpen: (dlg) => {
      renderRules(dlg);
      $("#add-rule", dlg).onclick = () => { rules.push({days: ["MO", "TU", "WE", "TH", "FR"], start: "09:00", end: "13:00"}); renderRules(dlg); };
      $$("[data-tpl]", dlg).forEach((b) => b.onclick = () => {
        rules = {office: [{days: ["MO", "TU", "WE", "TH", "FR"], start: "08:00", end: "18:00"}],
          shop: [{days: ["MO", "TU", "WE", "TH", "FR", "SA"], start: "07:00", end: "20:00"}],
          day: [{days: DAYS.map((d) => d[0]), start: "06:00", end: "22:00"}],
          always: [{days: DAYS.map((d) => d[0]), start: "00:00", end: "23:59"}]}[b.dataset.tpl];
        renderRules(dlg);
      });
      $("#rules", dlg).addEventListener("click", (e) => {
        const row = e.target.closest("[data-i]");
        if (!row) return;
        const r = rules[Number(row.dataset.i)];
        const day = e.target.closest("[data-day]");
        if (day) { r.days = r.days.includes(day.dataset.day) ? r.days.filter((d) => d !== day.dataset.day) : [...r.days, day.dataset.day]; renderRules(dlg); }
        if (e.target.closest("[data-rm]")) { rules.splice(Number(row.dataset.i), 1); renderRules(dlg); }
      });
      $("#rules", dlg).addEventListener("change", (e) => {
        const row = e.target.closest("[data-i]");
        if (row && e.target.dataset.k) { rules[Number(row.dataset.i)][e.target.dataset.k] = e.target.value; $("#preview", dlg).innerHTML = weekPreview(rules.filter((r) => r.start && r.end && r.end > r.start)); }
      });
    },
  });
  if (ok) render();
}

async function viewInstallation(el, sub) {
  const [first, tab = ""] = sub.split("/");
  const match = /^c(\d+)$/.exec(first);
  let data;
  el.innerHTML = loadingBox();
  try { data = await api("api/installation"); } catch (err) { el.innerHTML = errorBox("Impianti Non Leggibili", err); return; }
  if (first === "programmazione" && data.controllers[0]) { location.replace(`#impianti/c${data.controllers[0].id}`); return; }
  if (first === "stato" && data.controllers[0]) { location.replace(`#impianti/c${data.controllers[0].id}/stato`); return; }
  if (match) {
    const ctrl = data.controllers.find((c) => c.id === Number(match[1]));
    if (!ctrl) { el.innerHTML = `<div class="card"><div class="empty">Controller non trovato. <a href="#impianti">Torna agli Impianti</a></div></div>`; return; }
    $("#page-title").textContent = ctrl.name;
    return tab === "connessione" ? viewConnection(el, ctrl) : viewController(el, ctrl, tab);
  }
  const tabs = [["controller", "Controller"], ["strutture", "Strutture e Aree"]];
  const active = first === "strutture" ? "strutture" : "controller";
  el.innerHTML = `<div class="segmented">${tabs.map(([k, label]) => `<a href="#impianti/${k}" class="${active === k ? "active" : ""}">${label}</a>`).join("")}</div><div id="i-body">${loadingBox()}</div>`;

  await viewControllers(body, data);

  body.innerHTML = `
    <div class="toolbar"><p class="muted" style="margin:0;flex:1 1 260px">Tocca un controller per collegare lettori e porte e per la programmazione. L'ingranaggio apre indirizzo, credenziali e posizione.</p>
      ${full ? "" : `<button type="button" class="primary" id="ctrl-new">${icon("plus")}Aggiungi Controller</button>`}</div>

    ${full ? '<p class="hint">Per ora l\'add-on gestisce un controller; pagine e dati sono già pronti per averne di più.</p>' : ""}`;
  if ($("#ctrl-new")) $("#ctrl-new").onclick = () => controllerEditor();

async function viewController(el, ctrl, tab) {
  tab = ["porte", "lettori", "stato", "storico"].includes(tab) ? tab : "";
  el.innerHTML = `${controllerHeader(ctrl, tab)}<div id="c-body">${loadingBox()}</div>`;
  paintIcons(el);
  paintControllerState();
  const body = $("#c-body");
  const primary = (await api("api/installation")).controllers[0];
  // Nel frattempo si è cambiata pagina o scheda: questa risposta non serve più
  if (!body.isConnected) return;
  if (!primary || primary.id !== ctrl.id) { body.innerHTML = '<div class="card"><div class="empty">La programmazione è disponibile per il controller in uso.</div></div>'; return; }
  // Lo stato non legge la programmazione: deve funzionare anche quando il controller non risponde
  if (tab === "stato") return controllerStatus(body, ctrl);
  let p;
  try { p = await api("api/programming"); } catch (err) { if (!body.isConnected) return; body.innerHTML = errorBox("Programmazione Non Leggibile", err) + '<p class="hint">Controlla il collegamento con l\'ingranaggio Connessione.</p>'; return; }
  if (!body.isConnected) return;
  const errors = p.errors.length ? `<div class="alert">${icon("alert")}<div class="grow"><b>Alcune parti non sono leggibili</b>${p.errors.map(esc).join("<br>")}</div></div>` : "";
  const appDoor = (token) => ctrl.doors.find((d) => d.door_token === token);
  const doorName = (d) => appDoor(d.token)?.name || d.name || p.doors.find((x) => x.token === d.token)?.name || d.token;
  if (tab === "porte") return controllerDoors(body, ctrl, p, errors, appDoor);
  if (tab === "lettori") return controllerReaders(body, p, errors, doorName);
  if (tab === "storico") return controllerHistory(body, p);
  return controllerSchema(body, ctrl, p, errors, appDoor, doorName);
}

const linkKey = (l) => `${l.reader}>${l.door}`;
const linkSig = (l) => `${linkKey(l)}:${l.direction}:${l.enabled ? 1 : 0}`;
function linksOf(p) {
  const links = [];
  p.access_points.forEach((a) => a.readers.forEach((r) => {
    if (a.door && !links.some((l) => l.reader === r && l.door === a.door)) links.push({reader: r, door: a.door, direction: a.direction || "", enabled: a.enabled});
  }));
  return links;
}

const INPUT_ICONS = {"": "chip", rex: "arrow", intercom: "phone", door_monitor: "door", alarm: "alert"};
const DOOR_INPUT_ROLES = ["rex", "intercom", "door_monitor"];
const INPUT_ROLE_HINTS = {
  "": "L'ingresso non fa niente; resta solo lo stato in Home Assistant, se il controller lo manda.",
  rex: "Chiede l'apertura della porta, come un lettore in uscita: per il pulsante della portineria o di uscita.",
  intercom: "Il contatto del relè del citofono: apre la porta anche con Home Assistant spento. Nel registro compare come Relè Citofono.",
  door_monitor: "Il contatto magnetico della porta: abilita gli allarmi di porta forzata e aperta troppo a lungo.",
  alarm: "Nessuna azione sulla porta: lo stato arriva in Home Assistant con il nome scelto.",
};

function controllerSchema(body, ctrl, p, errors, appDoor, doorName) {
  const saved = linksOf(p);
  let pending = saved.map((l) => ({...l}));
  let selected = null, selectedInput = null;
  const inputs = p.inputs || [];
  const inputOf = (io) => inputs.find((i) => i.io === io);
  const linkedDoor = (i) => DOOR_INPUT_ROLES.includes(i.role) && i.door ? i.door : "";
  const inputMeta = (i) => [p.input_roles?.[i.role] || "Non Usato", linkedDoor(i) ? doorName({token: i.door}) : "", i.pins.join(", ")].filter(Boolean).join(" · ");
  const inputDot = (i) => i.port == null ? '<span class="muted" title="Stato non disponibile: il controller non invia eventi per questo ingresso">–</span>'
    : i.active === true ? '<span class="dot warn" title="Attivo"></span>' : i.active === false ? '<span class="dot ok" title="A riposo"></span>' : "";
  const readerName = (token) => { const r = p.readers.find((x) => x.token === token); return r?.name || token; };
  const directionsOf = (door) => [...new Set(p.access_points.filter((a) => a.door === door).map((a) => a.direction || ""))];
  const changes = () => {
    const before = new Map(saved.map((l) => [linkKey(l), l]));
    const after = new Map(pending.map((l) => [linkKey(l), l]));
    const list = [];
    after.forEach((l, k) => {
      const old = before.get(k);
      if (!old) list.push(`Collega ${readerName(l.reader)} → ${doorName({token: l.door})} (${DIRECTION_LABELS[l.direction]})`);
      else if (linkSig(old) !== linkSig(l)) list.push(`${readerName(l.reader)} → ${doorName({token: l.door})}: ${DIRECTION_LABELS[l.direction]}${l.enabled ? "" : ", disattivato"}`);
    });
    before.forEach((l, k) => { if (!after.has(k)) list.push(`Scollega ${readerName(l.reader)} da ${doorName({token: l.door})}`); });
    return list;
  };
  body.innerHTML = `${errors}
    <div class="card">
      <p class="muted small-text" id="sch-hint" style="margin-top:0"></p>
      ${p.readers.length && p.doors.length ? `<div class="schema" id="schema">
        <div class="sch-col"><div class="sch-head">Lettori</div>${p.readers.map((r) => `<button type="button" class="sch-node" data-reader="${esc(r.token)}">
          <span class="ev-icon k-accent">${icon("card")}</span><span class="grow"><b>${esc(r.name || r.token)}</b><span class="sch-meta" data-reader-meta="${esc(r.token)}"></span></span></button>`).join("")}
          ${inputs.length ? `<div class="sch-head" style="margin-top:8px">Ingressi</div>${inputs.map((i) => `<button type="button" class="sch-node" data-input="${esc(i.io)}">
          <span class="ev-icon ${i.role ? "k-info" : "k-muted"}">${icon(INPUT_ICONS[i.role] || "chip")}</span><span class="grow"><b>${esc(i.name)}</b><span class="sch-meta">${esc(inputMeta(i))}</span></span>${inputDot(i)}</button>`).join("")}` : ""}</div>
        <div class="sch-mid"></div>
        <div class="sch-col"><div class="sch-head" style="text-align:right">Porte</div>${p.doors.map((d) => `<button type="button" class="sch-node" data-door="${esc(d.token)}">
          <span class="ev-icon k-ok">${icon("door")}</span><span class="grow"><b>${esc(doorName(d))}</b><span class="sch-meta">${appDoor(d.token) ? esc(d.name && d.name !== doorName(d) ? `sul controller: ${d.name}` : d.token) : "non gestita dall'app"}</span></span></button>`).join("")}</div>
        <svg class="sch-lines" id="sch-svg" aria-hidden="true"></svg><div id="sch-gears"></div>
      </div>` : '<div class="empty">Sul controller non ci sono lettori o porte da collegare.</div>'}
      <p class="hint">Ogni filo è un lettore o un ingresso che comanda una porta. I collegamenti dei lettori si scrivono sul controller solo con Salva; quelli degli ingressi con il Salva della loro scheda. Ogni modifica si può annullare dallo Storico Modifiche.</p>
    </div>
    <div class="save-bar" id="sch-bar" hidden><span class="grow" id="sch-changes"></span><button type="button" id="sch-discard">Scarta</button><button type="button" class="primary" id="sch-save">Salva</button></div>`;
  paintIcons(body);
  const schema = $("#schema");
  if (!schema) return;

  function draw() {
    if (!document.body.contains(schema)) { window.removeEventListener("resize", draw); return; }
    const box = schema.getBoundingClientRect();
    const svg = $("#sch-svg"), gears = $("#sch-gears");
    svg.setAttribute("width", box.width);
    svg.setAttribute("height", box.height);
    const savedSig = new Set(saved.map(linkSig));
    const used = [];
    let paths = "", buttons = "";
    pending.forEach((l, i) => {
      const r = $(`[data-reader="${CSS.escape(l.reader)}"]`, schema), d = $(`[data-door="${CSS.escape(l.door)}"]`, schema);
      if (!r || !d) return;
      const a = r.getBoundingClientRect(), b = d.getBoundingClientRect();
      const x1 = a.right - box.left, y1 = a.top + a.height / 2 - box.top, x2 = b.left - box.left, y2 = b.top + b.height / 2 - box.top;
      const mx = (x1 + x2) / 2;
      const state = !l.enabled ? "off" : savedSig.has(linkSig(l)) ? "ok" : "new";
      paths += `<path d="M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}" class="sch-line ${state}"/>`;
      // Punto del filo per l'ingranaggio, spostato se un altro è già lì (fili che si incrociano)
      let t = 0.5, gx, gy;
      for (const candidate of [0.5, 0.32, 0.68, 0.2, 0.8]) {
        t = candidate;
        const u = 1 - t;
        gx = u * u * u * x1 + 3 * u * u * t * mx + 3 * u * t * t * mx + t * t * t * x2;
        gy = u * u * u * y1 + 3 * u * u * t * y1 + 3 * u * t * t * y2 + t * t * t * y2;
        if (!used.some(([ux, uy]) => Math.hypot(ux - gx, uy - gy) < 34)) break;
      }
      used.push([gx, gy]);
      buttons += `<button type="button" class="sch-gear ${state}" data-link="${i}" style="left:${gx - 17}px;top:${gy - 17}px" title="${esc(readerName(l.reader))} → ${esc(doorName({token: l.door}))} · ${DIRECTION_LABELS[l.direction]}" aria-label="Impostazioni del collegamento ${esc(readerName(l.reader))} verso ${esc(doorName({token: l.door}))}">${icon("cog")}</button>`;
    });
    inputs.forEach((i) => {
      if (!linkedDoor(i)) return;
      const n = $(`[data-input="${CSS.escape(i.io)}"]`, schema), d = $(`[data-door="${CSS.escape(i.door)}"]`, schema);
      if (!n || !d) return;
      const a = n.getBoundingClientRect(), b = d.getBoundingClientRect();
      const x1 = a.right - box.left, y1 = a.top + a.height / 2 - box.top, x2 = b.left - box.left, y2 = b.top + b.height / 2 - box.top;
      const mx = (x1 + x2) / 2;
      paths += `<path d="M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}" class="sch-line input"/>`;
      // Ingranaggio verso l'ingresso, per non sovrapporsi a quelli dei lettori al centro
      const t = 0.3, u = 1 - t;
      const gx = u * u * u * x1 + 3 * u * u * t * mx + 3 * u * t * t * mx + t * t * t * x2;
      const gy = u * u * u * y1 + 3 * u * u * t * y1 + 3 * u * t * t * y2 + t * t * t * y2;
      buttons += `<button type="button" class="sch-gear input" data-input-gear="${esc(i.io)}" style="left:${gx - 17}px;top:${gy - 17}px" title="${esc(i.name)} → ${esc(doorName({token: i.door}))}" aria-label="Impostazioni dell'ingresso ${esc(i.name)}">${icon("cog")}</button>`;
    });
    svg.innerHTML = paths;
    gears.innerHTML = buttons;
  }

  function update() {
    $$("[data-reader]", schema).forEach((n) => n.classList.toggle("sel", n.dataset.reader === selected));
    $$("[data-input]", schema).forEach((n) => n.classList.toggle("sel", n.dataset.input === selectedInput));
    $$("[data-door]", schema).forEach((n) => n.classList.toggle("target", Boolean(selected || selectedInput)));
    $$("[data-reader-meta]", schema).forEach((m) => {
      const mine = pending.filter((l) => l.reader === m.dataset.readerMeta);
      m.textContent = mine.length ? mine.map((l) => `${doorName({token: l.door})} · ${DIRECTION_LABELS[l.direction]}`).join(", ") : "non collegato";
    });
    $("#sch-hint").textContent = selectedInput ? `Ora tocca la porta da collegare a ${inputOf(selectedInput)?.name}, oppure tocca di nuovo l'ingresso per nome, ruolo e cablaggio.`
      : selected ? `Ora tocca la porta da collegare a ${readerName(selected)}. Tocca di nuovo il lettore per annullare.`
      : "Tocca un lettore o un ingresso e poi una porta per collegarli. L'ingranaggio sul filo apre le impostazioni del collegamento.";
    const list = changes();
    $("#sch-bar").hidden = !list.length;
    $("#sch-changes").textContent = list.length ? `Modifiche non salvate: ${list.length === 1 ? list[0] : plural(list.length, "modifica", "modifiche")}` : "";
    $("#sch-changes").title = list.join("\n");
    draw();
  }

  // Stesso punto di accesso (porta e direzione): si attiva e disattiva insieme
  const setEnabled = (l, enabled) => pending.forEach((x) => { if (x.door === l.door && x.direction === l.direction) x.enabled = enabled; });

  async function editLink(l) {
    const dirs = directionsOf(l.door);
    const shared = pending.filter((x) => x !== l && x.door === l.door && x.direction === l.direction).map((x) => readerName(x.reader));
    const result = await modal({title: `${readerName(l.reader)} → ${doorName({token: l.door})}`,
      body: `${field("Direzione", `<select name="direction">${dirs.map((k) => `<option value="${esc(k)}" ${k === l.direction ? "selected" : ""}>${DIRECTION_LABELS[k] ?? esc(k)}</option>`).join("")}</select>`,
        "Ingresso o uscita dalla porta: i gruppi possono dare accesso solo in una direzione.")}
        <div class="field inline"><input type="checkbox" name="enabled" id="f-le" ${l.enabled ? "checked" : ""}><label for="f-le">Collegamento Attivo</label></div>
        <p class="hint" style="margin-top:-8px">Spento: il lettore resta collegato ma non apre la porta.${shared.length ? ` Vale anche per ${esc(shared.join(", "))}, che usano lo stesso punto di accesso.` : ""}</p>`,
      actions: [{label: "Scollega", kind: "danger", value: "unlink"}, {label: "Annulla", value: null}, {label: "Applica", kind: "primary", submit: true, onClick: (dlg) => ({direction: val(dlg, "direction"), enabled: val(dlg, "enabled")})}]});
    if (!result) return;
    if (result === "unlink") pending = pending.filter((x) => x !== l);
    else {
      l.direction = result.direction;
      setEnabled(l, result.enabled);
      l.enabled = result.enabled;
    }
    update();
  }

  async function editInput(i, door = "") {
    let role = i.role;
    if (door && !DOOR_INPUT_ROLES.includes(role)) role = i.roles.find((r) => DOOR_INPUT_ROLES.includes(r)) || "";
    if (door && !DOOR_INPUT_ROLES.includes(role)) { toast(`${i.name}: questo ingresso non si collega a una porta`, true); return; }
    const doorOptions = p.doors.map((d) => `<option value="${esc(d.token)}" ${d.token === (door || i.door) ? "selected" : ""}>${esc(doorName(d))}</option>`).join("");
    const startName = role !== i.role && (i.name === i.default_name || Object.values(p.input_roles).includes(i.name)) ? p.input_roles[role] || i.default_name : i.name;
    const ok = await modal({title: i.name,
      body: `${field("Nome", `<input name="name" maxlength="64" value="${esc(startName)}" placeholder="${esc(i.default_name)}">`, `Morsetti ${esc(i.pins.join(", "))}.${i.port != null ? " È anche il nome dell'entità in Home Assistant." : ""} Compare nel registro per le aperture da questo ingresso.`)}
        ${field("Ruolo", `<select name="role">${i.roles.map((r) => `<option value="${esc(r)}" ${r === role ? "selected" : ""}>${esc(p.input_roles[r])}</option>`).join("")}</select>`, `<span data-role-hint>${esc(INPUT_ROLE_HINTS[role] || "")}</span>${i.io === "DPS" ? " Il ruolo Sensore Porta arriva dopo una prova al banco." : ""}`)}
        <div data-door-field ${DOOR_INPUT_ROLES.includes(role) ? "" : "hidden"}>${field("Porta", `<select name="door">${doorOptions}</select>`)}</div>
        ${field("Contatto", `<select name="contact">${Object.entries(p.contacts).map(([k, v]) => `<option value="${esc(k)}" ${k === i.contact ? "selected" : ""}>${esc(v)}</option>`).join("")}</select>`, "Normalmente Aperto: il contatto si chiude quando si preme il pulsante o scatta il relè.")}
        <div class="field inline"><input type="checkbox" name="supervised" id="f-sup" ${i.supervised ? "checked" : ""} ${i.can_supervise ? "" : "disabled"}><label for="f-sup">Linea Supervisionata</label></div>
        <p class="hint" style="margin-top:-8px">${i.can_supervise ? "Con le resistenze di fine linea il controller riconosce un cavo tagliato o in corto e non lo scambia per una pressione. Attivala solo se le resistenze sono montate. Dopo averla tolta, l'ingresso può risultare attivo finché non riavvii il controller." : "Questo ingresso non supporta la linea supervisionata."}</p>`,
      onOpen: (dlg) => {
        const select = $('[name="role"]', dlg), name = $('[name="name"]', dlg);
        select.onchange = () => {
          // Il nome segue il ruolo finché è quello di serie
          if (!name.value.trim() || name.value.trim() === i.default_name || Object.values(p.input_roles).includes(name.value.trim())) {
            name.value = select.value ? p.input_roles[select.value] : i.default_name;
          }
          $("[data-door-field]", dlg).hidden = !DOOR_INPUT_ROLES.includes(select.value);
          $("[data-role-hint]", dlg).textContent = INPUT_ROLE_HINTS[select.value] || "";
        };
      },
      actions: [{label: "Annulla", value: null}, {label: "Scrivi sul Controller", kind: "primary", submit: true, onClick: async (dlg) =>
        (await saveProgramming(`api/programming/inputs/${encodeURIComponent(i.io)}`, {name: val(dlg, "name"), role: val(dlg, "role"), door: val(dlg, "door"), contact: val(dlg, "contact"), supervised: val(dlg, "supervised")}, "Ingresso salvato")) || false}]});
    if (ok) render();
  }

  schema.onclick = (e) => {
    const inputGear = e.target.closest("[data-input-gear]");
    if (inputGear) { selected = null; selectedInput = null; update(); editInput(inputOf(inputGear.dataset.inputGear)); return; }
    const input = e.target.closest("[data-input]");
    if (input) {
      selected = null;
      if (selectedInput === input.dataset.input) { selectedInput = null; update(); editInput(inputOf(input.dataset.input)); }
      else { selectedInput = input.dataset.input; update(); }
      return;
    }
    if (selectedInput && e.target.closest("[data-door]")) {
      const i = inputOf(selectedInput);
      selectedInput = null;
      update();
      editInput(i, e.target.closest("[data-door]").dataset.door);
      return;
    }
    const gear = e.target.closest("[data-link]");
    if (gear) { selected = null; editLink(pending[Number(gear.dataset.link)]); return; }
    const reader = e.target.closest("[data-reader]");
    if (reader) { selectedInput = null; selected = selected === reader.dataset.reader ? null : reader.dataset.reader; update(); return; }
    const door = e.target.closest("[data-door]");
    if (!door || !selected) return;
    const token = door.dataset.door;
    const dirs = directionsOf(token);
    if (pending.some((l) => l.reader === selected && l.door === token)) toast("Lettore e porta sono già collegati: usa l'ingranaggio sul filo");
    else if (!dirs.length) toast("Sul controller questa porta non ha punti di accesso: per ora l'app collega solo a punti di accesso già programmati", true);
    else {
      const direction = dirs.includes("in") ? "in" : dirs[0];
      const same = pending.find((l) => l.door === token && l.direction === direction);
      pending.push({reader: selected, door: token, direction, enabled: same ? same.enabled : true});
    }
    selected = null;
    update();
  };
  async function save(rerender = true) {
    const list = changes();
    if (!list.length) return true;
    const ok = await confirmBox("Scrivi sul Controller", `Queste modifiche cambiano quale lettore apre quale porta:<ul style="margin:8px 0 0;padding-left:20px">${list.map((x) => `<li>${esc(x)}</li>`).join("")}</ul><p class="hint">Se dopo il salvataggio le tessere non aprono più, annulla dallo Storico Modifiche.</p>`, "Salva sul Controller");
    if (!ok) return false;
    const result = await run(() => api("api/programming/links", {method: "PUT", body: {links: pending}}), "Collegamenti scritti sul controller");
    if (!result) return false;
    pageGuard = null;
    if (rerender) render();
    return true;
  }
  $("#sch-save").onclick = () => save();
  $("#sch-discard").onclick = () => { pending = saved.map((l) => ({...l})); selected = null; update(); };
  pageGuard = {dirty: () => changes().length > 0, save: () => save(false)};
  window.addEventListener("resize", draw);
  update();
  requestAnimationFrame(draw);
}

const DOOR_TIME_FIELDS = [
  ["access_time", "Tempo di Apertura", "Quanto resta sbloccata dopo un accesso. Massimo 30 s, per non tenere alimentata a lungo la serratura.", 30],
  ["extended_access_time", "Apertura Estesa", "Per chi ha bisogno di più tempo (es. Apri a Lungo). Massimo 60 s.", 60],
  ["open_too_long_time", "Allarme Aperta Troppo a Lungo", "Dopo quanto la porta aperta va in allarme.", 3600],
  ["extended_open_too_long_time", "Allarme con Apertura Estesa", "", 7200],
  ["pre_alarm_time", "Preallarme", "Avviso prima dell'allarme.", 3600],
];
const configDetails = (items) => items.length ? `<details style="margin-top:10px"><summary class="small-text muted" style="cursor:pointer">Dettagli Tecnici (${items.length})</summary>
  <div class="table-wrap"><table class="table"><tbody>${items.map((c) => `<tr><td><code>${esc(c.name)}</code></td><td><code>${esc(c.value)}</code></td></tr>`).join("")}</tbody></table></div></details>` : "";
const saveProgramming = (path, payload, message) => run(() => api(path, {method: "PUT", body: payload}), message);

// Porte del controller: impostazioni dell'app (telecamera, citofono, pulsanti) e nome e tempi sul controller
function controllerDoors(body, ctrl, p, errors, appDoor) {
  const appInfo = (d) => {
    const door = appDoor(d.token);
    if (!door) return `<p class="muted small-text" style="margin:8px 0 0">Non gestita dall'app: niente registro per porta, pulsanti in Home Assistant o citofono.</p>`;
    return props([
      ["Nome nell'App", esc(door.name)],
      ["Telecamera", door.snapshot_camera ? `<code>${esc(door.snapshot_camera)}</code>${door.snapshot_on_granted ? " · anche accessi concessi" : ""}` : '<span class="muted">Nessuna</span>'],
      ["Citofono", door.intercom_name ? `${esc(door.intercom_name)} · relè ${door.intercom_relay}${door.intercom_open_door ? ' · <span class="pill ok">Apre la Porta</span>' : ' · <span class="pill">Solo Registro</span>'}` : '<span class="muted">Nessuno</span>'],
      ["Pulsanti HA", door.ha_buttons ? "Apri e Apri a Lungo" : '<span class="muted">Nessuno</span>'],
    ]);
  };
  const missing = ctrl.doors.filter((d) => !p.doors.some((x) => x.token === d.door_token));
  body.innerHTML = `${errors}
    <div class="grid cards">${p.doors.map((d) => `<div class="card" style="margin:0">
      <h2>${icon("door")}${esc(appDoor(d.token)?.name || d.name || d.token)}<span class="spacer"></span>${appDoor(d.token) ? '<span class="pill ok">Nell\'App</span>' : '<span class="pill">Solo Controller</span>'}</h2>
      ${appInfo(d)}
      <h3 class="section-title" style="margin-top:14px">Sul Controller</h3>
      ${props([["Nome", esc(d.name || "—")], ["Token", `<code>${esc(d.token)}</code>`], ...DOOR_TIME_FIELDS.filter(([k]) => d[k] !== null && d[k] !== undefined).map(([k, label]) => [label, secs(d[k])])])}
      ${d.description ? `<p class="hint">${esc(d.description)}</p>` : ""}${configDetails(d.configuration)}
      <div class="row" style="margin-top:12px">${appDoor(d.token) ? `<button type="button" class="small" data-app-edit="${esc(d.token)}">${icon("edit")}Impostazioni App</button>` : `<button type="button" class="small primary" data-app-add="${esc(d.token)}">${icon("plus")}Gestisci nell'App</button>`}
        ${d.editable || d.name ? `<button type="button" class="small" data-pd="${esc(d.token)}">${icon("clock")}Nome e Tempi</button>` : ""}
        ${appDoor(d.token) ? `<button type="button" class="small ghost danger" data-app-del="${esc(d.token)}">Togli dall'App</button>` : ""}</div>
    </div>`).join("") || '<div class="card"><div class="empty">Nessuna porta letta dal controller.</div></div>'}</div>
    ${missing.length ? `<div class="alert" style="margin-top:16px">${icon("alert")}<div class="grow"><b>Porte non trovate sul controller</b>${missing.map((d) => `${esc(d.name)} (<code>${esc(d.door_token)}</code>)`).join(", ")}: controlla la programmazione o toglile dall'app.
      ${missing.map((d) => `<button type="button" class="small ghost danger" data-app-del="${esc(d.door_token)}">Togli ${esc(d.name)}</button>`).join(" ")}</div></div>` : ""}`;
  paintIcons(body);
  body.onclick = async (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.appEdit) doorEditor(ctrl, appDoor(b.dataset.appEdit));
    else if (b.dataset.appAdd) doorEditor(ctrl, null, b.dataset.appAdd, p.doors.find((d) => d.token === b.dataset.appAdd)?.name);
    else if (b.dataset.appDel) {
      const door = appDoor(b.dataset.appDel);
      if (await confirmBox("Togli dall'App", `Togliere <b>${esc(door.name)}</b> dall'app? Spariscono anche i suoi pulsanti in Home Assistant e il collegamento al citofono. Sul controller non cambia niente.`, "Togli", true) &&
          await run(() => api(`api/doors/${door.id}`, {method: "DELETE"}), "Porta tolta dall'app")) { loadSummary(); render(); }
    } else if (b.dataset.pd) {
      const d = p.doors.find((x) => x.token === b.dataset.pd);
      const times = DOOR_TIME_FIELDS.filter(([k]) => d[k] !== null && d[k] !== undefined);
      const ok = await modal({title: "Porta " + (d.name || d.token), body: `${field("Nome sul Controller", `<input name="name" maxlength="64" value="${esc(d.name)}">`)}
        ${field("Descrizione", `<input name="description" maxlength="200" value="${esc(d.description)}">`)}
        ${times.length ? `<div class="fields-2">${times.map(([k, label, hint, max]) => field(label + " (Secondi)", `<input type="number" name="${k}" min="0" max="${Math.max(max, d[k])}" step="1" value="${d[k]}">`, hint)).join("")}</div>` : ""}`,
        actions: [{label: "Annulla", value: null}, {label: "Scrivi sul Controller", kind: "primary", submit: true, onClick: async (dlg) => {
          const payload = {name: val(dlg, "name"), description: val(dlg, "description")};
          times.forEach(([k]) => { payload[k] = Number(val(dlg, k)); });
          return (await saveProgramming(`api/programming/doors/${encodeURIComponent(d.token)}`, payload, "Porta aggiornata sul controller")) || false;
        }}]});
      if (ok) render();
    }
  };
}

function controllerReaders(body, p, errors, doorName) {
  const links = linksOf(p);
  body.innerHTML = `${errors}
    <div class="grid cards">${p.readers.map((r) => {
      const mine = links.filter((l) => l.reader === r.token);
      return `<div class="card" style="margin:0">
      <h2>${icon("card")}${esc(r.name || r.token)}</h2>
      ${props([["Comanda", mine.length ? mine.map((l) => `${esc(doorName(p.doors.find((d) => d.token === l.door) || {token: l.door}))} · ${DIRECTION_LABELS[l.direction]}${l.enabled ? "" : ' <span class="pill err">Spento</span>'}`).join("<br>") : '<span class="muted">Nessuna porta</span>'],
        ["Token", `<code>${esc(r.token)}</code>`], ["Posizione", esc(r.location || "—")], ["Attesa PIN", secs(r.timeout)]])}
      ${r.description ? `<p class="hint">${esc(r.description)}</p>` : ""}${configDetails(r.configuration)}
      <div class="row" style="margin-top:12px"><button type="button" class="small" data-pr="${esc(r.token)}">${icon("edit")}Nome e Descrizione</button></div>
    </div>`;
    }).join("") || '<div class="card"><div class="empty">Nessun lettore letto dal controller.</div></div>'}</div>
    <p class="hint">Quale porta comanda ogni lettore si sceglie nello Schema.</p>`;

  body.onclick = async (e) => {
    const b = e.target.closest("[data-pr]");
    if (!b) return;

      ${field("Descrizione", `<input name="description" maxlength="200" value="${esc(r.description)}">`)}`,
      actions: [{label: "Annulla", value: null}, {label: "Scrivi sul Controller", kind: "primary", submit: true, onClick: async (dlg) =>
        (await saveProgramming(`api/programming/readers/${encodeURIComponent(r.token)}`, {name: val(dlg, "name"), description: val(dlg, "description")}, "Lettore aggiornato sul controller")) || false}]});
    if (ok) render();
  };
}

// Stato del controller, delle sue porte, degli eventi MQTT e dei citofoni
async function controllerStatus(body, ctrl) {
  let s;
  try { s = await api("api/status"); } catch (err) { body.innerHTML = errorBox("Stato Non Leggibile", err); return; }
  const c = s.controller, m = s.mqtt;
  const connection = ` <a href="#impianti/c${ctrl.id}/connessione">Controlla la Connessione</a>`;
  const ctrlInfo = c.ok ? props([
    ["Stato", `${statusDot("ok")} Raggiungibile`], ["Modello", esc(c.model)], ["Firmware", esc(c.firmware)], ["Numero di Serie", `<code>${esc(c.serial)}</code>`],
    ["Indirizzo", `<code>${esc(ctrl.host)}</code>`], ["Porte sul Controller", c.doors.map((d, i) => `<span title="${esc(d)}">${esc(c.door_names?.[i] || d)}</span>`).join(", ")],
    ["Lettori", esc(c.readers ?? "—")], ["Tessere sul Controller", esc(c.credentials)],
  ]) : `<div class="alert err" style="margin:0">${icon("alert")}<div class="grow"><b>Controller Non Raggiungibile</b>${esc(c.error)}${connection}</div></div>`;
  const cats = Object.entries(m.categories || {});
  const mqtt = !m.configured ? `<div class="alert err" style="margin:0">${icon("alert")}<div class="grow"><b>Nessun Broker</b>Installa l'add-on Mosquitto o imposta mqtt_host nelle opzioni dell'add-on.</div></div>` : props([
    ["Broker", m.connected ? `${statusDot("ok")} Collegato` : `${statusDot("err")} Non Collegato ${esc(m.error)}`],
    ["Prefisso", `<code>${esc(m.prefix)}</code>`],
    ["Controller", m.controller_online === null ? "stato non ancora ricevuto" : m.controller_online ? `${statusDot("ok")} Online` : `${statusDot("err")} Offline`],
    ["Ultima Tessera Letta", m.last_card ? `<code>${esc(m.last_card.card)}</code> ${esc(relTime(m.last_card.read_at))}` : "nessuna dall'avvio"],
    ["Eventi AccessControl", m.access_events_seen ? `${statusDot("ok")} Ricevuti` : `${statusDot("warn")} Non Ancora Ricevuti`],
  ]) + (m.connected && !m.access_events_seen ? '<p class="hint">Se dopo il passaggio di una tessera compare solo IdPoint, aggiungi gli eventi AccessControl (accesso concesso e negato) al filtro eventi MQTT dell\'A1210: servono per sapere se la porta si è aperta e perché un accesso è stato negato.</p>' : "")
    + (cats.length ? `<details style="margin-top:12px"><summary class="small-text muted" style="cursor:pointer">Eventi Ricevuti per Categoria (${cats.length})</summary><div class="table-wrap"><table class="table"><thead><tr><th>Categoria</th><th>Eventi</th><th>Ultimo Topic</th></tr></thead><tbody>${cats.map(([n, x]) => `<tr><td>${esc(n)}</td><td>${x.count}</td><td><code>${esc(x.last_topic)}</code><div class="muted small-text">${esc(relTime(x.last_seen))}</div></td></tr>`).join("")}</tbody></table></div></details>` : "");
  const doors = s.doors.filter((d) => ctrl.doors.some((x) => x.id === d.id));
  const doorList = doors.length ? `<div class="list">${doors.map((d) => `<a class="item door-row" href="#porte/${d.id}" style="padding-left:0;padding-right:0">
      <div class="ev-icon ${d.mode === "Locked" ? "k-ok" : d.mode ? "k-warn" : "k-muted"}">${icon("door")}</div>
      <div class="grow"><div class="title">${esc(d.name)}</div>
