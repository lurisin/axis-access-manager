// Strutture e aree: dove si trovano i controller e quindi le loro porte (hotel, ville, teatro...)
async function viewSites(body, data) {
  let sites;
  try { sites = await api("api/locations"); } catch (err) { body.innerHTML = errorBox("Strutture Non Leggibili", err); return; }
  const ctrlName = (id) => data.controllers.find((c) => c.id === id)?.name || `controller ${id}`;
  const real = sites.filter((x) => x.id);
  const loose = sites.find((x) => !x.id);
  const chips = (a) => [...a.controllers.map((id) => `<a class="chip" href="#impianti/c${id}">${icon("chip")}${esc(ctrlName(id))}</a>`),
    ...(a.doors.length ? [`<span class="chip">${icon("door")}${plural(a.doors.length, "porta", "porte")}</span>`] : [])].join("") || "vuota";
  body.innerHTML = `
    <p class="muted" style="margin-top:0">Ogni controller sta in un'area di una struttura, ad esempio Teatro Eliseo › Via Consulta o Hotel Giulia › Primo Piano. Porte e lettori del controller ereditano la sua area; la posizione precisa va nella descrizione del controller.</p>
    <div class="toolbar"><h2 class="section-title" style="margin:0;flex:1">Strutture</h2><button type="button" class="primary" id="site-new">${icon("plus")}Nuova Struttura</button></div>
    ${real.length ? real.map((site) => `<div class="card">
      <h2>${icon("building")}${esc(site.name)}<span class="spacer"></span>
        <button type="button" class="small" data-area-new="${site.id}">${icon("plus")}Area</button>
        <button type="button" class="small ghost icon-only" data-site-edit="${site.id}" aria-label="Modifica struttura">${icon("edit")}</button>
        <button type="button" class="small ghost icon-only danger" data-site-del="${site.id}" aria-label="Elimina struttura">${icon("trash")}</button></h2>
      ${site.description ? `<p class="muted" style="margin:-6px 0 10px">${esc(site.description)}</p>` : ""}
      ${site.areas.length ? `<div class="list">${site.areas.map((a) => `<div class="item"><div class="grow"><div class="title">${esc(a.name)}</div>
        <div class="meta">${chips(a)}</div></div>
        <button type="button" class="small ghost icon-only" data-area-edit="${a.id}" aria-label="Rinomina area">${icon("edit")}</button>
        <button type="button" class="small ghost icon-only danger" data-area-del="${a.id}" aria-label="Elimina area">${icon("trash")}</button></div>`).join("")}</div>` : '<p class="muted" style="margin:0">Nessuna area: aggiungine una, ad esempio Piano Terra o Ingresso.</p>'}
    </div>`).join("") : '<div class="card"><div class="empty">Nessuna struttura: creane una, ad esempio Hotel, Teatro o Villa 1.</div></div>'}
    ${loose ? `<div class="alert">${icon("alert")}<div class="grow"><b>Senza Area</b>${loose.areas[0].controllers.map((id) => esc(ctrlName(id))).join(", ") || plural(loose.areas[0].doors.length, "porta", "porte")}: scegli l'area con l'ingranaggio Connessione del controller.</div></div>` : ""}`;
  const allAreas = real.flatMap((x) => x.areas.map((a) => ({...a, site: x})));
  const nameDialog = (title, label, value = "", extra = "") => modal({title, body: field(label, `<input name="name" maxlength="64" value="${esc(value)}">`) + extra,
    actions: [{label: "Annulla", value: null}, {label: "Salva", kind: "primary", submit: true, onClick: (dlg) => ({name: val(dlg, "name"), description: val(dlg, "description")})}]});
  $("#site-new").onclick = async () => {
    const r = await nameDialog("Nuova Struttura", "Nome", "", field("Descrizione", '<input name="description" maxlength="200" placeholder="facoltativa">'));
    if (r && await run(() => api("api/sites", {method: "POST", body: r}), "Struttura aggiunta")) { await loadSummary(); render(); }
  };
  const inside = (a) => a.controllers.length ? ` ${plural(a.controllers.length, "controller resterà", "controller resteranno")} senza area.` : "";
  body.onclick = async (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    const site = real.find((x) => x.id === Number(b.dataset.siteEdit || b.dataset.siteDel || b.dataset.areaNew));
    const area = allAreas.find((a) => a.id === Number(b.dataset.areaEdit || b.dataset.areaDel));
    let done;
    if (b.dataset.areaNew) {
      const r = await nameDialog(`Nuova Area in ${site.name}`, "Nome dell'Area", "");
      done = r && await run(() => api(`api/sites/${site.id}/areas`, {method: "POST", body: {name: r.name}}), "Area aggiunta");
    } else if (b.dataset.siteEdit) {
      const r = await nameDialog("Modifica Struttura", "Nome", site.name, field("Descrizione", `<input name="description" maxlength="200" value="${esc(site.description)}">`));
      done = r && await run(() => api(`api/sites/${site.id}`, {method: "PUT", body: r}), "Struttura salvata");
    } else if (b.dataset.siteDel) {
      const n = site.areas.reduce((k, a) => k + a.controllers.length, 0);
      done = await confirmBox("Elimina Struttura", `Eliminare <b>${esc(site.name)}</b> con le sue aree?${n ? ` ${plural(n, "controller resterà", "controller resteranno")} senza area.` : ""} Sul controller non cambia niente.`, "Elimina", true) &&
        await run(() => api(`api/sites/${site.id}`, {method: "DELETE"}), "Struttura eliminata");
    } else if (b.dataset.areaEdit) {
      const r = await nameDialog("Rinomina Area", "Nome dell'Area", area.name);
      done = r && await run(() => api(`api/areas/${area.id}`, {method: "PUT", body: {name: r.name}}), "Area salvata");
    } else if (b.dataset.areaDel) {
      done = await confirmBox("Elimina Area", `Eliminare l'area <b>${esc(area.name)}</b>?${inside(area)}`, "Elimina", true) &&
        await run(() => api(`api/areas/${area.id}`, {method: "DELETE"}), "Area eliminata");
    }
    if (done) { await loadSummary(); render(); }
  };
}

async function viewUsers(body) {
  let data;
  try { data = await api("api/users"); } catch (err) { body.innerHTML = `<div class="alert err">${esc(err.message)}</div>`; return; }
  const roleLabel = (u) => data.roles[u.role]?.label || "Personalizzato";
  body.innerHTML = `<div class="toolbar"><p class="muted" style="margin:0;flex:1;min-width:240px">Gli utenti sono quelli di Home Assistant: chi apre l'app per la prima volta viene aggiunto con "Solo Stato" e qui gli dai i permessi. Puoi anche aggiungerli prima, con il loro nome utente.</p>
    <button type="button" class="primary" id="u-new">${icon("plus")}Nuovo Utente</button></div>
    <div class="card flush"><div class="list">${data.users.map((u) => `<div class="item">
      <div class="avatar ${u.perms.length ? "" : "off"}">${esc(initials(u.name || u.username))}</div>
      <div class="grow"><div class="title">${esc(u.name || u.username)}${u.username === store.me.username ? ' <span class="muted" style="font-weight:400">· tu</span>' : ""}</div>
        <div class="meta"><code>${esc(u.username)}</code><span class="pill ${u.admin ? "accent" : u.perms.length ? "" : "warn"}">${esc(roleLabel(u))}</span><span>${u.last_seen ? "ultimo accesso " + esc(relTime(u.last_seen)) : "mai entrato"}</span></div></div>
      <div class="row item-actions"><button type="button" class="small" data-u-edit="${esc(u.username)}">${icon("edit")}Permessi</button>
        ${u.username === store.me.username ? "" : `<button type="button" class="small danger" data-u-del="${esc(u.username)}">Elimina</button>`}</div></div>`).join("")}</div></div>`;
  paintIcons(body);
  const form = (u) => `${u ? "" : field("Nome Utente di Home Assistant", `<input name="username" autocomplete="off" placeholder="es. mario">`, "Lo trovi in Impostazioni → Persone → Utenti di Home Assistant.")}
    ${field("Nome", `<input name="name" maxlength="100" value="${esc(u?.name || "")}" placeholder="facoltativo">`)}
    ${field("Ruolo", `<select name="role">${Object.entries(data.roles).map(([k, r]) => `<option value="${k}" ${u?.role === k ? "selected" : ""}>${esc(r.label)}</option>`).join("")}<option value="personalizzato" ${u?.role === "personalizzato" ? "selected" : ""}>Personalizzato</option></select>`)}
    <div class="field"><label>Permessi</label><div class="perm-list">${Object.entries(data.permissions).map(([k, label]) => `<label><input type="checkbox" name="perm" value="${k}" ${(u ? u.perms : data.roles.solo_stato.perms).includes(k) ? "checked" : ""}>${esc(label)}</label>`).join("")}</div>
      <p class="hint">Tutti vedono il cruscotto e lo stato del controller.</p></div>`;
  const bind = (dlg) => {
    const role = $("[name=role]", dlg);
    const boxes = $$("[name=perm]", dlg);
    role.onchange = () => { const r = data.roles[role.value]; if (r) boxes.forEach((b) => { b.checked = r.perms.includes(b.value); }); };
    boxes.forEach((b) => b.onchange = () => {
      const chosen = boxes.filter((x) => x.checked).map((x) => x.value).sort().join(",");
      role.value = Object.entries(data.roles).find(([, r]) => [...r.perms].sort().join(",") === chosen)?.[0] || "personalizzato";
    });
  };
  const save = (u) => async (dlg) => {
    const payload = {username: u ? u.username : val(dlg, "username"), name: val(dlg, "name"), perms: $$("[name=perm]:checked", dlg).map((x) => x.value)};
    return (await run(() => api(u ? `api/users/${encodeURIComponent(u.username)}` : "api/users", {method: u ? "PUT" : "POST", body: payload}), "Utente salvato")) || false;
  };
  $("#u-new").onclick = async () => {
    if (await modal({title: "Nuovo Utente", body: form(null), onOpen: bind, actions: [{label: "Annulla", value: null}, {label: "Aggiungi", kind: "primary", submit: true, onClick: save(null)}]})) render();
  };
  body.onclick = async (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    const u = data.users.find((x) => x.username === (b.dataset.uEdit || b.dataset.uDel));
    if (!u) return;
    if (b.dataset.uEdit) {
      if (await modal({title: "Permessi di " + (u.name || u.username), body: form(u), onOpen: bind, actions: [{label: "Annulla", value: null}, {label: "Salva", kind: "primary", submit: true, onClick: save(u)}]})) {
        if (u.username === store.me.username) location.reload(); else render();
      }
    } else if (await confirmBox("Elimina Utente", `Eliminare <b>${esc(u.name || u.username)}</b>? Se riapre l'app verrà aggiunto di nuovo con "Solo Stato".`, "Elimina", true) &&
        await run(() => api(`api/users/${encodeURIComponent(u.username)}`, {method: "DELETE"}), "Utente eliminato")) render();
  };
}
async function loadAudit(more = false) {
  const params = new URLSearchParams({limit: "50"});
  if (more && auditRows.length) params.set("before_id", auditRows[auditRows.length - 1].id);
  const rows = await api("api/audit?" + params).catch(() => []);
  auditRows = more ? auditRows.concat(rows) : rows;
  const body = $("#audit");
  if (!body) return;
  body.innerHTML = auditRows.length ? auditRows.map((a) => `<tr><td>${esc(fmtDateTime(a.ts))}</td><td>${esc(a.user)}</td><td><b>${esc(a.action)}</b>${a.detail ? `<div class="muted small-text">${esc(a.detail)}</div>` : ""}</td></tr>`).join("") : '<tr><td colspan="3" class="muted">nessuna attività</td></tr>';
  $("#audit-more-box").hidden = rows.length < 50;
}
async function importCsv(e) {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  const text = await file.text();
  const preview = await run(() => api("api/import/persons", {method: "POST", body: {csv: text, apply: false}}));
  if (!preview) return;
  const table = (res) => `<p>${res.riepilogo.righe} righe: <b>${res.riepilogo.ok}</b> ${res.applicato ? "importate" : "da importare"}, <b>${res.riepilogo.aggiornate || 0}</b> ${res.applicato ? "aggiornate" : "da aggiornare"}, ${res.riepilogo.saltate} saltate, ${res.riepilogo.errori} con errori.</p>
    <div class="table-wrap"><table class="table"><thead><tr><th>Riga</th><th>Nome</th><th>Tessera</th><th>Esito</th></tr></thead><tbody>${res.righe.map((r) => `<tr><td>${r.riga}</td><td>${esc(r.nome)}</td><td><code>${esc(r.tessera)}</code></td><td><span class="pill ${r.esito === "errore" ? "err" : r.esito === "saltata" ? "" : r.esito.includes("aggiorn") ? "warn" : "ok"}">${esc(r.esito)}</span> <span class="small-text">${esc(r.dettaglio)}</span></td></tr>`).join("")}</tbody></table></div>`;
  const go = await modal({title: "Anteprima importazione", wide: true, body: table(preview),
    actions: [{label: "Annulla", value: false}, ...(preview.riepilogo.ok || preview.riepilogo.aggiornate ? [{label: [preview.riepilogo.ok ? `Importa ${preview.riepilogo.ok}` : "", preview.riepilogo.aggiornate ? `Aggiorna ${preview.riepilogo.aggiornate}` : ""].filter(Boolean).join(" e "), kind: "primary", value: true}] : [])]});
  if (!go) return;
  const result = await run(() => api("api/import/persons", {method: "POST", body: {csv: text, apply: true}}));
  if (result) await modal({title: "Importazione completata", wide: true, body: table(result), actions: [{label: "Chiudi", kind: "primary", value: true}]});
}

// ---------- Avvio ----------
async function start() {
  paintIcons();
  initNav();
  try {
    store.me = await api("api/me");
  } catch (err) { /* la pagina funziona anche senza */ }
  // Nasconde pagine e pulsanti per cui l'utente non ha il permesso
  ALL_PERMS.forEach((perm) => document.body.classList.toggle("no-" + perm, !can(perm)));
  $$("#nav a").forEach((a) => { a.hidden = !allowedRoute(a.dataset.route); });
  $("#nav-foot").textContent = store.me.user ? [store.me.user, store.me.role].filter(Boolean).join(" · ") : "";
  await loadSummary();
  await render();
  setInterval(loadSummary, 5000);
  setInterval(refreshView, 15000);
}
start();
</script>
