<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Controllo Accessi</title>
<style>
  :root {
    --bg: #f3f5f8; --surface: #ffffff; --surface-2: #f7f8fa; --text: #1b1f24; --muted: #5f6b7a;
    --border: #dde2e8; --border-strong: #c5ccd5;
    --accent: #0b6bcb; --accent-soft: #e3effc; --accent-text: #ffffff;
    --ok: #1a7f37; --ok-soft: #e4f4e8; --warn: #9a6700; --warn-soft: #fbf0d9; --err: #c62828; --err-soft: #fde7e7;
    --info: #6639ba; --info-soft: #efe9fb;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
    --radius: 12px; --nav-w: 232px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --surface: #181c22; --surface-2: #1f242b; --text: #e7eaee; --muted: #9aa5b1;
      --border: #2b323b; --border-strong: #3a434e;
      --accent: #4c9cf0; --accent-soft: #15283d; --accent-text: #0b1118;
      --ok: #4ac26b; --ok-soft: #13291b; --warn: #e3b341; --warn-soft: #2e2511; --err: #ff6b6b; --err-soft: #331617;
      --info: #b093f5; --info-soft: #241c3a;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  svg.icon { width: 20px; height: 20px; fill: currentColor; flex: none; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }

  /* Struttura */
  .app { display: flex; min-height: 100vh; }
  .nav { width: var(--nav-w); flex: none; background: var(--surface); border-right: 1px solid var(--border);
         position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 16px 12px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; font-weight: 700; font-size: 16px; }
  .brand .logo { width: 32px; height: 32px; border-radius: 9px; background: var(--accent); color: var(--accent-text);
                 display: grid; place-items: center; }
  .nav a { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 10px; color: var(--muted);
           font-weight: 500; position: relative; }
  .nav a:hover { background: var(--surface-2); text-decoration: none; color: var(--text); }
  .nav a.active { background: var(--accent-soft); color: var(--accent); }
  .nav .count { margin-left: auto; background: var(--err); color: #fff; border-radius: 10px; font-size: 12px;
                min-width: 20px; padding: 0 6px; text-align: center; line-height: 20px; }
  .nav .foot { margin-top: auto; padding: 8px 12px; color: var(--muted); font-size: 12px; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 12px; padding: 12px 24px; flex-wrap: wrap; }
  .topbar h1 { font-size: 20px; margin: 0; flex: 1; min-width: 120px; }
  .door { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .content { padding: 20px 24px 48px; max-width: 1180px; width: 100%; }

  /* Elementi */
  button, .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--surface);
                 color: var(--text); border: 1px solid var(--border-strong); border-radius: 9px; padding: 7px 14px;
                 font: inherit; font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration: none; }
  button:hover, .btn:hover { background: var(--surface-2); text-decoration: none; }
  button.primary, .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.primary:hover { filter: brightness(1.06); }
  button.danger { color: var(--err); }
  button.danger.primary { background: var(--err); border-color: var(--err); color: #fff; }
  button.ghost { border-color: transparent; background: transparent; }
  button.ghost:hover { background: var(--surface-2); }
  button.small, .btn.small { padding: 4px 10px; font-size: 13px; border-radius: 8px; }
  button.icon-only { padding: 6px; }
  button:disabled { opacity: .5; cursor: default; }
  input, select, textarea { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border-strong);
                            border-radius: 9px; padding: 7px 10px; min-width: 0; }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  textarea { resize: vertical; min-height: 70px; }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); vertical-align: middle; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
          padding: 18px; margin-bottom: 16px; }
  .card > h2, .section-title { font-size: 15px; margin: 0 0 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card > h2 .pill { white-space: normal; }
  .nav .lbl-short { display: none; }
  .card > h2 .spacer, .row .spacer { flex: 1; }
  .card.flush { padding: 0; }
  .card.flush > h2 { padding: 16px 18px 0; }
  .grid { display: grid; gap: 16px; }
  .grid.kpi { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .grid.two { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); align-items: start; }
  .grid.cards { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; align-items: center; }
  .toolbar input[type=search] { flex: 1 1 220px; }
  .muted { color: var(--muted); }
  .small-text { font-size: 13px; }
  .empty { color: var(--muted); padding: 28px 12px; text-align: center; }
  .hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
  .kpi .card { margin: 0; padding: 16px; }
  .kpi .label { color: var(--muted); font-size: 13px; font-weight: 500; }
  .kpi .value { font-size: 28px; font-weight: 700; line-height: 1.2; margin-top: 4px; }
  .kpi .sub { color: var(--muted); font-size: 12px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 13px;
          font-weight: 500; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); white-space: nowrap; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
  .pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  .pill.err { background: var(--err-soft); color: var(--err); border-color: transparent; }
  .pill.info { background: var(--info-soft); color: var(--info); border-color: transparent; }
  .pill.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; display: inline-block; }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.err { background: var(--err); }
  .door-pill { font-size: 14px; padding: 5px 12px; white-space: normal; max-width: 100%; }
  .alert { display: flex; gap: 12px; align-items: flex-start; border-radius: var(--radius); padding: 12px 16px; margin-bottom: 12px;
           background: var(--warn-soft); color: var(--text); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); }
  .alert.err { background: var(--err-soft); border-color: color-mix(in srgb, var(--err) 30%, transparent); }
  .alert.info { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
  .alert b { display: block; }
  .alert .grow { flex: 1; }
  dl.props { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 0; }
  dl.props dt { color: var(--muted); }
  dl.props dd { margin: 0; overflow-wrap: anywhere; }
  .list > .item { display: flex; gap: 12px; align-items: center; padding: 12px 18px; border-top: 1px solid var(--border); }
  .list > .item:first-child { border-top: none; }
  .list > .item.click { cursor: pointer; }
  .list > .item.click:hover { background: var(--surface-2); }
  .item .grow { flex: 1; min-width: 0; }
  .item .title { font-weight: 600; overflow-wrap: anywhere; }
  .item .meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .item .side { text-align: right; color: var(--muted); font-size: 13px; flex: none; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); flex: none;
            display: grid; place-items: center; font-weight: 700; font-size: 14px; }
  .avatar.big { width: 52px; height: 52px; font-size: 18px; }
  .avatar.off { background: var(--surface-2); color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; background: var(--surface-2); border: 1px solid var(--border);
          border-radius: 7px; padding: 1px 8px; font-size: 13px; }
  .chip.off { text-decoration: line-through; color: var(--muted); }
  .chip svg.icon { width: 14px; height: 14px; }
  .ev-icon { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; font-size: 16px; }
  .ev-icon svg { width: 18px; height: 18px; fill: currentColor; }
  .k-ok { background: var(--ok-soft); color: var(--ok); }
  .k-warn { background: var(--warn-soft); color: var(--warn); }
  .k-err { background: var(--err-soft); color: var(--err); }
  .k-info { background: var(--info-soft); color: var(--info); }
  .k-accent { background: var(--accent-soft); color: var(--accent); }
  .k-muted { background: var(--surface-2); color: var(--muted); }
  .thumb { width: 64px; height: 48px; border-radius: 8px; object-fit: cover; cursor: zoom-in; border: 1px solid var(--border);
           flex: none; background: var(--surface-2); }
  .segmented { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 3px; gap: 2px; margin-bottom: 16px;
               max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .segmented a { padding: 6px 14px; border-radius: 8px; color: var(--muted); font-weight: 500; white-space: nowrap; }
  .segmented a:hover { text-decoration: none; color: var(--text); }
  .segmented a.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  table.table { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.table th, table.table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.table th { color: var(--muted); font-weight: 500; font-size: 13px; }
  table.table td code { word-break: break-all; }
  .table-wrap { overflow-x: auto; }

  /* Grafico settimanale */
  .chart { display: flex; align-items: flex-end; gap: 10px; height: 160px; padding-top: 8px; }
  .chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; min-width: 0; }
  .chart .bars { flex: 1; width: 100%; max-width: 44px; display: flex; flex-direction: column-reverse; border-radius: 6px; overflow: hidden;
                 background: var(--surface-2); }
  .chart .bar.g { background: var(--ok); } .chart .bar.d { background: var(--warn); } .chart .bar.u { background: var(--err); }
  .chart .lbl { font-size: 12px; color: var(--muted); }
  .chart .num { font-size: 12px; font-weight: 600; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 10px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

  /* Anteprima fascia oraria */
  .week { display: grid; grid-template-columns: 34px 1fr; gap: 3px 8px; font-size: 12px; color: var(--muted); align-items: center; }
  .week .track { position: relative; height: 12px; background: var(--surface-2); border-radius: 4px; border: 1px solid var(--border); }
  .week .seg { position: absolute; top: 0; bottom: 0; background: var(--accent); border-radius: 3px; }
  .week .axis { display: flex; justify-content: space-between; font-size: 11px; }
  .days { display: inline-flex; gap: 3px; }
  .days button { width: 32px; height: 32px; padding: 0; border-radius: 8px; font-size: 13px; }
  .days button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .rule-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px; border: 1px solid var(--border);
              border-radius: 10px; margin-bottom: 8px; background: var(--surface-2); }
  .field .rule-row input[type=time] { width: 116px; }

  /* Finestre */
  dialog { border: 1px solid var(--border); border-radius: 16px; background: var(--surface); color: var(--text); padding: 0;
           width: min(520px, calc(100vw - 24px)); max-height: calc(100vh - 32px); box-shadow: 0 20px 50px rgba(0, 0, 0, .3); }
  dialog.wide { width: min(780px, calc(100vw - 24px)); }
  dialog::backdrop { background: rgba(10, 14, 20, .5); }
  .dlg { display: flex; flex-direction: column; max-height: calc(100vh - 34px); }
  .dlg-head { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .dlg-head h2 { font-size: 17px; margin: 0; flex: 1; }
  .dlg-body { padding: 18px 20px; overflow-y: auto; }
  .dlg-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .field { margin-bottom: 14px; }
  .field > label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 13px; font-weight: 500; }
  .field input:not([type=checkbox]), .field select, .field textarea { width: 100%; }
  .field.inline { display: flex; align-items: center; gap: 8px; }
  .field.inline > label { margin: 0; color: var(--text); font-size: 14px; }
  .fields-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; margin: -6px 0 12px; }
  dialog.sheet { margin: 0 0 0 auto; height: 100vh; max-height: 100vh; width: min(560px, 100vw); max-width: 100vw; border-radius: 0;
                 border-width: 0 0 0 1px; }
  dialog.sheet .dlg { max-height: 100vh; height: 100%; }
  dialog.sheet .dlg-body { flex: 1; background: var(--bg); }
  dialog.image { width: auto; max-width: calc(100vw - 24px); }
  dialog.image img { display: block; max-width: calc(100vw - 26px); max-height: calc(100vh - 120px); }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: calc(100vw - 32px); z-index: 50;
           background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 10px; display: none;
           box-shadow: 0 8px 24px rgba(0, 0, 0, .25); font-weight: 500; }
  #toast.error { background: var(--err); color: #fff; }
  .spinner { width: 18px; height: 18px; border: 2px solid var(--border-strong); border-top-color: var(--accent); border-radius: 50%;
             animation: spin .8s linear infinite; display: inline-block; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading { padding: 40px; text-align: center; color: var(--muted); }
  /* Pulsanti e sezioni visibili solo con il permesso giusto */
  body.no-persone_modifica .w-persone, body.no-regole_modifica .w-regole, body.no-import_export .w-io,
  body.no-utenti .w-admin { display: none !important; }
  .swatch { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex: none; background: var(--muted); }
  .c-blue { --c: #2f7de1; } .c-green { --c: #2ea44f; } .c-orange { --c: #e8871e; } .c-red { --c: #d93f3f; }
  .c-purple { --c: #8a5cd6; } .c-teal { --c: #1f9e9e; } .c-pink { --c: #d6519b; } .c-gray { --c: #7d8894; }
  .swatch[class*="c-"] { background: var(--c); }
  .pill.cat { background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--c); border-color: transparent; }
  .colors { display: flex; gap: 8px; flex-wrap: wrap; }
  .colors label { cursor: pointer; }
  .colors input { position: absolute; opacity: 0; pointer-events: none; }
  .colors .swatch { width: 28px; height: 28px; border: 3px solid transparent; }
  .colors input:checked + .swatch { border-color: var(--text); }
  .colors input:focus-visible + .swatch { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card.is-hidden { opacity: .6; border-style: dashed; }
  .perm-list { display: grid; gap: 8px; margin-top: 4px; }
  .perm-list label { display: flex; gap: 10px; align-items: flex-start; color: var(--text); font-size: 14px; }
  .perm-list input { margin-top: 2px; }

  @media (max-width: 1000px) {
    .grid.kpi { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid.two { grid-template-columns: 1fr; }
  }
  @media (max-width: 860px) {
    .nav { position: fixed; bottom: 0; left: 0; right: 0; top: auto; height: auto; width: 100%; z-index: 20;
           flex-direction: row; padding: 4px 4px calc(4px + env(safe-area-inset-bottom)); border-right: none;
           border-top: 1px solid var(--border); justify-content: space-around; }
    .brand, .nav .foot { display: none; }
    .nav a { flex-direction: column; gap: 2px; padding: 6px 2px; font-size: 10.5px; flex: 1; min-width: 0; text-align: center; border-radius: 8px; }
    .nav a span.lbl, .nav a span.lbl-short { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .nav .count { position: absolute; top: 2px; left: 55%; margin: 0; font-size: 10px; min-width: 16px; line-height: 16px; padding: 0 4px; }
    .topbar { padding: 10px 14px; }
    .topbar h1 { font-size: 18px; }
    .content { padding: 14px 12px calc(90px + env(safe-area-inset-bottom)); }
    .card { padding: 14px; }
    .list > .item { padding: 12px 14px; }
    .item .side { display: none; }
    .list > .item { flex-wrap: wrap; }
    .item .item-actions { flex-basis: 100%; margin-left: 46px; }
    .topbar { position: static; }
    .toolbar input[type=date], .toolbar select { flex: 1 1 40%; }
    .fields-2 { grid-template-columns: 1fr; }
    dialog { width: calc(100vw - 16px); }
  }
  @media (max-width: 480px) {
    .nav a span.lbl { display: none; }
    .nav a span.lbl-short { display: block; }
    .topbar h1 { display: none; }
    .door { width: 100%; }
    .door .door-pill { flex: 1; justify-content: center; }
    .kpi .value { font-size: 24px; }
  }
</style>
</head>
<body>
<div class="app">
  <nav class="nav" id="nav">
    <div class="brand"><span class="logo" data-icon="door"></span>Controllo Accessi</div>
    <a href="#cruscotto" data-route="cruscotto"><span data-icon="dashboard"></span><span class="lbl">Cruscotto</span><span class="lbl-short">Home</span></a>
    <a href="#persone" data-route="persone"><span data-icon="people"></span><span class="lbl">Persone</span><span class="lbl-short">Persone</span></a>
    <a href="#da-registrare" data-route="da-registrare"><span data-icon="cardplus"></span><span class="lbl">Da Registrare</span><span class="lbl-short">Nuove</span><span class="count" id="nav-unknown" hidden></span></a>
    <a href="#registro" data-route="registro"><span data-icon="list"></span><span class="lbl">Registro</span><span class="lbl-short">Registro</span></a>
    <a href="#regole" data-route="regole"><span data-icon="clock"></span><span class="lbl">Regole</span><span class="lbl-short">Regole</span></a>
    <a href="#impianti" data-route="impianti"><span data-icon="building"></span><span class="lbl">Impianti</span><span class="lbl-short">Impianti</span></a>
    <a href="#impostazioni" data-route="impostazioni"><span data-icon="cog"></span><span class="lbl">Impostazioni</span><span class="lbl-short">Opzioni</span></a>
    <div class="foot" id="nav-foot"></div>
  </nav>
  <div class="main">
    <header class="topbar">
      <h1 id="page-title">Cruscotto</h1>
      <div class="door">
        <span class="pill door-pill" id="door-pill"><span class="dot" id="door-dot"></span><span id="door-text">Porta …</span></span>
      </div>
    </header>
    <div class="content" id="view"><div class="loading"><span class="spinner"></span></div></div>
  </div>
</div>

<dialog id="sheet" class="sheet"></dialog>
<dialog id="modal"></dialog>
<div id="toast" role="status"></div>

<script>
"use strict";
// Percorsi relativi: con Ingress la pagina è servita sotto un prefisso variabile

// ---------- Utilità ----------
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const pad = (n) => String(n).padStart(2, "0");

const fmtDateTime = (iso) => iso ? new Date(iso).toLocaleString("it-IT", {dateStyle: "short", timeStyle: "short"}) : "";
const fmtFull = (iso) => iso ? new Date(iso).toLocaleString("it-IT", {dateStyle: "medium", timeStyle: "medium"}) : "";
const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString("it-IT", {day: "numeric", month: "short", year: "numeric"}) : "";
const fmtTime = (iso) => iso ? new Date(iso).toLocaleTimeString("it-IT", {hour: "2-digit", minute: "2-digit"}) : "";
function relTime(iso) {
  if (!iso) return "";
  const d = new Date(iso), now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return "adesso";
  if (diff < 3600) return `${Math.floor(diff / 60)} min fa`;
  const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (d >= startToday) return `oggi ${fmtTime(iso)}`;
  if (d >= new Date(startToday - 86400000)) return `ieri ${fmtTime(iso)}`;
  if (diff < 6 * 86400) return d.toLocaleDateString("it-IT", {weekday: "long"}) + " " + fmtTime(iso);
  return fmtDate(iso);
}
// Valori per <input type=datetime-local> e ritorno in UTC
function toLocalInput(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
const fromLocalInput = (v) => v ? new Date(v).toISOString() : "";

let toastTimer;
function toast(message, error = false) {
  const el = $("#toast");
  el.textContent = message;
  el.className = error ? "error" : "";
  el.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.display = "none"; }, error ? 7000 : 3000);
}

async function api(path, options = {}) {
  const res = await fetch(path, {
    method: options.method || "GET",
    headers: options.body !== undefined ? {"Content-Type": "application/json"} : {},
    body: options.body !== undefined ? JSON.stringify(options.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : "errore " + res.status);
  return data;
}

async function run(action, success) {
  try {
    const result = await action();
    if (success) toast(success);
    return result ?? true;
  } catch (err) {
    toast(err.message, true);
    return undefined;
  }
}

// Apre una finestra: body è HTML, actions [{label, kind, onClick(dialogEl) → false per lasciarla aperta}]
function modal({title, body = "", actions = [], wide = false, cls = "", onOpen}) {
  return new Promise((resolve) => {
    const dlg = $("#modal");
    dlg.className = (wide ? "wide " : "") + cls;
    dlg.innerHTML = `<form class="dlg" method="dialog">
      <div class="dlg-head"><h2>${esc(title)}</h2><button type="button" class="ghost icon-only" data-x aria-label="Chiudi">${icon("close")}</button></div>
      <div class="dlg-body">${body}</div>
      ${actions.length ? `<div class="dlg-foot">${actions.map((a, i) => `<button type="${a.submit ? "submit" : "button"}" class="${a.kind || ""}" data-a="${i}">${esc(a.label)}</button>`).join("")}</div>` : ""}
    </form>`;
    let done = false;
    const finish = (value) => { if (done) return; done = true; dlg.close(); resolve(value); };
    $("[data-x]", dlg).onclick = () => finish(null);
    dlg.oncancel = (e) => { e.preventDefault(); finish(null); };
    const invoke = async (i) => {
      const action = actions[i];
      if (!action.onClick) return finish("value" in action ? action.value : i);
      const btns = $$(".dlg-foot button", dlg);
      btns.forEach((b) => { b.disabled = true; });
      try {
        const result = await action.onClick(dlg);
        if (result !== false) finish(result ?? true);
      } finally {
        btns.forEach((b) => { b.disabled = false; });
      }
    };
    $$(".dlg-foot button", dlg).forEach((b) => { if (!actions[b.dataset.a].submit) b.onclick = () => invoke(Number(b.dataset.a)); });
    $("form", dlg).onsubmit = (e) => {
      e.preventDefault();
      const i = actions.findIndex((a) => a.submit);
      if (i >= 0) invoke(i);
    };
    dlg.showModal();
    if (onOpen) onOpen(dlg);
    const first = $(".dlg-body input:not([type=checkbox]), .dlg-body select, .dlg-body textarea", dlg);
    if (first && !("ontouchstart" in window)) first.focus();
  });
}

// La tipologia scelta nel modulo propone il suo gruppo e la sua durata
function bindCategory(dlg) {
  const select = $("[name=category]", dlg);
  if (!select) return;
  select.addEventListener("change", () => {
    const c = categoryOf(Number(select.value));
    if (!c) return;
    if (c.group_token && $("[name=group]", dlg)) {
      const group = $("[name=group]", dlg);
      if (![...group.options].some((o) => o.value === c.group_token)) group.insertAdjacentHTML("beforeend", `<option value="${esc(c.group_token)}">${esc(groupName(c.group_token))}</option>`);
      group.value = c.group_token;
    }
    if (c.valid_days && $("#f-limited", dlg)) {
      $("#f-limited", dlg).checked = true;
      $("#f-validity", dlg).hidden = false;
      const now = new Date();
      now.setSeconds(0, 0);
      $("[name=valid_from]", dlg).value = toLocalInput(now.toISOString());
      $("[name=valid_to]", dlg).value = toLocalInput(new Date(now.getTime() + c.valid_days * 86400000).toISOString());
    }
  });
}
function personAccess(p) {
  const c = p.cards[0] || {};
  return {group: c.access_profile || "", from: c.valid_from || "", to: c.valid_to || ""};
}
// Stato di validità: "" (valida), futura, scaduta, in_scadenza
function validityState(from, to) {
  const now = Date.now();
  if (from && new Date(from).getTime() > now) return "futura";
  if (to) {
    const end = new Date(to).getTime();
    if (end <= now) return "scaduta";
    if (end - now < 7 * 86400000) return "in_scadenza";
  }
  return "";
}
function validityText(from, to) {
  if (!from && !to) return "sempre valida";
  if (from && to) return `dal ${fmtDateTime(from)} al ${fmtDateTime(to)}`;
  return from ? `dal ${fmtDateTime(from)}` : `fino al ${fmtDateTime(to)}`;
}

  futura: '<span class="pill info">Non Ancora Valida</span>',

let route = {name: "cruscotto", sub: ""};
function parseHash() {
  const [name, sub = ""] = location.hash.replace(/^#/, "").split("/");
  return ROUTES[name] && (!ROUTES[name][2] || can(ROUTES[name][2])) ? {name, sub} : {name: "cruscotto", sub: ""};
}
async function render() {
  route = parseHash();
  if ($("#sheet").open && !(route.name === "persone" && route.sub)) $("#sheet").close();
  const [title, view] = ROUTES[route.name];
  $("#page-title").textContent = title;
  document.title = `${title} · Controllo Accessi`;
  $$("#nav a").forEach((a) => a.classList.toggle("active", a.dataset.route === route.name));
  const el = $("#view");
  el.dataset.route = route.name;
  await view(el, route.sub);
  paintIcons(el);
}
window.addEventListener("hashchange", () => { $("#view").innerHTML = '<div class="loading"><span class="spinner"></span></div>'; render(); });
// Aggiorna la vista corrente senza ricaricarla da zero, se non c'è una finestra aperta
async function refreshView() {
  if ($("#modal").open || $("#sheet").open) return;
  if (["cruscotto", "da-registrare"].includes(route.name)) await render();
  if (route.name === "registro") await refreshLog();

function eventItem(e, {showSnapshot = true} = {}) {
  const [label, cls, ic] = KINDS[e.kind] || [e.kind, "k-muted", "list"];
  const source = ["apertura_remota", "citofono"].includes(e.kind) && e.source ? `da ${esc(e.source)}` : "";
  return `<div class="item">
    <div class="ev-icon ${cls}">${icon(ic)}</div>
    <div class="grow">
      <div class="title">${esc(label)}${e.person_name ? ` · ${esc(e.person_name)}` : ""}</div>
      <div class="meta"><span title="${esc(fmtFull(e.ts))}">${esc(relTime(e.ts))}</span>
        ${e.card ? `<code>${esc(e.card)}</code>` : ""}${e.detail ? `<span>${esc(e.detail)}</span>` : ""}${source ? `<span>${source}</span>` : ""}</div>
    </div>
    ${showSnapshot && e.snapshot ? `<img class="thumb" loading="lazy" src="api/events/${e.id}/snapshot" alt="istantanea" data-snap="${e.id}" data-title="${esc(label + " · " + fmtFull(e.ts))}">` : ""}
    <div class="side">${esc(fmtDateTime(e.ts))}</div>
  </div>`;
}

async function viewDashboard(el) {
  let d;
  try { d = await api("api/dashboard"); } catch (err) { el.innerHTML = `<div class="alert err">${esc(err.message)}</div>`; return; }
  const t = d.today;
  const alerts = [];
  if (store.summary.configured === false) alerts.push(`<div class="alert info">${icon("cog")}<div class="grow"><b>Impianto da Configurare</b>${can("impianti") ? "Aggiungi il controller e le porte nella pagina Impianti." : "Chiedi a un amministratore di configurare il controller."}</div>${can("impianti") ? '<a class="btn small primary" href="#impianti">Impianti</a>' : ""}</div>`);
  if (d.unknown_cards && can("persone")) alerts.push(`<div class="alert info">${icon("cardplus")}<div class="grow"><b>${plural(d.unknown_cards, "tessera da registrare", "tessere da registrare")}</b>
    Sono state passate sul lettore ma non appartengono a nessuno.</div><a class="btn small" href="#da-registrare">Registra</a></div>`);
  if (d.expiring.length) alerts.push(`<div class="alert">${icon("clock")}<div class="grow"><b>Tessere in Scadenza nei Prossimi 7 Giorni</b>
    ${d.expiring.map((e) => `<a href="#persone/${e.id}">${esc(e.name)}</a> (${esc(fmtDateTime(e.valid_to))})`).join(", ")}</div></div>`);
  if (store.summary.mqtt_connected === false && store.summary.configured !== false) alerts.push(`<div class="alert err">${icon("alert")}<div class="grow"><b>Eventi Non in Arrivo</b>
    Il collegamento MQTT non è attivo: registro e stato porta non si aggiornano.</div><a class="btn small" href="#impostazioni">Dettagli</a></div>`);
  if (t.alarms) alerts.push(`<div class="alert err">${icon("alert")}<div class="grow"><b>${plural(t.alarms, "allarme", "allarmi")} oggi</b>Porta forzata, aperta troppo a lungo o manomissione.</div>${can("registro") ? '<a class="btn small" href="#registro">Vedi</a>' : ""}</div>`);
  const max = Math.max(1, ...d.week.map((w) => w.granted + w.denied + w.unknown));
  const chart = d.week.map((w) => {
    const total = w.granted + w.denied + w.unknown;
    const h = (n) => `${(n / max) * 100}%`;
    const label = new Date(w.day + "T12:00:00").toLocaleDateString("it-IT", {weekday: "short"});
    return `<div class="col" title="${esc(fmtDate(w.day + "T12:00:00"))}: ${w.granted} concessi, ${w.denied} negati, ${w.unknown} sconosciute">
      <div class="num">${total || ""}</div>
      <div class="bars"><div class="bar g" style="height:${h(w.granted)}"></div><div class="bar d" style="height:${h(w.denied)}"></div><div class="bar u" style="height:${h(w.unknown)}"></div></div>
      <div class="lbl">${esc(label)}</div></div>`;
  }).join("");
  el.innerHTML = `
    ${alerts.join("")}
    <div class="grid kpi" style="margin-bottom:16px">
      <div class="card"><div class="label">Accessi Oggi</div><div class="value">${t.granted + t.remote}</div><div class="sub">${t.remote ? `di cui ${t.remote} aperture remote` : "con tessera"}${!t.granted && t.reads ? ` · ${t.reads} letture` : ""}</div></div>
      <div class="card"><div class="label">Negati Oggi</div><div class="value" style="color:${t.denied + t.unknown ? "var(--warn)" : "inherit"}">${t.denied + t.unknown}</div><div class="sub">${t.unknown} tessere sconosciute</div></div>
      <div class="card"><div class="label">Persone</div><div class="value">${d.persons}</div><div class="sub">${can("persone") ? '<a href="#persone">anagrafica</a>' : "registrate"}</div></div>
      <div class="card"><div class="label">Tessere</div><div class="value">${d.cards}</div><div class="sub">${d.cards_suspended ? `${d.cards_suspended} sospese` : "tutte attive"}</div></div>
    </div>
    <div class="grid two">
      <div class="card"><h2>Ultimi 7 Giorni</h2><div class="chart">${chart}</div>
        <div class="legend"><span><i style="background:var(--ok)"></i>concessi</span><span><i style="background:var(--warn)"></i>negati</span><span><i style="background:var(--err)"></i>tessere sconosciute</span></div></div>
      ${can("registro") ? `<div class="card flush"><h2>Ultimi Eventi<span class="spacer"></span><a class="small-text" href="#registro">Registro Completo</a></h2>
        <div class="list" style="margin-top:8px">${d.recent.length ? d.recent.map((e) => eventItem(e, {showSnapshot: false})).join("") : '<div class="empty">nessun evento registrato</div>'}</div></div>` : `<div class="card"><h2>Ultimi Eventi</h2><p class="muted" style="margin:0">Il tuo utente non ha il permesso di vedere il registro accessi.</p></div>`}
    </div>`;
}

// ---------- Persone ----------
const personFilters = {q: "", group: "", state: "", category: ""};
async function loadPersons() {
  store.persons = await api("api/persons");
  return store.persons;
}
async function viewPersons(el, sub) {
  try { await Promise.all([loadPersons(), loadGroups()]); } catch (err) { el.innerHTML = `<div class="alert err">${esc(err.message)}</div>`; return; }
  const groupOptions = (store.groups || []).filter((g) => !g.hidden || store.persons.some((p) => personAccess(p).group === g.token)).map((g) => `<option value="${esc(g.token)}">${esc(g.name)}</option>`).join("");
  const categoryOptions = store.categories.map((c) => `<option value="${c.id}">${esc(c.name)}</option>`).join("");
  el.innerHTML = `
    <div class="toolbar">
      <input type="search" id="p-q" placeholder="Cerca nome, ditta o numero tessera" value="${esc(personFilters.q)}">
      ${store.categories.length ? `<select id="p-cat"><option value="">Tutte le Tipologie</option>${categoryOptions}<option value="0">Senza Tipologia</option></select>` : ""}
      <select id="p-group"><option value="">Tutti i Gruppi</option>${groupOptions}</select>
      <select id="p-state">
        <option value="">Tutte le Persone</option><option value="attive">Con Tessere Attive</option><option value="sospese">Con Tessere Sospese</option>
        <option value="in_scadenza">In Scadenza</option><option value="scaduta">Scadute</option><option value="futura">Non Ancora Valide</option>
      </select>
      <button type="button" class="primary w-persone" id="p-new">${icon("plus")}Nuova Persona</button>
    </div>
    <div class="card flush"><h2 style="padding-bottom:12px"><span id="p-count" class="muted small-text"></span><span class="spacer"></span>
      <button type="button" class="small ghost w-persone" id="p-sync" title="Rilegge tessere e utenti dal controller">${icon("refresh")}Rileggi dal Controller</button></h2>
      <div class="list" id="p-list"></div></div>`;
  $("#p-group").value = personFilters.group;
  if ($("#p-cat")) {
    $("#p-cat").value = personFilters.category;
    $("#p-cat").addEventListener("change", (e) => { personFilters.category = e.target.value; renderPersonList(); });
  }
  $("#p-state").value = personFilters.state;
  $("#p-q").addEventListener("input", (e) => { personFilters.q = e.target.value; renderPersonList(); });
  $("#p-group").addEventListener("change", (e) => { personFilters.group = e.target.value; renderPersonList(); });
  $("#p-state").addEventListener("change", (e) => { personFilters.state = e.target.value; renderPersonList(); });
  $("#p-new").addEventListener("click", () => newPerson());
  $("#p-sync").addEventListener("click", async (e) => {
    e.target.disabled = true;
    const r = await run(() => api("api/sync", {method: "POST"}));
    e.target.disabled = false;
    if (r) { toast(`Riletto dal controller: ${r.cards} tessere (${r.added} nuove, ${r.removed} rimosse)`); await loadPersons(); renderPersonList(); }
  });
  $("#p-list").addEventListener("click", (e) => {
    const item = e.target.closest("[data-person]");
    if (!item) return;
    history.pushState(null, "", `#persone/${item.dataset.person}`);
    openPerson(Number(item.dataset.person));
  });
  renderPersonList();
  if (sub) openPerson(Number(sub));
}
function renderPersonList() {
  const list = $("#p-list");
  if (!list) return;
  const q = personFilters.q.trim().toLowerCase();
  const rows = store.persons.filter((p) => {
    const a = personAccess(p);
    if (q && !(p.name.toLowerCase().includes(q) || (p.company || "").toLowerCase().includes(q) || p.cards.some((c) => c.number.toLowerCase().includes(q)))) return false;
    if (personFilters.group && a.group !== personFilters.group) return false;
    if (personFilters.category !== "" && (p.category_id || 0) !== Number(personFilters.category)) return false;
    const st = personFilters.state;
    if (st === "attive" && !p.cards.some((c) => c.enabled)) return false;
    if (st === "sospese" && !p.cards.some((c) => !c.enabled)) return false;
    if (["in_scadenza", "scaduta", "futura"].includes(st) && validityState(a.from, a.to) !== st) return false;
    return true;
  });
  const cards = store.persons.reduce((n, p) => n + p.cards.length, 0);
  $("#p-count").textContent = `${plural(store.persons.length, "persona", "persone")} · ${plural(cards, "tessera", "tessere")}` + (rows.length !== store.persons.length ? ` · ${rows.length} mostrate` : "");
  list.innerHTML = rows.length ? rows.map((p) => {
    const a = personAccess(p);
    const active = p.cards.some((c) => c.enabled);
    const vs = validityState(a.from, a.to);
    return `<div class="item click" data-person="${p.id}">
      <div class="avatar ${active && vs !== "scaduta" ? "" : "off"}">${esc(initials(p.name))}</div>
      <div class="grow">
        <div class="title">${esc(p.name)}${p.company ? ` <span class="muted" style="font-weight:400">· ${esc(p.company)}</span>` : ""}</div>
        <div class="meta">
          ${categoryPill(categoryOf(p.category_id))}
          <span class="pill accent">${esc(groupName(a.group))}</span>
          ${VALIDITY_PILL[vs] || ""}
          ${p.cards.map((c) => `<span class="chip ${c.enabled ? "" : "off"}" title="${c.enabled ? "attiva" : "sospesa"}">${icon("card", "icon")} <code>${esc(c.number)}</code></span>`).join("")}
        </div>
      </div>
      <div class="side">${p.last_access ? `ultimo accesso<br>${esc(relTime(p.last_access))}` : "mai entrato"}</div>
    </div>`;
  }).join("") : `<div class="empty">${store.persons.length ? "nessuna persona corrisponde ai filtri" : "nessuna persona registrata: passa una tessera sul lettore e registrala da \"Da registrare\""}</div>`;
}

function groupSelect(selected, name = "group") {
  const groups = store.groups || [];
  // I gruppi nascosti compaiono solo se sono già quelli della persona
  const options = groups.filter((g) => !g.hidden || g.token === selected).map((g) => `<option value="${esc(g.token)}" ${g.token === selected ? "selected" : ""}>${esc(g.name)}${g.schedule_names.length && g.schedule_names.join(", ") !== g.name ? " · " + esc(g.schedule_names.join(", ")) : ""}${g.default ? " (Predefinito)" : ""}</option>`).join("");
  const missing = selected && !groups.some((g) => g.token === selected) ? `<option value="${esc(selected)}" selected>${esc(selected)}</option>` : "";
  return `<select name="${name}">${groups.length ? "" : `<option value="">Gruppo Predefinito</option>`}${missing}${options}</select>`;
}
function validityFields(from = "", to = "") {
  const limited = Boolean(from || to);
  return `<div class="field inline"><input type="checkbox" name="limited" id="f-limited" ${limited ? "checked" : ""}><label for="f-limited">Validità Limitata (ospiti, imprese, temporanei)</label></div>
    <div id="f-validity" ${limited ? "" : "hidden"}>
      <div class="fields-2">${field("Valida dal", `<input type="datetime-local" name="valid_from" value="${esc(toLocalInput(from))}">`)}
      ${field("Valida fino al", `<input type="datetime-local" name="valid_to" value="${esc(toLocalInput(to))}">`)}</div>
      <div class="presets"><span class="muted small-text">Da adesso:</span>
        <button type="button" class="small" data-preset="1">1 Giorno</button><button type="button" class="small" data-preset="7">1 Settimana</button>
        <button type="button" class="small" data-preset="30">1 Mese</button><button type="button" class="small" data-preset="365">1 Anno</button></div>
    </div>`;
}
function bindValidity(dlg) {
  const box = $("#f-validity", dlg);
  if (!box) return;
  $("#f-limited", dlg).addEventListener("change", (e) => { box.hidden = !e.target.checked; });
  $$("[data-preset]", dlg).forEach((b) => b.addEventListener("click", () => {
    const now = new Date();
    now.setSeconds(0, 0);
    const end = new Date(now.getTime() + Number(b.dataset.preset) * 86400000);
    $("[name=valid_from]", dlg).value = toLocalInput(now.toISOString());
    $("[name=valid_to]", dlg).value = toLocalInput(end.toISOString());
  }));
}
function readValidity(dlg) {
  if (!val(dlg, "limited")) return {valid_from: "", valid_to: ""};
  return {valid_from: fromLocalInput(val(dlg, "valid_from")), valid_to: fromLocalInput(val(dlg, "valid_to"))};
}

async function newPerson(card = "") {
  await loadGroups();
  const created = await modal({
    title: "Nuova Persona",
    body: `${field("Nome e Cognome", `<input name="name" autocomplete="off" maxlength="100" required>`)}
      ${field("Ditta o Reparto", `<input name="company" autocomplete="off" maxlength="100" placeholder="facoltativo">`)}
      ${field("Numero Tessera", `<input name="card" class="mono" autocomplete="off" value="${esc(card)}" placeholder="es. 04A1B2C3D4E5F6">`, card ? "" : "Più comodo: passa la tessera sul lettore e registrala da \"Da Registrare\".")}
      ${store.categories.length ? field("Tipologia", categorySelect(), "La tipologia imposta da sola gruppo e durata: puoi comunque cambiarli qui sotto.") : ""}
      ${field("Gruppo", groupSelect(store.me.default_group), "Il gruppo decide in quali orari la tessera apre la porta.")}
      ${validityFields()}
      ${field("Note", `<textarea name="notes" maxlength="1000" placeholder="facoltative"></textarea>`)}`,
    actions: [{label: "Annulla", value: null}, {label: "Registra", kind: "primary", submit: true, onClick: async (dlg) => {
      const body = {name: val(dlg, "name"), card: val(dlg, "card"), company: val(dlg, "company"), notes: val(dlg, "notes"), group: val(dlg, "group"), category_id: Number(val(dlg, "category") || 0), ...readValidity(dlg)};
      if (!body.name || !body.card) { toast("Servono nome e numero tessera", true); return false; }
      const person = await run(() => api("api/persons", {method: "POST", body}), "Persona registrata: la tessera è attiva sul controller");
      return person || false;
    }}],
    onOpen: (dlg) => { bindValidity(dlg); bindCategory(dlg); },
  });
  if (created) {
    loadSummary();
    if (route.name === "persone") { await loadPersons(); renderPersonList(); } else await render();
  }
  return created;
}

// Scheda persona
async function openPerson(id) {
  const sheet = $("#sheet");
  let p;
  try { p = await api(`api/persons/${id}`); } catch (err) { toast(err.message, true); location.hash = "#persone"; return; }
  await loadGroups();
  const a = personAccess(p);
  const vs = validityState(a.from, a.to);
  const group = (store.groups || []).find((g) => g.token === a.group);
  sheet.innerHTML = `<div class="dlg">
    <div class="dlg-head"><div class="avatar big">${esc(initials(p.name))}</div>
      <div style="flex:1;min-width:0"><h2 style="margin:0">${esc(p.name)}</h2><div class="muted small-text">${esc(p.company || "")}${p.company ? " · " : ""}${p.last_access ? "ultimo accesso " + esc(relTime(p.last_access)) : "nessun accesso registrato"}</div></div>
      <button type="button" class="ghost icon-only" data-close aria-label="Chiudi">${icon("close")}</button></div>
    <div class="dlg-body" tabindex="-1" autofocus>
      <div class="card"><h2>Accesso<span class="spacer"></span><button type="button" class="small w-persone" data-edit-access>${icon("edit")}Modifica</button></h2>
        <dl class="props">
          <dt>Tipologia</dt><dd>${categoryPill(categoryOf(p.category_id)) || '<span class="muted">Nessuna</span>'}</dd>
          <dt>Gruppo</dt><dd><span class="pill accent">${esc(groupName(a.group))}</span>${group && group.schedule_names.length && group.schedule_names.join(", ") !== group.name ? `<div class="muted small-text" style="margin-top:4px">${esc(group.schedule_names.join(", "))}</div>` : ""}</dd>
          <dt>Validità</dt><dd>${esc(validityText(a.from, a.to))} ${VALIDITY_PILL[vs] || ""}</dd>
        </dl></div>
      <div class="card flush"><h2>Tessere<span class="spacer"></span><button type="button" class="small w-persone" data-add-card>${icon("plus")}Aggiungi</button></h2>
        <div class="list" style="margin-top:6px">${p.cards.map((c) => `<div class="item">
          <div class="ev-icon ${c.enabled ? "k-accent" : "k-muted"}">${icon("card")}</div>
          <div class="grow"><div class="title mono">${esc(c.number)}</div><div class="meta">${c.enabled ? '<span class="pill ok">Attiva</span>' : '<span class="pill">Sospesa</span>'}<span>registrata ${esc(fmtDate(c.created_at))}</span></div></div>
          <div class="row w-persone item-actions"><button type="button" class="small" data-toggle="${c.id}" data-enabled="${c.enabled ? 1 : 0}">${c.enabled ? "Sospendi" : "Riattiva"}</button>
          <button type="button" class="small danger" data-del-card="${c.id}">Elimina</button></div></div>`).join("")}</div></div>
      <div class="card"><h2>Dati<span class="spacer"></span><button type="button" class="small w-persone" data-edit-data>${icon("edit")}Modifica</button></h2>
        <dl class="props"><dt>Nome</dt><dd>${esc(p.name)}</dd><dt>Ditta o Reparto</dt><dd>${esc(p.company || "—")}</dd>
          <dt>Note</dt><dd style="white-space:pre-wrap">${esc(p.notes || "—")}</dd><dt>Utente Axis</dt><dd><code>${esc(p.axis_user_token || "")}</code></dd></dl></div>
      ${can("registro") ? `<div class="card flush"><h2>Ultimi Passaggi<span class="spacer"></span><a class="small-text" href="#registro" data-person-log>Tutto il Registro</a></h2>
        <div class="list" style="margin-top:6px">${p.events.length ? p.events.map((e) => eventItem(e)).join("") : '<div class="empty">nessun passaggio registrato</div>'}</div></div>` : ""}
      <div class="w-persone" style="text-align:center;margin:8px 0 20px"><button type="button" class="danger" data-del-person>${icon("trash")}Elimina Persona e Tessere</button></div>
    </div></div>`;
  const close = () => { sheet.close(); };
  sheet.onclose = () => { if (location.hash.startsWith("#persone/")) history.replaceState(null, "", "#persone"); };
  sheet.oncancel = (e) => { e.preventDefault(); close(); };
  $("[data-close]", sheet).onclick = close;
  const reload = async () => { await loadPersons(); renderPersonList(); await openPerson(id); };
  if ($("[data-person-log]", sheet)) $("[data-person-log]", sheet).onclick = (e) => { e.preventDefault(); close(); logFilters.q = p.name; location.hash = "#registro"; };
  $("[data-edit-access]", sheet).onclick = async () => {
    const ok = await modal({
      title: "Accesso di " + p.name,
      body: `${store.categories.length ? field("Tipologia", categorySelect(p.category_id || 0)) : ""}${field("Gruppo", groupSelect(a.group))}${validityFields(a.from, a.to)}<p class="hint">Vale per tutte le tessere della persona.</p>`,
      actions: [{label: "Annulla", value: null}, {label: "Salva", kind: "primary", submit: true, onClick: async (dlg) => {
        const body = {group: val(dlg, "group"), ...readValidity(dlg)};
        if ($("[name=category]", dlg)) body.category_id = Number(val(dlg, "category"));
        return (await run(() => api(`api/persons/${id}/access`, {method: "PUT", body}), "Accesso aggiornato sul controller")) || false;
      }}],
      onOpen: (dlg) => { bindValidity(dlg); bindCategory(dlg); },
    });
    if (ok) reload();
  };
  $("[data-edit-data]", sheet).onclick = async () => {
    const ok = await modal({
      title: "Dati di " + p.name,
      body: `${field("Nome e Cognome", `<input name="name" value="${esc(p.name)}" maxlength="100">`)}
        ${field("Ditta o Reparto", `<input name="company" value="${esc(p.company || "")}" maxlength="100">`)}
        ${field("Note", `<textarea name="notes" maxlength="1000">${esc(p.notes || "")}</textarea>`)}`,
      actions: [{label: "Annulla", value: null}, {label: "Salva", kind: "primary", submit: true, onClick: async (dlg) =>
        (await run(() => api(`api/persons/${id}`, {method: "PATCH", body: {name: val(dlg, "name"), company: val(dlg, "company"), notes: val(dlg, "notes")}}), "Dati aggiornati")) || false}],
    });
    if (ok) reload();
  };
  $("[data-add-card]", sheet).onclick = async () => {
    const ok = await modal({
      title: "Aggiungi Tessera a " + p.name,
      body: `${field("Numero Tessera", `<input name="card" class="mono" autocomplete="off" placeholder="es. 04A1B2C3D4E5F6">`, "La nuova tessera avrà lo stesso gruppo e la stessa validità. Puoi anche passarla sul lettore e assegnarla da \"Da Registrare\".")}`,
      actions: [{label: "Annulla", value: null}, {label: "Aggiungi", kind: "primary", submit: true, onClick: async (dlg) =>
        (await run(() => api(`api/persons/${id}/cards`, {method: "POST", body: {card: val(dlg, "card")}}), "Tessera aggiunta")) || false}],
    });
    if (ok) reload();
  };
  $$("[data-toggle]", sheet).forEach((b) => b.onclick = async () => {
    const enable = b.dataset.enabled !== "1";
    if (await run(() => api(`api/cards/${b.dataset.toggle}`, {method: "PATCH", body: {enabled: enable}}), enable ? "Tessera riattivata" : "Tessera sospesa")) reload();
  });
  $$("[data-del-card]", sheet).forEach((b) => b.onclick = async () => {
    const card = p.cards.find((c) => c.id === Number(b.dataset.delCard));
    const last = p.cards.length === 1;

const logFilters = {q: "", kind: "", from: "", to: ""};
let logEvents = [];
function logParams(extra = {}) {
  const p = new URLSearchParams();
  if (logFilters.q) p.set("q", logFilters.q);
  if (logFilters.kind) p.set("kind", logFilters.kind);
  if (logFilters.from) p.set("since", new Date(logFilters.from + "T00:00:00").toISOString());
  if (logFilters.to) p.set("until", new Date(new Date(logFilters.to + "T00:00:00").getTime() + 86400000).toISOString());
  Object.entries(extra).forEach(([k, v]) => p.set(k, v));
  return p;
}
async function viewLog(el) {
  const kindOptions = Object.entries(KINDS).map(([k, [label]]) => `<option value="${k}">${esc(label)}</option>`).join("");
  el.innerHTML = `
    <div class="toolbar">
      <input type="search" id="l-q" placeholder="Cerca persona, tessera o dettaglio" value="${esc(logFilters.q)}">
      <select id="l-kind"><option value="">Tutti gli Eventi</option><option value="concesso,apertura_remota">Tutti gli Accessi</option><option value="negato,sconosciuta">Tutti i Rifiuti</option>${kindOptions}</select>
      <input type="date" id="l-from" value="${esc(logFilters.from)}" title="Dal giorno" aria-label="Dal giorno">
      <input type="date" id="l-to" value="${esc(logFilters.to)}" title="Al giorno" aria-label="Al giorno">
      <a class="btn w-io" id="l-export" href="#" download>${icon("download")}CSV</a>
    </div>
    <div class="card flush"><div class="list" id="l-list"><div class="loading"><span class="spinner"></span></div></div>
      <div style="text-align:center;padding:12px" id="l-more-box" hidden><button type="button" id="l-more">Carica Altri</button></div></div>`;
  $("#l-kind").value = logFilters.kind;
  let timer;
  $("#l-q").addEventListener("input", (e) => { logFilters.q = e.target.value.trim(); clearTimeout(timer); timer = setTimeout(() => loadLog(), 300); });
  $("#l-kind").addEventListener("change", (e) => { logFilters.kind = e.target.value; loadLog(); });
  $("#l-from").addEventListener("change", (e) => { logFilters.from = e.target.value; loadLog(); });
  $("#l-to").addEventListener("change", (e) => { logFilters.to = e.target.value; loadLog(); });
  $("#l-more").addEventListener("click", () => loadLog(true));
  bindSnapshots(el);
  await loadLog();
}
async function loadLog(more = false) {
  const params = logParams({limit: "100"});
  if (more && logEvents.length) params.set("before_id", logEvents[logEvents.length - 1].id);
  const data = await run(() => api("api/events?" + params));
  if (!data || !$("#l-list")) return;
  logEvents = more ? logEvents.concat(data) : data;
  renderLog();
  $("#l-more-box").hidden = data.length < 100;
  $("#l-export").href = "api/export/events.csv?" + logParams();
}
function renderLog() {
  let lastDay = "";
  $("#l-list").innerHTML = logEvents.length ? logEvents.map((e) => {
    const day = new Date(e.ts).toLocaleDateString("it-IT", {weekday: "long", day: "numeric", month: "long", year: "numeric"});
    const head = day !== lastDay ? `<div class="item" style="background:var(--surface-2);padding-top:6px;padding-bottom:6px"><b class="small-text">${esc(day)}</b></div>` : "";
    lastDay = day;
    return head + eventItem(e).replace('<div class="side">', '<div class="side" style="min-width:48px">').replace(esc(fmtDateTime(e.ts)), esc(fmtTime(e.ts)));
  }).join("") : '<div class="empty">nessun evento con questi filtri</div>';
}
async function refreshLog() {
  // Solo se si guarda la cima del registro senza filtri
  if (logFilters.q || logFilters.kind || logFilters.from || logFilters.to || window.scrollY > 200) return;
  const data = await api("api/events?limit=100").catch(() => null);
  if (!data || !$("#l-list")) return;
  if (data.length && logEvents.length && data[0].id === logEvents[0].id) return;
  logEvents = data;
  renderLog();
}
function bindSnapshots(root) {
  root.addEventListener("click", (e) => {
    const img = e.target.closest("[data-snap]");
    if (img) { e.stopPropagation(); showImage(`api/events/${img.dataset.snap}/snapshot`, img.dataset.title); }
  });
}

// ---------- Regole ----------
function weekPreview(rules) {
  const rows = DAYS.map(([code, , name]) => {
    const segs = rules.filter((r) => r.days.includes(code)).map((r) => {
      const toMin = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
      const left = (toMin(r.start) / 1440) * 100, width = ((toMin(r.end) - toMin(r.start)) / 1440) * 100;
      return width > 0 ? `<span class="seg" style="left:${left}%;width:${width}%" title="${r.start}-${r.end}"></span>` : "";
    }).join("");
    return `<span>${name}</span><div class="track">${segs}</div>`;
  }).join("");
  return `<div class="week">${rows}<span></span><div class="axis"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div></div>`;
}

  let rules = s && s.rules.length ? s.rules.map((r) => ({...r, days: [...r.days]})) : [{days: ["MO", "TU", "WE", "TH", "FR"], start: "08:00", end: "18:00"}];
  const renderRules = (dlg) => {
    $("#rules", dlg).innerHTML = rules.map((r, i) => `<div class="rule-row" data-i="${i}">
      <span class="days">${DAYS.map(([code, letter, name]) => `<button type="button" class="${r.days.includes(code) ? "on" : ""}" data-day="${code}" title="${name}">${letter}</button>`).join("")}</span>
      <span class="row"><input type="time" data-k="start" value="${esc(r.start)}" step="300"> – <input type="time" data-k="end" value="${esc(r.end === "24:00" ? "23:59" : r.end)}" step="60"></span>
      <button type="button" class="ghost icon-only danger" data-rm title="Rimuovi">${icon("trash")}</button></div>`).join("") || '<p class="muted">Nessun intervallo.</p>';
    $("#preview", dlg).innerHTML = weekPreview(rules.filter((r) => r.start && r.end && r.end > r.start));
  };
  const ok = await modal({
    title: s ? "Modifica Fascia Oraria" : "Nuova Fascia Oraria",
    wide: true,
    body: `${s && !s.managed ? `<div class="alert info">${icon("alert")}<div class="grow">${s.standard ? "È una fascia predefinita del controller." : "Questa fascia è stata creata fuori dall'add-on."} Salvando la riscrivi con gli intervalli qui sotto e da quel momento la gestisce l'add-on.${s.groups.length ? ` Vale subito per: ${esc(s.groups.join(", "))}.` : ""}</div></div>` : ""}<div class="fields-2">${field("Nome", `<input name="name" maxlength="100" value="${esc(s?.name || "")}" placeholder="es. Orario negozio">`)}
      ${field("Descrizione", `<input name="description" maxlength="200" value="${esc(s?.description || "")}" placeholder="facoltativa">`)}</div>
      <div class="field"><label>Intervalli Settimanali</label><div id="rules"></div>
        <div class="row"><button type="button" class="small" id="add-rule">${icon("plus")}Aggiungi Intervallo</button>
        <span class="muted small-text">Modelli:</span><button type="button" class="small ghost" data-tpl="office">Lun-Ven 8-18</button>
        <button type="button" class="small ghost" data-tpl="shop">Lun-Sab 7-20</button><button type="button" class="small ghost" data-tpl="day">Tutti i Giorni 6-22</button><button type="button" class="small ghost" data-tpl="always">Sempre</button></div></div>
      <div class="field inline"><input type="checkbox" name="holidays" id="f-hol" ${s ? (s.holidays ? "checked" : "") : "checked"}><label for="f-hol">Non Valida nei Giorni Festivi</label></div>
      <p class="hint" style="margin:-8px 0 12px">I festivi si gestiscono nella scheda <a href="#regole/festivita">Festività</a>.</p>
      <div class="field"><label>Anteprima</label><div id="preview"></div></div>`,
    actions: [{label: "Annulla", value: null}, {label: s ? "Salva" : "Crea", kind: "primary", submit: true, onClick: async (dlg) => {
      const payload = {name: val(dlg, "name"), description: val(dlg, "description"), holidays: val(dlg, "holidays"),
        rules: rules.map((r) => ({...r, end: r.end === "23:59" ? "24:00" : r.end}))};
      const path = s ? `api/schedules/${encodeURIComponent(s.token)}` : "api/schedules";
      return (await run(() => api(path, {method: s ? "PUT" : "POST", body: payload}), s ? "Fascia aggiornata sul controller" : "Fascia creata sul controller")) || false;
    }}],
    onOpen: (dlg) => {
      renderRules(dlg);
      $("#add-rule", dlg).onclick = () => { rules.push({days: ["MO", "TU", "WE", "TH", "FR"], start: "09:00", end: "13:00"}); renderRules(dlg); };
      $$("[data-tpl]", dlg).forEach((b) => b.onclick = () => {
        rules = {office: [{days: ["MO", "TU", "WE", "TH", "FR"], start: "08:00", end: "18:00"}],
          shop: [{days: ["MO", "TU", "WE", "TH", "FR", "SA"], start: "07:00", end: "20:00"}],
          day: [{days: DAYS.map((d) => d[0]), start: "06:00", end: "22:00"}],
          always: [{days: DAYS.map((d) => d[0]), start: "00:00", end: "23:59"}]}[b.dataset.tpl];
        renderRules(dlg);
      });
      $("#rules", dlg).addEventListener("click", (e) => {
        const row = e.target.closest("[data-i]");
        if (!row) return;
        const r = rules[Number(row.dataset.i)];
        const day = e.target.closest("[data-day]");
        if (day) { r.days = r.days.includes(day.dataset.day) ? r.days.filter((d) => d !== day.dataset.day) : [...r.days, day.dataset.day]; renderRules(dlg); }
        if (e.target.closest("[data-rm]")) { rules.splice(Number(row.dataset.i), 1); renderRules(dlg); }
      });
      $("#rules", dlg).addEventListener("change", (e) => {
        const row = e.target.closest("[data-i]");
        if (row && e.target.dataset.k) { rules[Number(row.dataset.i)][e.target.dataset.k] = e.target.value; $("#preview", dlg).innerHTML = weekPreview(rules.filter((r) => r.start && r.end && r.end > r.start)); }
      });
    },
  });
  if (ok) render();
}

        }}]});
      if (ok) render();
    } else if (b.dataset.pr) {
      const r = p.readers.find((x) => x.token === b.dataset.pr);

        ${field("Descrizione", `<input name="description" maxlength="200" value="${esc(r.description)}">`)}`,
        actions: [{label: "Annulla", value: null}, {label: "Scrivi sul Controller", kind: "primary", submit: true, onClick: async (dlg) =>
          (await save(`api/programming/readers/${encodeURIComponent(r.token)}`, {name: val(dlg, "name"), description: val(dlg, "description")}, "Lettore aggiornato sul controller")) || false}]});

        body: `<div class="alert">${icon("alert")}<div class="grow">Cambiare porta o lettori cambia quale porta si apre con quale lettore. Se dopo il salvataggio le tessere non aprono più, annulla dallo storico.</div></div>

          ${field("Porta Comandata", `<select name="door">${p.doors.map((d) => `<option value="${esc(d.token)}" ${d.token === a.door ? "selected" : ""}>${esc(d.name || d.token)}</option>`).join("")}</select>`)}</div>
          <div class="field"><label>Lettori</label><div class="perm-list">${p.readers.map((r) => `<label><input type="checkbox" name="reader" value="${esc(r.token)}" ${a.readers.includes(r.token) ? "checked" : ""}>${esc(r.name || r.token)}</label>`).join("")}</div></div>
          <div class="fields-2">${field("Direzione", `<select name="direction"><option value="">Non indicata</option>${Object.entries(p.directions).map(([k, label]) => `<option value="${k}" ${k === a.direction ? "selected" : ""}>${label}</option>`).join("")}</select>`)}

          return (await save(`api/programming/access-points/${encodeURIComponent(a.token)}`, {name: val(dlg, "name"), door: val(dlg, "door"), readers, direction: val(dlg, "direction"), enabled: val(dlg, "enabled")}, "Collegamento aggiornato sul controller")) || false;
        }}]});
      if (ok) render();
    } else if (b.dataset.undo) {
      const c = p.changes.find((x) => x.id === Number(b.dataset.undo));
      if (await confirmBox("Annulla Modifica", `Riportare <b>${esc(c.summary)}</b> com'era prima della modifica del ${esc(fmtDateTime(c.ts))}?`, "Annulla Modifica") &&

  };

async function viewUsers(body) {
  let data;
  try { data = await api("api/users"); } catch (err) { body.innerHTML = `<div class="alert err">${esc(err.message)}</div>`; return; }
  const roleLabel = (u) => data.roles[u.role]?.label || "Personalizzato";
  body.innerHTML = `<div class="toolbar"><p class="muted" style="margin:0;flex:1;min-width:240px">Gli utenti sono quelli di Home Assistant: chi apre l'app per la prima volta viene aggiunto con "Solo Stato" e qui gli dai i permessi. Puoi anche aggiungerli prima, con il loro nome utente.</p>
    <button type="button" class="primary" id="u-new">${icon("plus")}Nuovo Utente</button></div>
    <div class="card flush"><div class="list">${data.users.map((u) => `<div class="item">
      <div class="avatar ${u.perms.length ? "" : "off"}">${esc(initials(u.name || u.username))}</div>
      <div class="grow"><div class="title">${esc(u.name || u.username)}${u.username === store.me.username ? ' <span class="muted" style="font-weight:400">· tu</span>' : ""}</div>
        <div class="meta"><code>${esc(u.username)}</code><span class="pill ${u.admin ? "accent" : u.perms.length ? "" : "warn"}">${esc(roleLabel(u))}</span><span>${u.last_seen ? "ultimo accesso " + esc(relTime(u.last_seen)) : "mai entrato"}</span></div></div>
      <div class="row item-actions"><button type="button" class="small" data-u-edit="${esc(u.username)}">${icon("edit")}Permessi</button>
        ${u.username === store.me.username ? "" : `<button type="button" class="small danger" data-u-del="${esc(u.username)}">Elimina</button>`}</div></div>`).join("")}</div></div>`;
  paintIcons(body);
  const form = (u) => `${u ? "" : field("Nome Utente di Home Assistant", `<input name="username" autocomplete="off" placeholder="es. mario">`, "Lo trovi in Impostazioni → Persone → Utenti di Home Assistant.")}
    ${field("Nome", `<input name="name" maxlength="100" value="${esc(u?.name || "")}" placeholder="facoltativo">`)}
    ${field("Ruolo", `<select name="role">${Object.entries(data.roles).map(([k, r]) => `<option value="${k}" ${u?.role === k ? "selected" : ""}>${esc(r.label)}</option>`).join("")}<option value="personalizzato" ${u?.role === "personalizzato" ? "selected" : ""}>Personalizzato</option></select>`)}
    <div class="field"><label>Permessi</label><div class="perm-list">${Object.entries(data.permissions).map(([k, label]) => `<label><input type="checkbox" name="perm" value="${k}" ${(u ? u.perms : data.roles.solo_stato.perms).includes(k) ? "checked" : ""}>${esc(label)}</label>`).join("")}</div>
      <p class="hint">Tutti vedono il cruscotto e lo stato del controller.</p></div>`;
  const bind = (dlg) => {
    const role = $("[name=role]", dlg);
    const boxes = $$("[name=perm]", dlg);
    role.onchange = () => { const r = data.roles[role.value]; if (r) boxes.forEach((b) => { b.checked = r.perms.includes(b.value); }); };
    boxes.forEach((b) => b.onchange = () => {
      const chosen = boxes.filter((x) => x.checked).map((x) => x.value).sort().join(",");
      role.value = Object.entries(data.roles).find(([, r]) => [...r.perms].sort().join(",") === chosen)?.[0] || "personalizzato";
    });
  };
  const save = (u) => async (dlg) => {
    const payload = {username: u ? u.username : val(dlg, "username"), name: val(dlg, "name"), perms: $$("[name=perm]:checked", dlg).map((x) => x.value)};
    return (await run(() => api(u ? `api/users/${encodeURIComponent(u.username)}` : "api/users", {method: u ? "PUT" : "POST", body: payload}), "Utente salvato")) || false;
  };
  $("#u-new").onclick = async () => {
    if (await modal({title: "Nuovo Utente", body: form(null), onOpen: bind, actions: [{label: "Annulla", value: null}, {label: "Aggiungi", kind: "primary", submit: true, onClick: save(null)}]})) render();

    const b = e.target.closest("button");
    if (!b) return;
    const u = data.users.find((x) => x.username === (b.dataset.uEdit || b.dataset.uDel));
    if (!u) return;
    if (b.dataset.uEdit) {
      if (await modal({title: "Permessi di " + (u.name || u.username), body: form(u), onOpen: bind, actions: [{label: "Annulla", value: null}, {label: "Salva", kind: "primary", submit: true, onClick: save(u)}]})) {
        if (u.username === store.me.username) location.reload(); else render();
      }

        await run(() => api(`api/users/${encodeURIComponent(u.username)}`, {method: "DELETE"}), "Utente eliminato")) render();
  };
}
async function loadAudit(more = false) {
  const params = new URLSearchParams({limit: "50"});
  if (more && auditRows.length) params.set("before_id", auditRows[auditRows.length - 1].id);
  const rows = await api("api/audit?" + params).catch(() => []);
  auditRows = more ? auditRows.concat(rows) : rows;
  const body = $("#audit");
  if (!body) return;
  body.innerHTML = auditRows.length ? auditRows.map((a) => `<tr><td>${esc(fmtDateTime(a.ts))}</td><td>${esc(a.user)}</td><td><b>${esc(a.action)}</b>${a.detail ? `<div class="muted small-text">${esc(a.detail)}</div>` : ""}</td></tr>`).join("") : '<tr><td colspan="3" class="muted">nessuna attività</td></tr>';
  $("#audit-more-box").hidden = rows.length < 50;
}

  if (!preview) return;
  const table = (res) => `<p>${res.riepilogo.righe} righe: <b>${res.riepilogo.ok}</b> ${res.applicato ? "importate" : "da importare"}, ${res.riepilogo.saltate} saltate, ${res.riepilogo.errori} con errori.</p>
    <div class="table-wrap"><table class="table"><thead><tr><th>Riga</th><th>Nome</th><th>Tessera</th><th>Esito</th></tr></thead><tbody>${res.righe.map((r) => `<tr><td>${r.riga}</td><td>${esc(r.nome)}</td><td><code>${esc(r.tessera)}</code></td><td><span class="pill ${r.esito === "errore" ? "err" : r.esito === "saltata" ? "" : "ok"}">${esc(r.esito)}</span> <span class="small-text">${esc(r.dettaglio)}</span></td></tr>`).join("")}</tbody></table></div>`;
  const go = await modal({title: "Anteprima importazione", wide: true, body: table(preview),
    actions: [{label: "Annulla", value: false}, ...(preview.riepilogo.ok ? [{label: `Importa ${preview.riepilogo.ok}`, kind: "primary", value: true}] : [])]});
  if (!go) return;
  const result = await run(() => api("api/import/persons", {method: "POST", body: {csv: text, apply: true}}));
  if (result) await modal({title: "Importazione completata", wide: true, body: table(result), actions: [{label: "Chiudi", kind: "primary", value: true}]});
}

// ---------- Avvio ----------
async function start() {
  paintIcons();
  try {
    store.me = await api("api/me");
  } catch (err) { /* la pagina funziona anche senza */ }
  // Nasconde pagine e pulsanti per cui l'utente non ha il permesso
  ALL_PERMS.forEach((perm) => document.body.classList.toggle("no-" + perm, !can(perm)));
  $$("#nav a").forEach((a) => { const need = ROUTES[a.dataset.route]?.[2]; a.hidden = Boolean(need) && !can(need); });
  $("#nav-foot").textContent = store.me.user ? `${store.me.user}${store.me.admin ? " · Amministratore" : store.me.perms.length ? "" : " · Solo Stato"}` : "";
  await loadSummary();
  await render();
  setInterval(loadSummary, 5000);
  setInterval(refreshView, 15000);
}
start();
</script>
