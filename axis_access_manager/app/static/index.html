<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Controllo Accessi</title>
<style>
  :root {
    --bg: #f3f5f8; --surface: #ffffff; --surface-2: #f7f8fa; --text: #1b1f24; --muted: #5f6b7a;
    --border: #dde2e8; --border-strong: #c5ccd5;
    --accent: #0b6bcb; --accent-soft: #e3effc; --accent-text: #ffffff;
    --ok: #1a7f37; --ok-soft: #e4f4e8; --warn: #9a6700; --warn-soft: #fbf0d9; --err: #c62828; --err-soft: #fde7e7;
    --info: #6639ba; --info-soft: #efe9fb;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
    --radius: 12px; --nav-w: 232px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --surface: #181c22; --surface-2: #1f242b; --text: #e7eaee; --muted: #9aa5b1;
      --border: #2b323b; --border-strong: #3a434e;
      --accent: #4c9cf0; --accent-soft: #15283d; --accent-text: #0b1118;
      --ok: #4ac26b; --ok-soft: #13291b; --warn: #e3b341; --warn-soft: #2e2511; --err: #ff6b6b; --err-soft: #331617;
      --info: #b093f5; --info-soft: #241c3a;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  svg.icon { width: 20px; height: 20px; fill: currentColor; flex: none; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }

  /* Struttura */
  .app { display: flex; min-height: 100vh; }
  /* Menu laterale: sempre presente con le sole icone, il pulsante ☰ lo allarga con i nomi delle pagine */
  .nav { width: 64px; flex: none; background: var(--surface); border-right: 1px solid var(--border); overflow: hidden;
         position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 10px 10px 12px; gap: 2px;
         transition: width .18s ease; z-index: 30; }
  body.nav-open .nav { width: var(--nav-w); }
  .nav .lbl, .brand .name, .nav .foot { opacity: 0; pointer-events: none; transition: opacity .12s; white-space: nowrap; }
  body.nav-open .nav .lbl, body.nav-open .brand .name, body.nav-open .nav .foot { opacity: 1; pointer-events: auto; }
  .nav-toggle { display: flex; align-items: center; gap: 12px; width: 100%; justify-content: flex-start; padding: 9px 12px;
                border: none; background: none; color: var(--text); border-radius: 10px; margin-bottom: 4px; }
  .nav-toggle:hover { background: var(--surface-2); }
  .nav-toggle .lbl { font-weight: 700; font-size: 16px; }
  .nav-backdrop { display: none; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 12px; font-weight: 700; font-size: 16px; }
  .brand .logo { width: 32px; height: 32px; border-radius: 9px; background: var(--accent); color: var(--accent-text);
                 display: grid; place-items: center; }
  .nav a { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 10px; color: var(--muted);
           font-weight: 500; position: relative; white-space: nowrap; }
  .nav a:hover { background: var(--surface-2); text-decoration: none; color: var(--text); }
  .nav a.active { background: var(--accent-soft); color: var(--accent); }
  .nav .count { position: absolute; top: 3px; left: 28px; background: var(--err); color: #fff; border-radius: 10px; font-size: 11px;
                min-width: 18px; padding: 0 5px; text-align: center; line-height: 18px; }
  body.nav-open .nav .count { position: static; margin-left: auto; font-size: 12px; min-width: 20px; line-height: 20px; }
  .nav { overflow-y: auto; }
  .nav-bottom { margin-top: auto; padding-top: 8px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 2px; }
  .nav-user .avatar.small { width: 26px; height: 26px; font-size: 11px; margin: -2px -1px; flex: none; }
  .nav-user .lbl { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
  .nav-user .role { font-size: 12px; color: var(--muted); }
  a.nav-user:not([href]) { cursor: default; }
  a.nav-user:not([href]):hover { background: none; color: var(--muted); }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid transparent;
            display: flex; align-items: center; gap: 12px; padding: 8px 24px; min-height: 52px; flex-wrap: wrap; }
  .topbar.scrolled { border-bottom-color: var(--border); }
  .topbar h1 { font-size: 20px; margin: 0; flex: 0 1 auto; min-width: 0; }
  .page-sub { color: var(--muted); font-size: 14px; white-space: nowrap; }
  .top-space { flex: 1; }
  /* Matita del cruscotto: solo l'icona, la scritta si apre passandoci sopra */
  .top-edit { display: inline-flex; align-items: center; gap: 0; height: 30px; padding: 0 7px; border-radius: 999px; color: var(--muted); font-size: 13px; }
  .top-edit[hidden] { display: none; }
  .top-edit svg.icon { width: 17px; height: 17px; flex: none; }
  .top-edit .lbl { max-width: 0; overflow: hidden; white-space: nowrap; transition: max-width .2s ease, margin .2s ease; }
  .top-edit:hover, .top-edit:focus-visible { color: var(--text); background: var(--surface-2); }
  .top-edit:hover .lbl, .top-edit:focus-visible .lbl { max-width: 160px; margin-left: 6px; }
  .top-chips { display: flex; gap: 8px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; font-size: 14px; font-weight: 500;
          border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); white-space: nowrap; cursor: pointer; }
  a.chip:hover, button.chip:hover { text-decoration: none; background: var(--surface-2); }
  .chip svg.icon { width: 17px; height: 17px; }
  .chip b { font-variant-numeric: tabular-nums; }
  .chip.muted-chip { color: var(--muted); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
  .chip.err { background: var(--err-soft); color: var(--err); border-color: color-mix(in srgb, var(--err) 40%, transparent); }
  .chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; cursor: default; }
  .chip.ok .dot { background: var(--ok); width: 8px; height: 8px; }
  .top-pop { position: absolute; right: 16px; top: calc(100% + 6px); width: min(420px, calc(100% - 16px)); margin: 0; padding: 0; z-index: 40;
             border-color: var(--border-strong); box-shadow: 0 12px 32px rgba(0, 0, 0, .22), 0 2px 6px rgba(0, 0, 0, .12); overflow: hidden; }
  /* Sul tema scuro la tendina deve staccarsi dai riquadri sotto, che hanno lo stesso colore */
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .top-pop { background: var(--surface-2); box-shadow: 0 12px 32px rgba(0, 0, 0, .6); } }
  :root[data-theme="dark"] .top-pop { background: var(--surface-2); box-shadow: 0 12px 32px rgba(0, 0, 0, .6); }
  .chip[aria-expanded=true] { box-shadow: 0 0 0 2px currentColor; }
  .top-pop .pop-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .top-pop .pop-head b { flex: 1; font-size: 15px; }
  .top-pop .pop-row { display: flex; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--border); color: var(--text); }
  .top-pop .pop-row:hover { background: var(--surface-2); text-decoration: none; }
  .top-pop .pop-row .dot { margin-top: 7px; }
  .top-pop .pop-row .t { font-weight: 600; font-size: 14px; }
  .top-pop .pop-row .m { color: var(--muted); font-size: 13px; }
  .top-pop .pop-row time { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .top-pop .pop-foot { display: block; text-align: center; padding: 10px; font-size: 14px; }
  @media (max-width: 640px) {
    .chip .lbl, .page-sub { display: none; }
    .chip { padding: 0 10px; height: 32px; }
  }
  .content { padding: 20px 24px 48px; width: 100%; }

  /* Elementi */
  button, .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--surface);
                 color: var(--text); border: 1px solid var(--border-strong); border-radius: 9px; padding: 7px 14px;
                 font: inherit; font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration: none; }
  button:hover, .btn:hover { background: var(--surface-2); text-decoration: none; }
  button.primary, .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.primary:hover { filter: brightness(1.06); }
  button.danger { color: var(--err); }
  button.danger.primary { background: var(--err); border-color: var(--err); color: #fff; }
  button.ghost { border-color: transparent; background: transparent; }
  button.ghost:hover { background: var(--surface-2); }
  button.small, .btn.small { padding: 4px 10px; font-size: 13px; border-radius: 8px; }
  button.icon-only { padding: 6px; }
  button:disabled { opacity: .5; cursor: default; }
  input, select, textarea { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border-strong);
                            border-radius: 9px; padding: 7px 10px; min-width: 0; }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  textarea { resize: vertical; min-height: 70px; }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); vertical-align: middle; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
          padding: 18px; margin-bottom: 16px; }
  .card > h2, .dw-body > h2, .section-title { font-size: 15px; margin: 0 0 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card > h2 .pill { white-space: normal; }
  .card > h2 .spacer, .dw-body > h2 .spacer, .row .spacer { flex: 1; }
  .card.flush { padding: 0; }
  .card.flush > h2 { padding: 16px 18px 0; }
  .grid { display: grid; gap: 16px; }
  .grid.kpi { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .grid.two { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); align-items: start; }
  .grid.cards { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .grid.tiles { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .door-group { margin-bottom: 18px; }
  .door-group .section-title { color: var(--muted); }
  .tile { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; min-height: 128px; background: var(--surface);
          border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); color: var(--text); }
  .tile:hover { text-decoration: none; border-color: var(--accent); }
  .tile .t { color: var(--text); }
  .tile svg.icon { width: 18px; height: 18px; }
  /* Registro compatto: una riga per evento, i dettagli al clic */
  .list.compact > .ev { display: grid; grid-template-columns: 46px 12px minmax(0, 1fr) auto; gap: 10px; align-items: center;
                        padding: 8px 16px; border-top: 1px solid var(--border); cursor: pointer; font-size: 14px; }
  .list.compact > .ev:first-child { border-top: none; }
  .list.compact > .ev:hover { background: var(--surface-2); }
  .list.compact > .ev.sel { background: var(--accent-soft); }
  .ev .time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
  .ev .what { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev .where { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; text-align: right; }
  @media (max-width: 600px) {
    .list.compact > .ev { grid-template-columns: 40px 10px minmax(0, 1fr) auto; gap: 8px; padding: 9px 12px; }
    .ev .where { max-width: 96px; font-size: 12px; }
  }
  .ev .dot.info { background: var(--info); } .ev .dot.accent { background: var(--accent); }
  .list.compact > .day { padding: 5px 16px; background: var(--surface-2); border-top: 1px solid var(--border); font-size: 12px; font-weight: 700; color: var(--muted); }
  .list.compact > .day:first-child { border-top: none; }
  .log-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (min-width: 1100px) { .log-layout.split { grid-template-columns: minmax(0, 1fr) 380px; } }
  .log-detail { position: sticky; top: 76px; }
  .hidden-count { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--border); background: var(--surface-2); font-size: 13px; color: var(--muted); }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ctl-card { position: relative; padding: 0; }
  .ctl-main { display: flex; flex-direction: column; gap: 6px; padding: 16px 60px 16px 18px; color: var(--text); }
  .ctl-main:hover { text-decoration: none; background: var(--surface-2); border-radius: inherit; }
  .ctl-name { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; }
  .ctl-stats { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; font-size: 13px; color: var(--muted); }
  .ctl-stats b { color: var(--text); font-size: 15px; }
  .ctl-stats .pill { margin-left: auto; }
  .ctl-gear { position: absolute; top: 12px; right: 12px; }
  .ctl-head { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .schema { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(56px, 200px) minmax(0, 1fr); align-items: start; }
  .sch-col { display: flex; flex-direction: column; gap: 14px; position: relative; z-index: 1; min-width: 0; }
  .sch-head { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .sch-node { display: flex; align-items: center; gap: 10px; min-height: 62px; padding: 8px 12px; border: 2px solid var(--border); border-radius: 12px; background: var(--surface);
    color: var(--text); text-align: left; font: inherit; width: 100%; box-sizing: border-box; cursor: pointer; }
  .sch-node:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
  .sch-node .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .sch-node b { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sch-meta { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sch-node.sel { border-color: var(--accent); background: var(--accent-soft); }
  .sch-node.target { border-style: dashed; border-color: var(--accent); }
  .sch-lines { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  .sch-line { fill: none; stroke-width: 3; stroke: var(--accent); }
  .sch-line.new { stroke: var(--warn); stroke-dasharray: 8 6; }
  .sch-line.off { stroke: var(--muted); stroke-dasharray: 3 6; }
  .sch-line.input { stroke: var(--info); }
  .sch-gear.input { border-color: var(--info); }
  .sch-gear { position: absolute; z-index: 2; width: 34px; height: 34px; padding: 0; border-radius: 50%; border: 2px solid var(--accent); background: var(--surface);
    display: grid; place-items: center; color: var(--text); }
  .sch-gear.new { border-color: var(--warn); } .sch-gear.off { border-color: var(--muted); }
  .sch-gear svg.icon { width: 16px; height: 16px; }
  .save-bar { position: sticky; bottom: 12px; z-index: 4; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 16px; margin-top: 12px;
    border-radius: 12px; background: #1b1f24; color: #fff; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
  .save-bar .grow { flex: 1 1 200px; min-width: 0; }
  .save-bar button:not(.primary) { background: transparent; color: #fff; border-color: #5f6b7a; }
  a.item.door-row { color: var(--text); }
  a.item.door-row:hover { text-decoration: none; background: var(--surface-2); }
  .door-group .card { margin-bottom: 18px; }
  @media (max-width: 600px) {
    .schema { grid-template-columns: minmax(0, 1fr) 46px minmax(0, 1fr); }
    .sch-node { padding: 8px; min-height: 66px; }
    .sch-node .ev-icon { display: none; }
    .sch-node b { white-space: normal; overflow-wrap: anywhere; font-size: 13px; line-height: 1.25; }
    .sch-meta { white-space: normal; font-size: 11px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  }
  /* Cruscotto a griglia: larghezza in quarti di riga, altezza in righe da 64px; i riquadri piccoli riempiono i buchi */
  .dash-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: -6px 0 12px; }
  .dash-bar svg.icon { width: 18px; height: 18px; vertical-align: -4px; }
  .dash { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: 64px; grid-auto-flow: row dense; gap: 16px; }
  .dash > .card { margin: 0; min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; position: relative; }
  .dw-body { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; scrollbar-width: thin; }
  .dw-body > h2 { flex: none; }
  .dw.kpi .dw-kpi { margin-block: auto; }
  .dw-settimana .chart { flex: 1; height: auto; min-height: 70px; }
  .dw-settimana .legend { flex: none; }
  .dw-resize { position: absolute; right: 2px; bottom: 2px; width: 28px; height: 28px; padding: 0; border: 0; background: none; color: var(--muted);
               cursor: nwse-resize; touch-action: none; display: grid; place-items: center; border-radius: 6px; z-index: 2; }
  .dw-resize:hover, .dw-resize:focus-visible { color: var(--accent); background: var(--surface-2); }
  .dw-resize svg.icon { width: 18px; height: 18px; }
  .dw.resizing { outline-color: var(--accent) !important; }
  .dw-dim { position: absolute; right: 34px; bottom: 6px; font-size: 12px; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; }
  .dw.w-1 { grid-column: span 1; } .dw.w-2 { grid-column: span 2; } .dw.w-3 { grid-column: span 3; } .dw.w-4 { grid-column: span 4; }
  .dw.dw-porte .door-group .section-title { margin-top: 4px; }
  /* Riquadri con un numero, compatti: etichetta e dettaglio a sinistra, numero a destra */
  .dw.kpi { padding: 10px 16px; }
  .dw-kpi { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; align-items: center; }
  .dw-kpi .label, .dw-kpi .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dw-kpi .label { color: var(--muted); font-size: 13px; font-weight: 500; }
  .dw-kpi .value { grid-column: 2; grid-row: 1 / span 2; font-size: 26px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .dw-kpi .sub { color: var(--muted); font-size: 12px; }
  .dw-notif { color: inherit; }
  .dw-notif:hover { text-decoration: none; background: var(--surface-2); }
  .dw-notif .n-tile { width: 36px; height: 36px; }
  .dw-notif .n-sev { margin-left: 4px; vertical-align: 1px; }
  .dw-sys { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .dw-sys:last-child { border-bottom: 0; }
  .dash.editing .dw { outline: 2px dashed var(--border-strong); outline-offset: -2px; box-shadow: none; }
  .dash.editing .dw-body { pointer-events: none; opacity: .45; }
  /* In modifica la barra sta sopra il contenuto: anche i riquadri di una riga restano della loro misura */
  .dw-edit { position: absolute; inset: 0 0 auto 0; z-index: 2; display: flex; align-items: center; gap: 4px; padding: 4px 6px;
             background: var(--surface); border-bottom: 1px solid var(--border); }
  .dw-edit .dw-name { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .dw a.item { color: inherit; }
  .dw a.item:hover { text-decoration: none; background: var(--surface-2); }
  .dw-handle { cursor: grab; touch-action: none; }
  .dw.dragging { opacity: .6; outline-color: var(--accent) !important; }
  .dw.dragging .dw-handle { cursor: grabbing; }
  .dw-catalog .item { width: 100%; border: 0; border-bottom: 1px solid var(--border); border-radius: 0; background: none; text-align: left;
                      white-space: normal; justify-content: flex-start; padding: 12px 4px; font-weight: 400; }
  .dw-catalog .item:hover { background: var(--surface-2); }
  .dw-catalog .item svg { color: var(--accent); fill: var(--accent); }
  @media (max-width: 1000px) {
    .dw.w-1 { grid-column: span 2; } .dw.w-3 { grid-column: span 4; }
  }
  @media (max-width: 640px) {
    .dash { gap: 12px; }
    .dw.w-2 { grid-column: span 4; }
    /* Sul telefono a metà riga restano solo i riquadri con un numero: gli elenchi non ci stanno */
    .dw.w-1:not(.kpi) { grid-column: span 4; }
    .dw-kpi .value { font-size: 22px; }
    .dash-bar button { flex: 1 1 auto; }
  }

const fmtDateTime = (iso) => iso ? new Date(iso).toLocaleString("it-IT", {day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit"}) : "";
const fmtFull = (iso) => iso ? new Date(iso).toLocaleString("it-IT", {dateStyle: "medium", timeStyle: "medium"}) : "";
const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString("it-IT", {day: "numeric", month: "short", year: "numeric"}) : "";
const fmtTime = (iso) => iso ? new Date(iso).toLocaleTimeString("it-IT", {hour: "2-digit", minute: "2-digit"}) : "";
function relTime(iso) {
  if (!iso) return "";
  const d = new Date(iso), now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return "adesso";
  if (diff < 3600) return `${Math.floor(diff / 60)} min fa`;
  const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (d >= startToday) return `oggi ${fmtTime(iso)}`;
  if (d >= new Date(startToday - 86400000)) return `ieri ${fmtTime(iso)}`;
  if (diff < 6 * 86400) return d.toLocaleDateString("it-IT", {weekday: "long"}) + " " + fmtTime(iso);
  return fmtDate(iso);
}
// Valori per <input type=datetime-local> e ritorno in UTC
function toLocalInput(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

let toastTimer;
function toast(message, error = false) {
  const el = $("#toast");
  el.textContent = message;
  el.className = error ? "error" : "";
  el.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.display = "none"; }, error ? 7000 : 3000);
}

async function api(path, options = {}) {
  const res = await fetch(path, {
    method: options.method || "GET",
    headers: options.body !== undefined ? {"Content-Type": "application/json"} : {},
    body: options.body !== undefined ? JSON.stringify(options.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const message = typeof data.detail === "string" ? data.detail : "errore " + res.status;
    // Il controller non ha risposto a una modifica: si può riprovare senza rifare tutto da capo
    if (res.status === 502 && (options.method || "GET") !== "GET" && !message.includes("scritture sospese") && await retryBox(message)) return api(path, options);
    throw new Error(message);
  }
  return data;
}

// Finestra separata da #modal: l'errore può arrivare mentre un'altra finestra è aperta
function retryBox(message) {
  return new Promise((resolve) => {
    const dlg = $("#retry");
    dlg.innerHTML = `<div class="dlg"><div class="dlg-head"><h2>Il Controller Non Ha Risposto</h2></div>
      <div class="dlg-body"><p style="margin:0 0 8px">La modifica non è stata completata.</p><p class="muted small-text" style="margin:0">${esc(message)}</p>
        <p class="hint">Controlla che il controller sia acceso e in rete, poi riprova. Riprovare non crea doppioni.</p></div>
      <div class="dlg-foot"><button type="button" data-r="0">Annulla</button><button type="button" class="primary" data-r="1">Riprova</button></div></div>`;
    const finish = (value) => { dlg.close(); resolve(value); };
    $$("[data-r]", dlg).forEach((b) => { b.onclick = () => finish(b.dataset.r === "1"); });
    dlg.oncancel = (e) => { e.preventDefault(); finish(false); };
    dlg.showModal();
    $("[data-r='1']", dlg).focus();
  });
}

async function run(action, success) {
  try {
    const result = await action();

// Apre una finestra: body è HTML, actions [{label, kind, onClick(dialogEl) → false per lasciarla aperta}]
function modal({title, body = "", actions = [], wide = false, cls = "", onOpen}) {
  return new Promise((resolve) => {
    const dlg = $("#modal");
    dlg.className = (wide ? "wide " : "") + cls;
    dlg.innerHTML = `<form class="dlg" method="dialog">
      <div class="dlg-head"><h2>${esc(title)}</h2><button type="button" class="ghost icon-only" data-x aria-label="Chiudi">${icon("close")}</button></div>
      <div class="dlg-body">${body}</div>
      ${actions.length ? `<div class="dlg-foot">${actions.map((a, i) => `<button type="${a.submit ? "submit" : "button"}" class="${a.kind || ""}" data-a="${i}">${esc(a.label)}</button>`).join("")}</div>` : ""}
    </form>`;
    let done = false;
    const finish = (value) => { if (done) return; done = true; dlg.close(); resolve(value); };
    $("[data-x]", dlg).onclick = () => finish(null);
    dlg.oncancel = (e) => { e.preventDefault(); finish(null); };
    const invoke = async (i) => {
      const action = actions[i];
      if (!action.onClick) return finish("value" in action ? action.value : i);
      const btns = $$(".dlg-foot button", dlg);
      btns.forEach((b) => { b.disabled = true; });
      try {
        const result = await action.onClick(dlg);
        if (result !== false) finish(result ?? true);
      } finally {
        btns.forEach((b) => { b.disabled = false; });
      }
    };
    $$(".dlg-foot button", dlg).forEach((b) => { if (!actions[b.dataset.a].submit) b.onclick = () => invoke(Number(b.dataset.a)); });
    $("form", dlg).onsubmit = (e) => {
      e.preventDefault();
      const i = actions.findIndex((a) => a.submit);
      if (i >= 0) invoke(i);
    };
    dlg.showModal();
    if (onOpen) onOpen(dlg);
    const first = $(".dlg-body input:not([type=checkbox]), .dlg-body select, .dlg-body textarea", dlg);
    if (first && !("ontouchstart" in window)) first.focus();
  });
}

    const rows = [];
    if (store.summary.configured === false) rows.push(`<div class="item"><div class="ev-icon k-info">${icon("cog")}</div><div class="grow"><div class="title">Impianto da Configurare</div><div class="meta">${can("impianti") ? 'Aggiungi il controller e le porte in <a href="#impianti">Impianti</a>.' : "Chiedi a un amministratore di configurare il controller."}</div></div></div>`);
    rows.push(...open.slice(0, 5).map((i) => `<a class="item dw-notif sev-${i.severity}" href="#notifiche">
      <div class="n-tile">${icon(i.type === "door_alarm" && i.title.startsWith("Manomissione") ? "shield" : NOTIF_ICONS[i.type] || "bell")}</div>
      <div class="grow"><div class="title">${esc(i.title)} <span class="n-sev">${SEVERITY[i.severity]}</span></div>
        <div class="meta"><span>${esc(i.text)}</span>${i.door ? `<span>${esc(i.door)}</span>` : ""}${i.type !== "expiring" ? `<span>${esc(dayTime(i.ts))}</span>` : ""}</div></div></a>`));
    if (!rows.length) return `<h2>Da Gestire</h2><div class="all-ok" style="margin:0">${icon("check")}<span><b>Tutto in Ordine</b> · nessun evento da gestire</span></div>`;
    return `<h2>Da Gestire <span class="muted">· ${open.length}</span><span class="spacer"></span><a class="small-text" href="#notifiche">${open.length > 5 ? `Tutte le Notifiche (${open.length})` : "Notifiche"}</a></h2><div class="list">${rows.join("")}</div>`;
  },
  accessi_oggi: ({d: {today: t}}) => kpi("Accessi Oggi", t.granted + t.remote, `${t.remote ? `di cui ${plural(t.remote, "apertura remota", "aperture remote")}` : "con tessera"}${!t.granted && t.reads ? ` · ${plural(t.reads, "lettura", "letture")}` : ""}`),
  negati_oggi: ({d: {today: t}}) => kpi("Negati Oggi", t.denied, t.unknown ? plural(t.unknown, "tessera sconosciuta", "tessere sconosciute") : "nessuna tessera sconosciuta", t.denied ? "var(--warn)" : ""),
  allarmi_oggi: ({d: {today: t}}) => kpi("Allarmi Oggi", t.alarms, t.alarms ? "forzature, aperture lunghe, manomissioni" : "nessun allarme", t.alarms ? "var(--err)" : ""),
  persone: ({d}) => kpi("Persone", d.persons, `${plural(d.cards, "tessera", "tessere")}${d.cards_suspended ? `, ${plural(d.cards_suspended, "sospesa", "sospese")}` : ""}${can("persone") ? ' · <a href="#persone">anagrafica</a>' : ""}`),
  porte: ({doors}) => `<h2>${doors.length > 1 ? "Porte" : "Porta"}<span class="spacer"></span>${doors.length > 1 ? '<a class="small-text" href="#porte">Tutte le Porte</a>' : ""}</h2>
    ${doors.length ? doorGroups(doors) : `<div class="empty">Nessuna porta configurata.</div>`}`,
  settimana({d}) {
    const max = Math.max(1, ...d.week.map((w) => w.granted + w.denied));
    const chart = d.week.map((w) => {
      const total = w.granted + w.denied;
      const h = (n) => `${(n / max) * 100}%`;
      const label = new Date(w.day + "T12:00:00").toLocaleDateString("it-IT", {weekday: "short"});
      return `<div class="col" title="${esc(fmtDate(w.day + "T12:00:00"))}: ${w.granted} concessi, ${w.denied} negati${w.unknown ? `, ${plural(w.unknown, "tessera sconosciuta", "tessere sconosciute")}` : ""}">
        <div class="num">${total || ""}</div>
        <div class="bars"><div class="bar g" style="height:${h(w.granted)}"></div><div class="bar d" style="height:${h(w.denied)}"></div></div>
        <div class="lbl">${esc(label)}</div></div>`;
    }).join("");
    // Il diniego del controller conta già la tessera sconosciuta: nel grafico solo concessi e negati
    return `<h2>Ultimi 7 Giorni</h2><div class="chart">${chart}</div>
      <div class="legend"><span><i style="background:var(--ok)"></i>concessi e aperture remote</span><span><i style="background:var(--warn)"></i>negati</span></div>`;
  },
  ultimi_eventi: ({d}) => `<h2>Ultimi Eventi<span class="spacer"></span><a class="small-text" href="#registro">Registro Completo</a></h2>
    <div class="list compact" data-dash-events>${d.recent.length ? logRows(d.recent) : '<div class="empty">nessun evento registrato</div>'}</div>`,
  scadenze: ({d}) => `<h2>Tessere in Scadenza<span class="spacer"></span><a class="small-text" href="#persone">Persone</a></h2>
    ${d.expiring.length ? `<div class="list">${d.expiring.slice(0, 6).map((e) => `<a class="item" href="#persone/${e.id}"><div class="ev-icon k-warn">${icon("clock")}</div><div class="grow"><div class="title">${esc(e.name)}</div><div class="meta">scade ${esc(fmtDateTime(e.valid_to))}</div></div></a>`).join("")}</div>${d.expiring.length > 6 ? `<p class="muted small-text" style="margin:8px 0 0">e altre ${d.expiring.length - 6}</p>` : ""}`
      : '<div class="empty">Nessuna tessera scade nei prossimi 7 giorni.</div>'}`,
  da_registrare: ({unknown}) => `<h2>Tessere da Registrare<span class="spacer"></span><a class="small-text" href="#da-registrare">Da Registrare</a></h2>
    ${unknown.length ? `<div class="list">${unknown.slice(0, 6).map((c) => `<a class="item" href="#da-registrare"><div class="ev-icon k-info">${icon("cardplus")}</div><div class="grow"><div class="title"><code>${esc(c.number)}</code></div><div class="meta"><span>letta ${plural(c.count, "volta", "volte")}</span><span>ultima ${esc(relTime(c.last_seen))}</span></div></div></a>`).join("")}</div>`
      : '<div class="empty">Nessuna tessera da registrare.</div>'}`,
  impianto({d: {system: s}}) {
    const row = (cls, label, value) => `<div class="dw-sys"><span class="dot ${cls}"></span><span class="grow">${label}</span><b>${value}</b></div>`;
    if (!s.configured) return `<h2>Stato Impianto</h2><div class="empty">Nessun controller configurato.</div>`;
    return `<h2>Stato Impianto${can("impianti") ? '<span class="spacer"></span><a class="small-text" href="#impianti/stato">Dettagli</a>' : ""}</h2>
      ${row(s.controller_online === false ? "err" : s.controller_online ? "ok" : "", "Controller", s.controller_online === false ? "non raggiungibile" : s.controller_online ? "in linea" : "stato sconosciuto")}
      ${s.mqtt_connected === null ? "" : row(s.mqtt_connected ? "ok" : "err", "Eventi MQTT", s.mqtt_connected ? "in arrivo" : "non collegati")}
      ${s.casing_open === null ? "" : row(s.casing_open ? "err" : "ok", "Coperchio del Controller", s.casing_open ? "aperto" : "chiuso")}
      ${row("", "Ultimo Evento", s.last_event ? esc(relTime(s.last_event)) : "nessuno")}`;
  },
};
function kpi(label, value, sub, color = "") {
  return `<div class="dw-kpi"><div class="label">${label}</div><div class="value"${color ? ` style="color:${color}"` : ""}>${value}</div><div class="sub">${sub}</div></div>`;
}

async function viewDashboard(el) {

  } catch (err) { el.innerHTML = `<div class="alert err">${esc(err.message)}</div>`; return; }
  // Si arriva qui aprendo la pagina: una modifica lasciata a metà altrove non resta aperta
  dash.layout = (saved.widgets || defaultDash()).filter((w) => WIDGETS[w.type]).map(fitWidget);
  dash.editing = false;
  dash.draft = null;
  const layout = () => dash.draft || dash.layout;
  const unknown = can("persone") ? await api("api/unknown-cards").catch(() => []) : [];
  const ctx = {d, doors, notif, unknown};
  const now = new Date();

  $("#page-sub").textContent = `${day[0].toUpperCase()}${day.slice(1)} · ${fmtTime(now.toISOString())}`;
  $("#page-sub").hidden = false;
  const draw = () => {

    const scroll = window.scrollY;
    const widgets = layout().filter(widgetAllowed);
    const missing = Object.keys(WIDGETS).filter((t) => widgetAllowed({type: t}) && !layout().some((w) => w.type === t));
    $("#top-edit").hidden = dash.editing;
    paintIcons($("#top-edit"));
    el.innerHTML = `
      ${dash.editing ? `<div class="dash-bar"><p class="muted small-text" style="margin:0;flex:1 1 280px">Trascina ${icon("drag")} per spostare un riquadro e ${icon("resize")} nell'angolo per cambiarne larghezza e altezza. Togli con × quelli che non ti servono.</p>
           <button type="button" id="dash-add" ${missing.length ? "" : "disabled"}>${icon("plus")}Aggiungi Riquadro</button>
           <button type="button" class="ghost" id="dash-reset">Ripristina Predefinito</button>
           <button type="button" class="ghost" id="dash-cancel">Annulla</button>
           <button type="button" class="primary" id="dash-save">${icon("check")}Salva</button></div>` : ""}
      <div class="dash ${dash.editing ? "editing" : ""}" id="dash">${widgets.map((w) => `
        <section class="card dw w-${w.size} dw-${w.type}${KPI_WIDGETS.includes(w.type) ? " kpi" : ""}" data-w="${w.type}" style="grid-row:span ${w.height}">
          ${dash.editing ? `<div class="dw-edit">
            <button type="button" class="ghost icon-only dw-handle" aria-label="Sposta ${esc(WIDGETS[w.type].title)}" title="Trascina per spostare (o usa le frecce)">${icon("drag")}</button>
            <span class="dw-name">${esc(WIDGETS[w.type].title)}</span>
            <button type="button" class="ghost icon-only" data-remove aria-label="Togli ${esc(WIDGETS[w.type].title)}" title="Togli">${icon("close")}</button></div>` : ""}
          <div class="dw-body">${WIDGET_BODY[w.type](ctx)}</div>
          ${dash.editing ? `<button type="button" class="dw-resize" aria-label="Ridimensiona ${esc(WIDGETS[w.type].title)}: ${w.size}/4 di larghezza, ${plural(w.height, "riga", "righe")} di altezza" title="Trascina per cambiare larghezza e altezza (o usa le frecce)">${icon("resize")}</button>` : ""}
        </section>`).join("") || `<div class="card dw w-4"><div class="empty">Il cruscotto è vuoto. ${dash.editing ? "Usa Aggiungi Riquadro." : "Premi la matita accanto all'ora per aggiungere i riquadri."}</div></div>`}
      </div>`;
    paintIcons(el);
    window.scrollTo(0, scroll);
    const events = $("[data-dash-events]", el);
    if (events) events.onclick = (e) => {
      const row = e.target.closest("[data-event]");
      if (row && !dash.editing) showEvent(d.recent.find((x) => x.id === Number(row.dataset.event)));
    };
    if (dash.editing) bindDashEdit(el, draw, missing);
    else $("#top-edit").onclick = () => {
      dash.editing = true;
      dash.draft = dash.layout.map((w) => ({...w}));
      pageGuard = {dirty: () => JSON.stringify(dash.draft) !== JSON.stringify(dash.layout), save: saveDash};
      draw();
    };
  };
  const saveDash = async () => {
    const res = await run(() => api("api/dashboard/layout", {method: "PUT", body: {widgets: dash.draft}}), "Cruscotto salvato");
    if (!res) return false;
    dash.layout = res.widgets;
    dash.editing = false;
    dash.draft = null;
    pageGuard = null;
    return true;
  };
  dash.save = async () => { if (await saveDash()) render(); };
  draw();
}
// Modifica del cruscotto: trascinare, larghezza, togliere, aggiungere
function bindDashEdit(el, draw, missing) {
  const grid = $("#dash", el);
  const syncOrder = () => {
    const order = $$(".dw[data-w]", grid).map((s) => s.dataset.w);
    // I riquadri nascosti per i permessi restano in fondo, nell'ordine in cui erano
    dash.draft.sort((a, b) => (order.includes(a.type) ? order.indexOf(a.type) : 99) - (order.includes(b.type) ? order.indexOf(b.type) : 99));
  };
  const leave = () => { dash.editing = false; dash.draft = null; pageGuard = null; render(); };
  $("#dash-save").onclick = () => dash.save();
  $("#dash-cancel").onclick = leave;
  $("#dash-reset").onclick = async () => {
    if (!await confirmBox("Ripristina Predefinito", "Rimettere i riquadri e le larghezze di partenza? Le tue modifiche al cruscotto si perdono.", "Ripristina")) return;
    if (await run(() => api("api/dashboard/layout", {method: "DELETE"}), "Cruscotto ripristinato")) leave();
  };
  $("#dash-add").onclick = async () => {
    let type = "";
    await modal({
      title: "Aggiungi Riquadro",
      body: `<div class="list dw-catalog">${missing.map((t) => `<button type="button" class="item" data-add="${t}"><div class="grow"><div class="title">${esc(WIDGETS[t].title)}</div><div class="meta">${esc(WIDGETS[t].desc)}</div></div>${icon("plus")}</button>`).join("")}</div>`,
      actions: [{label: "Chiudi", value: null}],
      onOpen: (dlg) => {
        paintIcons(dlg);
        $(".dw-catalog", dlg).onclick = (e) => { const b = e.target.closest("[data-add]"); if (b) { type = b.dataset.add; $("[data-x]", dlg).click(); } };
      },
    });
    if (WIDGETS[type]) { dash.draft.push(fitWidget({type})); draw(); }
  };
  grid.onclick = (e) => {
    const section = e.target.closest(".dw[data-w]");
    if (!section) return;
    const w = dash.draft.find((x) => x.type === section.dataset.w);
    if (e.target.closest("[data-remove]")) { dash.draft.splice(dash.draft.indexOf(w), 1); draw(); }
  };
  // Trascinamento con il dito o il mouse: il riquadro si sposta mentre lo porti
  grid.onpointerdown = (e) => {
    const handle = e.target.closest(".dw-handle");
    if (!handle) return;
    e.preventDefault();
    const moving = handle.closest(".dw");
    moving.classList.add("dragging");
    // Ascolto sulla finestra: spostando il riquadro nella pagina il pulsante perderebbe il puntatore
    const move = (ev) => {
      const over = document.elementFromPoint(ev.clientX, ev.clientY)?.closest(".dw[data-w]");
      if (!over || over === moving || !grid.contains(over)) return;
      const r = over.getBoundingClientRect();
      const wide = r.width > grid.clientWidth * 0.8;
      const after = wide ? ev.clientY > r.top + r.height / 2 : ev.clientX > r.left + r.width / 2;
      over.parentNode.insertBefore(moving, after ? over.nextSibling : over);
    };
    const end = () => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", end);
      window.removeEventListener("pointercancel", end);
      moving.classList.remove("dragging");
      syncOrder();
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", end);
    window.addEventListener("pointercancel", end);
  };
  // Maniglia nell'angolo: larghezza e altezza a scatti di griglia, entro i limiti del riquadro
  const resizeTo = (section, w, size, height) => {
    const lim = sizeLimits(w.type);
    w.size = Math.min(4, Math.max(lim.minSize, size));
    w.height = Math.min(lim.maxHeight, Math.max(lim.minHeight, height));
    section.className = section.className.replace(/\bw-\d\b/, `w-${w.size}`);
    section.style.gridRow = `span ${w.height}`;
  };
  grid.addEventListener("pointerdown", (e) => {
    const grip = e.target.closest(".dw-resize");
    if (!grip) return;
    e.preventDefault();
    const section = grip.closest(".dw");
    const w = dash.draft.find((x) => x.type === section.dataset.w);
    const gap = parseFloat(getComputedStyle(grid).rowGap) || 16;
    const row = parseFloat(getComputedStyle(grid).gridAutoRows) || 64;
    const col = (grid.clientWidth - 3 * gap) / 4;
    const top = section.getBoundingClientRect().top + window.scrollY;
    const left = section.getBoundingClientRect().left;
    section.classList.add("resizing");
    const dim = document.createElement("span");
    dim.className = "dw-dim";
    section.append(dim);
    const show = () => { dim.textContent = `${w.size}/4 · ${plural(w.height, "riga", "righe")}`; };
    show();
    const move = (ev) => {
      // Larghezza più piccola che occupa le colonne raggiunte, anche dove i quarti si accorpano
      const cols = Math.max(1, Math.round((ev.clientX - left + gap) / (col + gap)));
      const kpi = section.classList.contains("kpi");
      const size = [2, 3, 4].reduce((best, n) => Math.abs(dashSpan(n, kpi) - cols) < Math.abs(dashSpan(best, kpi) - cols) ? n : best, 1);
      const height = Math.round((ev.clientY + window.scrollY - top + gap) / (row + gap));
      resizeTo(section, w, size, height);
      show();
    };
    const end = () => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", end);
      window.removeEventListener("pointercancel", end);
      draw();
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", end);
    window.addEventListener("pointercancel", end);
  });
  grid.addEventListener("keydown", (e) => {
    const grip = e.target.closest(".dw-resize");
    const step = {ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1]}[e.key];
    if (!grip || !step) return;
    e.preventDefault();
    const section = grip.closest(".dw");
    const w = dash.draft.find((x) => x.type === section.dataset.w);
    resizeTo(section, w, w.size + step[0], w.height + step[1]);
    grip.setAttribute("aria-label", `Ridimensiona ${WIDGETS[w.type].title}: ${w.size}/4 di larghezza, ${plural(w.height, "riga", "righe")} di altezza`);
  });
  grid.onkeydown = (e) => {
    const handle = e.target.closest(".dw-handle");
    if (!handle || !["ArrowLeft", "ArrowUp", "ArrowRight", "ArrowDown"].includes(e.key)) return;
    e.preventDefault();
    const moving = handle.closest(".dw");
    const back = e.key === "ArrowLeft" || e.key === "ArrowUp";
    const sibling = back ? moving.previousElementSibling : moving.nextElementSibling;
    if (!sibling) return;
    grid.insertBefore(moving, back ? sibling : sibling.nextSibling);
    syncOrder();
    handle.focus();
  };
}

// ---------- Porte ----------
// Riquadro di una porta: stato, ultimo passaggio, numeri di oggi
function doorTile(d) {
  const last = d.last ? `<div class="small-text">Ultimo: <b>${esc(d.last.person || (KINDS[d.last.kind] || [d.last.kind])[0])}</b> <span class="muted">· ${esc(relTime(d.last.ts))}</span></div>` : '<div class="small-text muted">Nessun passaggio registrato</div>';
  return `<a class="tile" href="#porte/${d.id}">
    <div class="row" style="flex-wrap:nowrap"><b class="grow" style="font-size:16px;overflow-wrap:anywhere">${esc(d.name)}</b><span class="pill ${doorModeClass(d.mode)}"><span class="dot ${doorModeClass(d.mode)}"></span>${esc(doorModeLabel(d.mode))}</span></div>
    ${last}
    <div class="row small-text muted" style="margin-top:auto">
      <span>Oggi <b class="t">${d.today.granted}</b> accessi${d.today.denied ? ` · <b style="color:var(--warn)">${d.today.denied}</b> negati` : ""}${d.today.alarms ? ` · <b style="color:var(--err)">${d.today.alarms}</b> allarmi` : ""}</span>
      <span class="spacer" style="flex:1"></span>
      ${d.intercom ? `<span title="Videocitofono ${esc(d.intercom)}">${icon("phone")}</span>` : ""}${d.camera ? `<span title="Telecamera ${esc(cameraName(d.camera))}">${icon("camera")}</span>` : ""}
    </div></a>`;
}
// Porte raggruppate per struttura e area; le intestazioni compaiono solo quando servono a distinguere
function doorGroups(doors) {
  const groups = [];
  for (const d of doors) {
    const key = `${d.site_id}:${d.area_id}`;
    let g = groups.find((x) => x.key === key);
    if (!g) groups.push(g = {key, title: placeOf(d), doors: []});
    g.doors.push(d);
  }
  const titled = groups.length > 1 || doors.length > 1;
  return groups.map((g) => `<section class="door-group">${titled && g.title ? `<h3 class="section-title">${icon("building")}${esc(g.title)}</h3>` : ""}<div class="grid tiles">${g.doors.map(doorTile).join("")}</div></section>`).join("");
}
async function viewDoorsPage(el, sub) {
  let doors;
  try { doors = await api("api/door-overview"); } catch (err) { el.innerHTML = `<div class="alert err">${esc(err.message)}</div>`; return; }
  if (!doors.length) {
    el.innerHTML = `<div class="card"><div class="empty">${icon("door")}<br><b>Nessuna porta configurata</b><br>${can("impianti") ? 'Aggiungi controller e porte nella pagina <a href="#impianti">Impianti</a>.' : "Chiedi a un amministratore di configurare l'impianto."}</div></div>`;
    return;
  }
  if (Number(sub)) return viewDoorDetail(el, Number(sub), doors);
  el.innerHTML = doorList(doors);
  paintIcons(el);
  const search = $("#door-q");
  if (search) search.oninput = () => {
    const q = search.value.trim().toLowerCase();
    $$("[data-door-row]", el).forEach((r) => { r.hidden = Boolean(q) && !r.dataset.doorRow.includes(q); });
    $$(".door-group", el).forEach((g) => { g.hidden = !$$("[data-door-row]", g).some((r) => !r.hidden); });
  };
}
// Elenco essenziale delle porte, per struttura e area: il clic apre i dettagli
function doorList(doors) {
  const groups = [];
  for (const d of doors) {
    const key = `${d.site_id}:${d.area_id}`;
    let g = groups.find((x) => x.key === key);
    if (!g) groups.push(g = {key, title: placeOf(d) || "Senza Area", doors: []});
    g.doors.push(d);
  }
  const row = (d) => `<a class="item door-row" href="#porte/${d.id}" data-door-row="${esc(`${d.name} ${placeOf(d)}`.toLowerCase())}">
      <div class="ev-icon ${d.mode === "Locked" ? "k-ok" : d.mode ? "k-warn" : "k-muted"}">${icon("door")}</div>

// ---------- Persone ----------
const personFilters = {q: "", state: "", category: ""};
async function loadPersons() {
  store.persons = await api("api/persons");
  return store.persons;
}
const personTabs = (tab) => `<div class="segmented">${[["", "Persone"], ["tipologie", "Tipologie"]].map(([k, label]) => `<a href="#persone${k ? "/" + k : ""}" class="${tab === k ? "active" : ""}">${label}</a>`).join("")}</div>`;
async function viewPersons(el, sub) {
  if (sub === "tipologie") return viewCategories(el);
  if (sub === "mancanti") { personFilters.state = "mancanti"; sub = ""; history.replaceState(null, "", "#persone"); }

  el.innerHTML = `${personTabs("")}
    <div class="toolbar">
      <input type="search" id="p-q" placeholder="Cerca nome, ditta o numero tessera" value="${esc(personFilters.q)}">
      <select id="p-state">
        <option value="">Tutte le Persone</option><option value="attive">Con Tessere Attive</option><option value="sospese">Con Tessere Sospese</option>
        <option value="in_scadenza">In Scadenza</option><option value="scaduta">Scadute</option><option value="futura">Non Ancora Valide</option>

  $("#p-cats").addEventListener("click", (e) => {

  });
  $("#p-state").value = personFilters.state;
  $("#p-q").addEventListener("input", (e) => { personFilters.q = e.target.value; renderPersonList(); });
  $("#p-state").addEventListener("change", (e) => { personFilters.state = e.target.value; renderPersonList(); });
  $("#p-new").addEventListener("click", () => newPerson());
  $("#p-sync").addEventListener("click", async (e) => {

  });

    openPerson(Number(item.dataset.person));
  });

}
function renderPersonList() {
  const list = $("#p-list");
  if (!list) return;
  const q = personFilters.q.trim().toLowerCase();
  const rows = store.persons.filter((p) => {
    const a = personAccess(p);
    if (q && !(p.name.toLowerCase().includes(q) || (p.company || "").toLowerCase().includes(q) || p.cards.some((c) => c.number.toLowerCase().includes(q)))) return false;
    if (personFilters.category !== "" && (p.category_id || 0) !== Number(personFilters.category)) return false;
    const st = personFilters.state;
    if (st === "attive" && !p.cards.some((c) => c.enabled)) return false;
    if (st === "sospese" && !p.cards.some((c) => !c.enabled)) return false;
    if (["in_scadenza", "scaduta", "futura"].includes(st) && validityState(a.from, a.to) !== st) return false;
    if (st === "mancanti" && !p.cards.some((c) => c.missing_since)) return false;
    return true;
  });
  renderMissingBanner();
  const cards = store.persons.reduce((n, p) => n + p.cards.length, 0);
  $("#p-count").textContent = `${plural(store.persons.length, "persona", "persone")} · ${plural(cards, "tessera", "tessere")}` + (rows.length !== store.persons.length ? ` · ${rows.length} mostrate` : "");
  // Tipologie come filtri rapidi, con il numero di persone di ognuna
  const count = (id) => store.persons.filter((p) => (p.category_id || 0) === id).length;
  const chip = (value, label, n, color = "") => `<button type="button" class="chip-btn ${personFilters.category === value ? "on" : ""}" data-cat="${value}">${color ? `<span class="swatch c-${esc(color)}"></span>` : ""}${esc(label)} <span class="muted">${n}</span></button>`;
  const none = count(0);
  $("#p-cats").innerHTML = store.categories.length ? chip("", "Tutte", store.persons.length) + store.categories.map((c) => chip(String(c.id), c.name, count(c.id), c.color)).join("") + (none ? chip("0", "Senza Tipologia", none) : "") : "";
  // Elenco essenziale: nome e tipologia, un'etichetta solo se c'è qualcosa da sistemare; il resto è nella scheda
  const sorted = [...rows].sort((a, b) => a.name.localeCompare(b.name, "it", {sensitivity: "base"}));
  let letter = "";
  list.innerHTML = sorted.length ? sorted.map((p) => {
    const a = personAccess(p);
    const vs = validityState(a.from, a.to);
    const suspended = p.cards.length && !p.cards.some((c) => c.enabled);
    const flag = p.cards.some((c) => c.missing_since) ? '<span class="pill err" title="Tessera sparita dal controller: riscrivila o toglila dall\'app">Non Sul Controller</span>'
      : !p.cards.length ? '<span class="pill">Senza Tessera</span>' : suspended ? '<span class="pill">Sospesa</span>' : VALIDITY_PILL[vs] || (customAccess(p) ? '<span class="pill warn" title="Accesso diverso da quello della tipologia">Accesso Personalizzato</span>' : "");
    const c = categoryOf(p.category_id);
    const first = (p.name.trim()[0] || "#").toLocaleUpperCase("it");
    const head = sorted.length > 12 && first !== letter ? `<div class="day">${esc(first)}</div>` : "";
    letter = first;
    return `${head}<div class="person-row" data-person="${p.id}" role="button" tabindex="0">
      <span class="swatch ${c ? `c-${esc(c.color)}` : ""}" title="${esc(c?.name || "Senza tipologia")}" ${c ? "" : 'style="background:var(--border-strong)"'}></span>
      <span class="name">${esc(p.name)}</span>${flag}
    </div>`;
  }).join("") : `<div class="empty">${store.persons.length ? "nessuna persona corrisponde ai filtri" : "nessuna persona registrata: passa una tessera sul lettore e registrala da \"Da registrare\""}</div>`;
}

// Tessere sparite dal controller (reset, sostituzione, cancellate a mano): l'app non le cancella da sola
function renderMissingBanner() {
  const box = $("#p-missing");
  if (!box) return;
  const cards = store.persons.flatMap((p) => p.cards.filter((c) => c.missing_since));
  if (!cards.length) { box.innerHTML = ""; return; }
  const persons = store.persons.filter((p) => p.cards.some((c) => c.missing_since)).length;
  box.innerHTML = `<div class="alert err stack">${icon("alert")}<div class="grow"><b>${plural(cards.length, "Tessera Non Presente", "Tessere Non Presenti")} Sul Controller</b>
      ${plural(persons, "persona ha", "persone hanno")} tessere che l'app conosce ma che sul controller non ci sono più, per esempio dopo un reset o una sostituzione. L'app non le cancella da sola: riscrivile sul controller con gruppo e validità salvati, oppure toglile dall'app.
      ${personFilters.state === "mancanti" ? "" : ' <a href="#persone/mancanti">Mostra Solo Queste</a>'}</div>
    <div class="row w-persone" style="flex-wrap:nowrap"><button type="button" class="small primary" id="m-restore">Riscrivi Sul Controller</button><button type="button" class="small danger" id="m-forget">Togli dall'App</button></div></div>`;
  paintIcons(box);
  $("#m-restore").onclick = () => restoreMissing();
  $("#m-forget").onclick = () => forgetMissing();
}
async function restoreMissing(ids = null) {
  const r = await run(() => api("api/missing-cards/restore", {method: "POST", body: {ids}}));
  if (!r) return false;
  if (r.failed.length) {
    await modal({title: "Tessere Non Riscritte", body: `<p style="margin-top:0">${plural(r.restored, "tessera riscritta", "tessere riscritte")}, ${plural(r.failed.length, "non riuscita", "non riuscite")}:</p>
      <div class="list">${r.failed.map((f) => `<div class="item" style="padding-left:0"><div class="grow"><div class="title">${esc(f.person)} · <code>${esc(f.card)}</code></div><div class="meta">${esc(f.error)}</div></div></div>`).join("")}</div>
      <p class="hint">Se manca il gruppo sul controller (dopo un reset) va ripristinata prima la configurazione del controller.</p>`, actions: [{label: "Chiudi", value: true}]});
  } else toast(`${plural(r.restored, "tessera riscritta", "tessere riscritte")} sul controller`);
  loadSummary();
  await loadPersons();
  renderPersonList();
  return true;
}
async function forgetMissing(ids = null) {
  const n = ids ? ids.length : store.persons.reduce((k, p) => k + p.cards.filter((c) => c.missing_since).length, 0);
  if (!await confirmBox("Togli dall'App", `Togliere dall'app ${n === 1 ? "la tessera non presente" : `le ${n} tessere non presenti`} sul controller? Le persone rimaste senza tessere spariscono con ditta, note e tipologia. Il registro dei passaggi resta.`, "Togli", true)) return false;
  const r = await run(() => api("api/missing-cards/forget", {method: "POST", body: {ids}}), "Tessere tolte dall'app");
  if (!r) return false;
  loadSummary();
  await loadPersons();
  renderPersonList();
  return true;
}

function validityFields(from = "", to = "") {
  const limited = Boolean(from || to);
  return `<div class="field inline"><input type="checkbox" name="limited" id="f-limited" ${limited ? "checked" : ""}><label for="f-limited">Validità Limitata (ospiti, imprese, temporanei)</label></div>
    <div id="f-validity" ${limited ? "" : "hidden"}>
      <div class="fields-2">${field("Valida dal", `<input type="datetime-local" name="valid_from" value="${esc(toLocalInput(from))}">`)}
      ${field("Valida fino al", `<input type="datetime-local" name="valid_to" value="${esc(toLocalInput(to))}">`)}</div>
      <div class="presets"><span class="muted small-text">Da adesso:</span>
        <button type="button" class="small" data-preset="1">1 Giorno</button><button type="button" class="small" data-preset="7">1 Settimana</button>
        <button type="button" class="small" data-preset="30">1 Mese</button><button type="button" class="small" data-preset="365">1 Anno</button></div>
    </div>`;
}
function bindValidity(dlg) {
  const box = $("#f-validity", dlg);
  if (!box) return;
  $("#f-limited", dlg).addEventListener("change", (e) => { box.hidden = !e.target.checked; });
  $$("[data-preset]", dlg).forEach((b) => b.addEventListener("click", () => {
    const now = new Date();
    now.setSeconds(0, 0);
    const end = new Date(now.getTime() + Number(b.dataset.preset) * 86400000);
    $("[name=valid_from]", dlg).value = toLocalInput(now.toISOString());
    $("[name=valid_to]", dlg).value = toLocalInput(end.toISOString());
  }));
}
function readValidity(dlg) {
  if (!val(dlg, "limited")) return {valid_from: "", valid_to: ""};
  return {valid_from: fromLocalInput(val(dlg, "valid_from")), valid_to: fromLocalInput(val(dlg, "valid_to"))};
}

      ${field("Numero Tessera", `<input name="card" class="mono" autocomplete="off" value="${esc(card)}" placeholder="es. 04A1B2C3D4E5F6">`, card ? "" : "Più comodo: passa la tessera sul lettore e registrala da \"Da Registrare\".")}

// Viste del registro: con tanto passaggio si guarda prima quello che richiede attenzione
const LOG_VIEWS = {
  controllo: ["Da Controllare", "negato,sconosciuta,allarme,manomissione"],
  negati: ["Solo Negati", "negato,sconosciuta"],
  accessi: ["Solo Accessi", "concesso,apertura_remota,citofono"],
  allarmi: ["Allarmi", "allarme,manomissione"],
  tutto: ["Tutto", ""],
};
const ACCESS_KINDS = "concesso,apertura_remota,citofono,lettura";
const savedView = () => { try { return localStorage.getItem("aam-log-view") || "controllo"; } catch (err) { return "controllo"; } };
const logFilters = {q: "", view: savedView(), door: "", from: "", to: ""};
let logEvents = [];
let logSelected = 0;
function logParams(extra = {}) {
  const p = new URLSearchParams();
  if (logFilters.q) p.set("q", logFilters.q);
  const kinds = (LOG_VIEWS[logFilters.view] || LOG_VIEWS.tutto)[1];
  if (kinds) p.set("kind", kinds);
  if (logFilters.door) p.set("door", logFilters.door);
  if (logFilters.from) p.set("since", new Date(logFilters.from + "T00:00:00").toISOString());
  if (logFilters.to) p.set("until", new Date(new Date(logFilters.to + "T00:00:00").getTime() + 86400000).toISOString());
  Object.entries(extra).forEach(([k, v]) => p.set(k, v));
  return p;
}
const KIND_DOT = {"k-ok": "ok", "k-warn": "warn", "k-err": "err", "k-info": "info", "k-accent": "accent", "k-muted": ""};
// Riga compatta: ora, colore dell'esito, chi, cosa, dove
function logRow(e) {
  const [label, cls] = KINDS[e.kind] || [e.kind, "k-muted"];
  const who = e.person_name || (e.card ? `Tessera ${e.card}` : e.kind === "citofono" ? e.source || "Citofono" : e.kind === "apertura_remota" ? e.source || "Home Assistant" : "");
  let what = who ? label.replace(/^Accesso /, "").replace(/^Tessera /, "") : label;
  if (what.toLowerCase() === who.toLowerCase()) what = "";
  return `<div class="ev ${e.id === logSelected ? "sel" : ""}" data-event="${e.id}" role="button" tabindex="0" title="${esc(fmtFull(e.ts))}">
    <span class="time">${esc(fmtTime(e.ts))}</span><span class="dot ${KIND_DOT[cls] || ""}"></span>
    <span class="what">${who ? `<b>${esc(who)}</b> <span class="muted">${esc(what.toLowerCase())}</span>` : `<b>${esc(label)}</b>`}${e.snapshot ? ` <span class="muted" title="con istantanea">${icon("camera", "icon")}</span>` : ""}${e.recovered ? ' <span class="muted small-text" title="Recuperato dal registro interno del controller">· recuperato</span>' : ""}</span>
    ${multiDoor() ? `<span class="where">${esc(eventPlace(e))}</span>` : "<span></span>"}
  </div>`;
}
function eventDetail(e) {
  const [label, cls] = KINDS[e.kind] || [e.kind, "k-muted"];
  const door = doorByToken(e.door) || (!multiDoor() && !controllerEvent(e) ? allDoors()[0] : null);
  const rows = [
    ["Quando", esc(fmtFull(e.ts))],
    door ? ["Porta", `${can("stato") ? `<a href="#porte/${door.id}">${esc(door.name)}</a>` : esc(door.name)}${placeOf(door) ? ` <span class="muted">· ${esc(placeOf(door))}</span>` : ""}`] : e.door ? ["Porta", `<code>${esc(e.door)}</code>`] : null,
    e.person_name ? ["Persona", e.person_id && can("persone") ? `<a href="#persone/${e.person_id}">${esc(e.person_name)}</a>` : esc(e.person_name)] : null,
    e.card ? ["Tessera", `<code>${esc(e.card)}</code>`] : null,
    e.detail ? ["Dettaglio", esc(e.detail)] : null,
    e.snapshot_error ? ["Foto", `<span style="color:var(--warn)">non scattata: ${esc(e.snapshot_error)}</span>`] : null,
    e.recovered ? ["Recuperato", "Arrivato in ritardo dal registro interno del controller (MQTT o add-on fermi in quel momento): senza foto e senza evento in Home Assistant"] : null,
    controllerEvent(e) ? ["Controller", esc(e.source || "Controller")] : e.source ? ["Origine", esc(e.source)] : null,
  ].filter(Boolean);
  return `<div class="row" style="margin-bottom:10px"><span class="pill ${KIND_DOT[cls] || ""}">${esc(label)}</span><span class="spacer" style="flex:1"></span><span class="muted small-text">${esc(relTime(e.ts))}</span></div>
    ${e.snapshot ? `<img class="thumb" style="width:100%;height:auto;aspect-ratio:16/9;margin-bottom:12px" loading="lazy" src="api/events/${e.id}/snapshot" alt="istantanea" data-snap="${e.id}" data-title="${esc(label + " · " + fmtFull(e.ts))}">` : ""}
    ${props(rows)}
    <div class="row" style="margin-top:14px">
      ${e.person_id && can("persone") ? `<a class="btn small" href="#persone/${e.person_id}">${icon("user")}Scheda Persona</a>` : ""}
      ${e.kind === "sconosciuta" && can("persone_modifica") ? `<a class="btn small primary" href="#da-registrare">${icon("cardplus")}Registra Tessera</a>` : ""}
      ${e.person_name ? `<button type="button" class="small" data-same="${esc(e.person_name)}">Tutti i Suoi Eventi</button>` : ""}
    </div>`;
}
function showEvent(e) {

  };

    panel.hidden = false;
    panel.innerHTML = `<div class="card log-detail"><h2>Dettaglio Evento<span class="spacer"></span><button type="button" class="ghost icon-only" id="l-detail-x" aria-label="Chiudi">${icon("close")}</button></h2>${eventDetail(e)}</div>`;
    $(".log-layout").classList.add("split");
    $("#l-detail-x").onclick = () => { panel.hidden = true; $(".log-layout").classList.remove("split"); logSelected = 0; $$(".list.compact > .ev.sel").forEach((r) => r.classList.remove("sel")); };
    bind(panel, () => {});
  } else {
    modal({title: "Dettaglio Evento", body: eventDetail(e), onOpen: (dlg) => { bindSnapshots(dlg); bind(dlg, () => dlg.close()); }});
  }
}
async function viewLog(el) {
  const doors = allDoors();
  const doorSelect = doors.length > 1 ? `<select id="l-door" aria-label="Porta"><option value="">Tutte le Porte</option>${doorOptionGroups(doors, logFilters.door)}</select>` : "";
  el.innerHTML = `
    <div class="toolbar">
      <div class="segmented" style="margin:0" role="tablist" aria-label="Vista">${Object.entries(LOG_VIEWS).map(([k, [label]]) => `<a href="#registro" role="tab" data-view="${k}" class="${logFilters.view === k ? "active" : ""}">${label}</a>`).join("")}</div>
      ${doorSelect}
      <input type="date" id="l-from" value="${esc(logFilters.from)}" title="Dal giorno" aria-label="Dal giorno">
      <input type="date" id="l-to" value="${esc(logFilters.to)}" title="Al giorno" aria-label="Al giorno">
      <input type="search" id="l-q" placeholder="Cerca nome, tessera o dettaglio" value="${esc(logFilters.q)}">
      <a class="btn w-io" id="l-export" href="#" download title="Scarica gli eventi di questa vista">${icon("download")}CSV</a>
    </div>
    <div class="log-layout">
      <div class="card flush" style="margin:0"><div class="list compact" id="l-list"><div class="loading"><span class="spinner"></span></div></div>
        <div class="hidden-count" id="l-hidden" hidden></div>
        <div style="text-align:center;padding:12px" id="l-more-box" hidden><button type="button" id="l-more">Carica Altri</button></div></div>
      <div id="l-detail" hidden></div>
    </div>`;
  logSelected = 0;
  let timer;
  $$("[data-view]", el).forEach((a) => a.addEventListener("click", (e) => {
    e.preventDefault();
    logFilters.view = a.dataset.view;
    try { localStorage.setItem("aam-log-view", logFilters.view); } catch (err) { /* facoltativo */ }
    $$("[data-view]", el).forEach((x) => x.classList.toggle("active", x === a));
    loadLog();
  }));
  $("#l-q").addEventListener("input", (e) => { logFilters.q = e.target.value.trim(); clearTimeout(timer); timer = setTimeout(() => loadLog(), 300); });
  if ($("#l-door")) $("#l-door").addEventListener("change", (e) => { logFilters.door = e.target.value; loadLog(); });
  $("#l-from").addEventListener("change", (e) => { logFilters.from = e.target.value; loadLog(); });
  $("#l-to").addEventListener("change", (e) => { logFilters.to = e.target.value; loadLog(); });
  $("#l-more").addEventListener("click", () => loadLog(true));
  const list = $("#l-list");
  const pick = (e) => { const row = e.target.closest("[data-event]"); if (row) showEvent(logEvents.find((x) => x.id === Number(row.dataset.event))); };
  list.addEventListener("click", pick);
  list.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(e); } });
  $("#l-hidden").addEventListener("click", (e) => {
    if (!e.target.closest("[data-show-all]")) return;

    loadLog();

  bindSnapshots(el);
  await loadLog();
}
async function loadLog(more = false) {
  const params = logParams({limit: "100"});
  if (more && logEvents.length) params.set("before_id", logEvents[logEvents.length - 1].id);
  const data = await run(() => api("api/events?" + params));
  if (!data || !$("#l-list")) return;
  logEvents = more ? logEvents.concat(data) : data;
  renderLog();
  $("#l-more-box").hidden = data.length < 100;
  $("#l-export").href = "api/export/events.csv?" + logParams();
  if (!more) updateHiddenCount();
}
// Nelle viste filtrate dice quanti accessi riusciti non si vedono, senza mostrarli tutti
async function updateHiddenCount() {
  const box = $("#l-hidden");
  if (!box) return;
  const kinds = (LOG_VIEWS[logFilters.view] || LOG_VIEWS.tutto)[1];
  if (!kinds || kinds.includes("concesso")) { box.hidden = true; return; }
  const p = logParams({kind: ACCESS_KINDS});
  if (!logFilters.from && !logFilters.to) p.set("since", new Date(new Date().setHours(0, 0, 0, 0)).toISOString());
  const r = await api("api/events/count?" + p).catch(() => null);
  if (!r || !$("#l-hidden")) return;
  box.hidden = !r.count;
  box.innerHTML = `<span class="pill ok">${r.count}</span><span style="flex:1">${r.count === 1 ? "accesso riuscito non mostrato" : "accessi riusciti non mostrati"} in questa vista${logFilters.from || logFilters.to ? "" : " (oggi)"}</span><a href="#registro" data-show-all>Mostra Tutto</a>`;
}
// Righe del registro con l'intestazione del giorno quando cambia
function logRows(events) {
  let lastDay = "";
  const today = new Date().toDateString(), yesterday = new Date(Date.now() - 86400000).toDateString();
  return events.map((e) => {
    const d = new Date(e.ts);
    const day = d.toDateString() === today ? "Oggi" : d.toDateString() === yesterday ? "Ieri" : d.toLocaleDateString("it-IT", {weekday: "long", day: "numeric", month: "long", year: "numeric"});
    const head = day !== lastDay ? `<div class="day">${esc(day)}</div>` : "";
    lastDay = day;
    return head + logRow(e);
  }).join("");
}
function renderLog() {
  $("#l-list").innerHTML = logEvents.length ? logRows(logEvents) : `<div class="empty">${logFilters.view === "controllo" && !logFilters.q ? "niente da controllare: nessun rifiuto o allarme" : "nessun evento con questi filtri"}</div>`;
}
async function refreshLog() {
  // Solo se si guarda la cima del registro senza ricerca né date
  if (logFilters.q || logFilters.from || logFilters.to || window.scrollY > 200) return;
  const data = await api("api/events?" + logParams({limit: "100"})).catch(() => null);
  if (!data || !$("#l-list")) return;
  updateHiddenCount();
  if (data.length && logEvents.length && data[0].id === logEvents[0].id) return;
  logEvents = data;
  renderLog();
}
// Opzioni porta raggruppate per struttura e area
function doorOptionGroups(doors, selected = "") {
  const groups = {};
  doors.forEach((d) => { (groups[placeOf(d) || "Porte"] ||= []).push(d); });
  return Object.entries(groups).map(([place, list]) => `<optgroup label="${esc(place)}">${list.map((d) => `<option value="${esc(d.token)}" ${d.token === selected ? "selected" : ""}>${esc(d.name)}</option>`).join("")}</optgroup>`).join("");
}
function bindSnapshots(root) {
  // #view resta lo stesso fra le pagine: un solo ascoltatore, altrimenti a ogni visita si apre una foto in più
  if (root.dataset.snapBound) return;
  root.dataset.snapBound = "1";

// ---------- Regole ----------
function weekPreview(rules) {
  const rows = DAYS.map(([code, , name]) => {
    const segs = rules.filter((r) => r.days.includes(code)).map((r) => {
      const toMin = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
      const left = (toMin(r.start) / 1440) * 100, width = ((toMin(r.end) - toMin(r.start)) / 1440) * 100;
      return width > 0 ? `<span class="seg" style="left:${left}%;width:${width}%" title="${r.start}-${r.end}"></span>` : "";
    }).join("");
    return `<span>${name}</span><div class="track">${segs}</div>`;
  }).join("");
  return `<div class="week">${rows}<span></span><div class="axis"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div></div>`;
}

async function viewInstallation(el, sub) {
  const [first, tab = ""] = sub.split("/");
  const match = /^c(\d+)$/.exec(first);
  const tabs = [...(can("impianti") ? [["controller", "Controller"], ["strutture", "Strutture e Aree"]] : []), ...(can("backup") ? [["backup", "Backup"]] : [])];
  const pageTabs = (active) => tabs.length > 1 ? `<div class="segmented">${tabs.map(([k, label]) => `<a href="#impianti/${k}" class="${active === k ? "active" : ""}">${label}</a>`).join("")}</div>` : "";
  // Chi ha solo il permesso Backup vede solo la scheda Backup
  if (first === "backup" || !can("impianti")) {
    el.innerHTML = `${pageTabs("backup")}<div id="i-body">${loadingBox()}</div>`;
    return viewBackups($("#i-body"));
  }
  let data;
  const hash = location.hash;
  el.innerHTML = loadingBox();
  try { data = await api("api/installation"); } catch (err) { el.innerHTML = errorBox("Impianti Non Leggibili", err); return; }
  // Cambiata scheda mentre si leggeva (per esempio Backup): non scrive sopra la pagina nuova
  if (location.hash !== hash) return;
  if (first === "programmazione" && data.controllers[0]) { location.replace(`#impianti/c${data.controllers[0].id}`); return; }
  if (first === "stato" && data.controllers[0]) { location.replace(`#impianti/c${data.controllers[0].id}/stato`); return; }
  if (match) {
    const ctrl = data.controllers.find((c) => c.id === Number(match[1]));
    if (!ctrl) { el.innerHTML = `<div class="card"><div class="empty">Controller non trovato. <a href="#impianti">Torna agli Impianti</a></div></div>`; return; }
    $("#page-title").textContent = ctrl.name;
    return tab === "connessione" ? viewConnection(el, ctrl) : viewController(el, ctrl, tab);
  }
  const active = first === "strutture" ? "strutture" : "controller";
  el.innerHTML = `${pageTabs(active)}<div id="i-body">${loadingBox()}</div>`;
  const body = $("#i-body");
  if (active === "strutture") return viewSites(body, data);
  await viewControllers(body, data);
  paintIcons(body);
}

// Spia del controller dal controllo periodico (ogni 30 secondi): [classe, descrizione]
function healthState(h) {
  if (!h) return ["", "Verifica del collegamento…"];
  if (h.identity_change) return ["err", "Controller cambiato: scritture sospese finché non confermi"];
  if (h.unreachable) return ["err", `Non raggiungibile: ${h.error || "nessuna risposta"}`];
  if (h.online === false) return ["warn", `Non ha risposto all'ultimo controllo: ${h.error || ""}`];
  if (h.clock_problem) return ["warn", `Orologio sbagliato di ${offsetText(h.clock_offset)}`];
  return ["ok", "Collegato"];
}
const offsetText = (sec) => {
  const way = sec > 0 ? "avanti" : "indietro", v = Math.abs(sec);
  return v >= 3600 ? `${(v / 3600).toFixed(1).replace(".", ",")} ore ${way}` : v >= 120 ? `${Math.round(v / 60)} min ${way}` : `${Math.round(v)} s ${way}`;
};
// Controller cambiato: avviso con la conferma (solo amministratori) in tutte le pagine del controller
function identityAlert(ctrl) {
  const h = ctrl.health;
  if (!h?.identity_change) return "";
  const k = h.known || {};
  const row = (label, before, after) => before && after && before !== after ? `<tr><td>${label}</td><td><code>${esc(before)}</code></td><td><code>${esc(after)}</code></td></tr>` : "";
  return `<div class="alert err stack">${icon("alert")}<div class="grow"><b>Controller Cambiato</b>All'indirizzo <code>${esc(ctrl.host)}</code> risponde un apparecchio diverso da quello memorizzato. Finché non confermi, l'app non scrive niente sul controller e non rilegge le tessere.
      <div class="table-wrap" style="margin-top:8px"><table class="table"><thead><tr><th></th><th>Memorizzato</th><th>Trovato</th></tr></thead><tbody>
        ${row("Numero di Serie", k.serial, h.serial)}${row("Modello", k.model, h.model)}${row("Certificato", (k.cert_fingerprint || "").slice(0, 23), (h.cert_fingerprint || "").slice(0, 23))}</tbody></table></div>
      <p class="hint" style="margin-bottom:0">Conferma solo se il controller è stato davvero sostituito o resettato. Dopo la conferma le tessere che non trova restano segnate in Persone, da riscrivere o togliere.</p></div>
    ${store.me.admin ? `<button type="button" class="small primary" data-accept-identity="${ctrl.id}">Conferma Nuovo Controller</button>` : '<span class="small-text muted">Serve un amministratore</span>'}</div>`;
}
function bindIdentityAlert(root, ctrl) {
  const b = $("[data-accept-identity]", root);
  if (!b) return;
  b.onclick = async () => {
    if (!await confirmBox("Conferma Nuovo Controller", `Da ora <b>${esc(ctrl.name)}</b> è l'apparecchio con numero di serie <code>${esc(ctrl.health.serial)}</code>. Le scritture ripartono e le tessere vengono rilette.`, "Conferma")) return;
