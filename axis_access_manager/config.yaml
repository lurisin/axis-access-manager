name: Axis Access Manager
version: "0.28.1"
slug: axis_access_manager
description: Gestione tessere e controllo accessi per il controller Axis A1210
url: https://github.com/lurisin/axis-access-manager
arch:
  - aarch64
  - amd64
init: false
ingress: true
panel_icon: mdi:card-account-details
panel_title: Controllo Accessi
panel_admin: false
homeassistant_api: true
# Istantanee delle telecamere in Media → axis_access_manager
map:
  - media:rw
# Accesso diretto per il personale (fuori da Home Assistant): chiusa finché non le si assegna una porta nella scheda
# Rete dell'add-on, e va accesa anche nelle impostazioni dell'app
ports:
  8100/tcp: null
ports_description:
  8100/tcp: Accesso diretto all'app per il personale
services:
  - mqtt:want
# Copia coerente del database subito prima di ogni backup di Home Assistant
backup_pre: python3 /opt/axis_access_manager/app/backup_copy.py
# Fuori dal backup di Home Assistant: le copie prima degli aggiornamenti e i database danneggiati servono solo sul posto
backup_exclude:
  - copie_database/*
  - "*_danneggiato_*"
options:
  event_retention_days: 365
  ha_integration: true
  ha_topic_prefix: axis_access_manager
  log_level: info
# Controller, porte, citofono e telecamere si configurano nell'app (pagina Impianti).
schema:
  event_retention_days: int(1,3650)
  ha_integration: bool
  ha_topic_prefix: str
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
  log_level: list(debug|info|warning|error)
