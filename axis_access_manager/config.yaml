name: Axis Access Manager
version: "0.21.6"
slug: axis_access_manager
description: Gestione tessere e controllo accessi per il controller Axis A1210
url: https://github.com/lurisin/axis-access-manager
arch:
  - aarch64
  - amd64
init: false
ingress: true
panel_icon: mdi:card-account-details
panel_title: Controllo Accessi
panel_admin: false
homeassistant_api: true
# Istantanee delle telecamere in Media → axis_access_manager
map:
  - media:rw
services:
  - mqtt:want
# Copia coerente del database subito prima di ogni backup di Home Assistant
backup_pre: python3 /opt/axis_access_manager/app/backup_copy.py
options:
  event_retention_days: 365
  ha_integration: true
  ha_topic_prefix: axis_access_manager
  log_level: info
# Controller, porte, citofono e telecamere si configurano nell'app (pagina Impianti).
schema:
  event_retention_days: int(1,3650)
  ha_integration: bool
  ha_topic_prefix: str
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
  log_level: list(debug|info|warning|error)
