name: Axis Access Manager
version: "0.3.0"
slug: axis_access_manager
description: Gestione tessere e controllo accessi per il controller Axis A1210
url: https://github.com/lurisin/axis-access-manager
arch:
  - aarch64
  - amd64
init: false
ingress: true
panel_icon: mdi:card-account-details
panel_title: Controllo accessi
homeassistant_api: true
services:
  - mqtt:want
options:
  a1210_host: ""
  a1210_username: ""
  a1210_password: ""
  a1210_verify_ssl: false
  door_token: porta_via_consulta_ingresso_scala
  access_profile: profilo_via_consulta_ingresso_scala_sempre
  event_retention_days: 365
  mqtt_topic_prefix: accessi/via_consulta_controller
  ha_integration: true
  ha_door_buttons: true
  ha_topic_prefix: axis_access_manager
  snapshot_camera: ""
  snapshot_on_granted: false
  readonly_users: []
  log_level: info
schema:
  a1210_host: str
  a1210_username: str
  a1210_password: password
  a1210_verify_ssl: bool
  door_token: str
  access_profile: str
  event_retention_days: int(1,3650)
  mqtt_topic_prefix: str
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
  ha_integration: bool
  ha_door_buttons: bool
  ha_topic_prefix: str
  snapshot_camera: str?
  snapshot_on_granted: bool
  readonly_users:
    - str
  log_level: list(debug|info|warning|error)
